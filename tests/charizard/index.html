<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Graphics Engine - Charizard Neon Style Test</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { font-size: 14px; color: #ff44ff; text-shadow: 0 0 10px #ff44ff, 0 0 20px #ff44ff44; margin-bottom: 6px; }
    .subtitle { font-size: 8px; color: #666; margin-bottom: 16px; }
    .canvas-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
    .canvas-container { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .canvas-container label { font-size: 7px; color: #666; }
    canvas { border: 1px solid #111; image-rendering: pixelated; background: #000; }
    #status { font-size: 8px; color: #44ff44; text-shadow: 0 0 6px #44ff44; margin: 8px 0; }
    .palette-selector { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
    .palette-btn {
      background: transparent; border: 1px solid #333; color: #888;
      font-family: 'Press Start 2P', monospace; font-size: 7px;
      padding: 6px 10px; cursor: pointer; transition: all 0.2s;
    }
    .palette-btn:hover, .palette-btn.active { border-color: currentColor; text-shadow: 0 0 8px currentColor; box-shadow: 0 0 8px currentColor; }
    .controls { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .control-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .control-group label { font-size: 6px; color: #555; }
    input[type="range"] { width: 100px; accent-color: #ff44ff; }
  </style>
</head>
<body>
  <h1>NEON STYLE CONVERSION TEST</h1>
  <p class="subtitle">Source Image -> Neonification Pipeline -> Multi-Layer Bloom</p>

  <div class="palette-selector">
    <button class="palette-btn active" data-palette="inferno" style="color: #ff44ff;">NEON INFERNO</button>
    <button class="palette-btn" data-palette="ocean" style="color: #4488ff;">ELECTRIC OCEAN</button>
    <button class="palette-btn" data-palette="jungle" style="color: #44ff44;">TOXIC JUNGLE</button>
    <button class="palette-btn" data-palette="solar" style="color: #ff8844;">SOLAR STORM</button>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>DETAIL PRESERVE</label>
      <input type="range" id="detail" min="0" max="100" value="65">
    </div>
    <div class="control-group">
      <label>OUTLINE BRIGHT</label>
      <input type="range" id="outline" min="0" max="200" value="100">
    </div>
    <div class="control-group">
      <label>INTERIOR BRIGHT</label>
      <input type="range" id="interior" min="0" max="100" value="35">
    </div>
    <div class="control-group">
      <label>GLOW RADIUS</label>
      <input type="range" id="glowRadius" min="1" max="8" value="3">
    </div>
    <div class="control-group">
      <label>BLOOM INTENSITY</label>
      <input type="range" id="bloomInt" min="0" max="100" value="60">
    </div>
  </div>

  <div class="canvas-row">
    <div class="canvas-container">
      <label>SOURCE (HIGH-DETAIL)</label>
      <canvas id="source" width="256" height="256"></canvas>
    </div>
    <div class="canvas-container">
      <label>NEONIFIED</label>
      <canvas id="neonified" width="256" height="256"></canvas>
    </div>
    <div class="canvas-container">
      <label>NEON + BLOOM</label>
      <canvas id="bloomed" width="256" height="256"></canvas>
    </div>
  </div>

  <div class="canvas-row">
    <div class="canvas-container">
      <label>FULL SCENE COMPOSITE</label>
      <canvas id="scene" width="900" height="500"></canvas>
    </div>
  </div>

  <p id="status">Initializing engine...</p>

  <script type="module">
    // ══════════════════════════════════════════════════════════════════
    // ENGINE CORE (inlined for standalone test — in production, import from package)
    // ══════════════════════════════════════════════════════════════════

    function rgba(r, g, b, a = 1) { return [r, g, b, a]; }
    function withAlpha(c, a) { return [c[0], c[1], c[2], a]; }
    function css(c) { return `rgba(${c[0]},${c[1]},${c[2]},${c[3]})`; }
    function lerpColor(a, b, t) {
      return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t),
              Math.round(a[2]+(b[2]-a[2])*t), a[3]+(b[3]-a[3])*t];
    }
    function hslToRgba(h, s, l, a = 1) {
      s /= 100; l /= 100;
      const c = (1 - Math.abs(2*l-1))*s, x = c*(1-Math.abs((h/60)%2-1)), m = l-c/2;
      let r=0,g=0,b=0;
      if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}
      else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
      return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255),a];
    }
    function rgbaToHsl(c) {
      const r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
      let h=0,s=0;
      if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
        if(mx===r)h=((g-b)/d+(g<b?6:0))*60;else if(mx===g)h=((b-r)/d+2)*60;else h=((r-g)/d+4)*60;}
      return [Math.round(h),Math.round(s*100),Math.round(l*100)];
    }
    function neonColor(name, hue, sat=100, lit=60) {
      return { name, core: hslToRgba(hue,sat,lit), glow: hslToRgba(hue,sat,lit+15,0.6),
               dim: hslToRgba(hue,Math.max(0,sat-30),Math.max(0,lit-35)) };
    }

    const PALETTES = {
      inferno: { primary: neonColor('Magenta',300,100,60), secondary: neonColor('Cyan',195,100,65),
                 tertiary: neonColor('Amber',30,100,55), danger: neonColor('Red',350,100,50) },
      ocean:   { primary: neonColor('Blue',220,100,60), secondary: neonColor('Seafoam',160,90,55),
                 tertiary: neonColor('Gold',45,100,55), danger: neonColor('Coral',15,100,55) },
      jungle:  { primary: neonColor('Green',120,100,55), secondary: neonColor('Violet',270,90,60),
                 tertiary: neonColor('Yellow',55,100,60), danger: neonColor('Pink',330,100,55) },
      solar:   { primary: neonColor('Orange',25,100,58), secondary: neonColor('Blue',210,100,60),
                 tertiary: neonColor('White',50,80,75), danger: neonColor('Red',0,100,48) },
    };

    // ══════════════════════════════════════════════════════════════════
    // HIGH-QUALITY CHARIZARD — drawn with Canvas2D bezier paths
    // ══════════════════════════════════════════════════════════════════

    function drawDetailedCharizard(ctx, w, h) {
      ctx.clearRect(0, 0, w, h);
      const s = w / 256; // scale factor

      // ── Wings (back layer, semi-transparent membrane) ──
      ctx.save();
      // Left wing
      ctx.beginPath();
      ctx.moveTo(128*s, 80*s);
      ctx.bezierCurveTo(100*s, 50*s, 40*s, 20*s, 15*s, 35*s);
      ctx.bezierCurveTo(5*s, 40*s, 10*s, 15*s, 25*s, 8*s);
      ctx.bezierCurveTo(40*s, 2*s, 55*s, 25*s, 50*s, 35*s);
      ctx.bezierCurveTo(52*s, 20*s, 70*s, 5*s, 85*s, 10*s);
      ctx.bezierCurveTo(95*s, 12*s, 88*s, 35*s, 80*s, 45*s);
      ctx.bezierCurveTo(85*s, 30*s, 105*s, 15*s, 115*s, 20*s);
      ctx.bezierCurveTo(125*s, 25*s, 120*s, 55*s, 115*s, 70*s);
      ctx.lineTo(128*s, 80*s);
      ctx.closePath();
      const wingGrad = ctx.createRadialGradient(80*s, 50*s, 10*s, 80*s, 50*s, 120*s);
      wingGrad.addColorStop(0, 'rgba(180, 80, 40, 0.9)');
      wingGrad.addColorStop(0.4, 'rgba(160, 60, 30, 0.7)');
      wingGrad.addColorStop(1, 'rgba(120, 40, 20, 0.5)');
      ctx.fillStyle = wingGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(220, 120, 60, 0.9)';
      ctx.lineWidth = 2 * s;
      ctx.stroke();

      // Wing veins
      ctx.strokeStyle = 'rgba(200, 100, 50, 0.5)';
      ctx.lineWidth = 1 * s;
      ctx.beginPath();
      ctx.moveTo(128*s, 80*s); ctx.bezierCurveTo(90*s, 55*s, 50*s, 30*s, 25*s, 8*s);
      ctx.moveTo(128*s, 80*s); ctx.bezierCurveTo(95*s, 45*s, 75*s, 25*s, 85*s, 10*s);
      ctx.moveTo(128*s, 80*s); ctx.bezierCurveTo(115*s, 50*s, 110*s, 30*s, 115*s, 20*s);
      ctx.stroke();

      // Right wing (mirrored)
      ctx.beginPath();
      ctx.moveTo(128*s, 80*s);
      ctx.bezierCurveTo(156*s, 50*s, 216*s, 20*s, 241*s, 35*s);
      ctx.bezierCurveTo(251*s, 40*s, 246*s, 15*s, 231*s, 8*s);
      ctx.bezierCurveTo(216*s, 2*s, 201*s, 25*s, 206*s, 35*s);
      ctx.bezierCurveTo(204*s, 20*s, 186*s, 5*s, 171*s, 10*s);
      ctx.bezierCurveTo(161*s, 12*s, 168*s, 35*s, 176*s, 45*s);
      ctx.bezierCurveTo(171*s, 30*s, 151*s, 15*s, 141*s, 20*s);
      ctx.bezierCurveTo(131*s, 25*s, 136*s, 55*s, 141*s, 70*s);
      ctx.lineTo(128*s, 80*s);
      ctx.closePath();
      const wingGrad2 = ctx.createRadialGradient(176*s, 50*s, 10*s, 176*s, 50*s, 120*s);
      wingGrad2.addColorStop(0, 'rgba(180, 80, 40, 0.9)');
      wingGrad2.addColorStop(0.4, 'rgba(160, 60, 30, 0.7)');
      wingGrad2.addColorStop(1, 'rgba(120, 40, 20, 0.5)');
      ctx.fillStyle = wingGrad2;
      ctx.fill();
      ctx.strokeStyle = 'rgba(220, 120, 60, 0.9)';
      ctx.lineWidth = 2 * s;
      ctx.stroke();

      // Right wing veins
      ctx.strokeStyle = 'rgba(200, 100, 50, 0.5)';
      ctx.lineWidth = 1 * s;
      ctx.beginPath();
      ctx.moveTo(128*s, 80*s); ctx.bezierCurveTo(166*s, 55*s, 206*s, 30*s, 231*s, 8*s);
      ctx.moveTo(128*s, 80*s); ctx.bezierCurveTo(161*s, 45*s, 181*s, 25*s, 171*s, 10*s);
      ctx.moveTo(128*s, 80*s); ctx.bezierCurveTo(141*s, 50*s, 146*s, 30*s, 141*s, 20*s);
      ctx.stroke();
      ctx.restore();

      // ── Tail ──
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(95*s, 190*s);
      ctx.bezierCurveTo(80*s, 195*s, 55*s, 190*s, 40*s, 180*s);
      ctx.bezierCurveTo(30*s, 172*s, 22*s, 160*s, 20*s, 150*s);
      ctx.bezierCurveTo(18*s, 140*s, 25*s, 135*s, 30*s, 142*s);
      ctx.bezierCurveTo(35*s, 150*s, 45*s, 165*s, 55*s, 170*s);
      ctx.bezierCurveTo(65*s, 175*s, 80*s, 180*s, 95*s, 180*s);
      ctx.closePath();
      const tailGrad = ctx.createLinearGradient(20*s, 150*s, 95*s, 185*s);
      tailGrad.addColorStop(0, 'rgb(240, 140, 50)');
      tailGrad.addColorStop(0.5, 'rgb(220, 120, 40)');
      tailGrad.addColorStop(1, 'rgb(200, 100, 30)');
      ctx.fillStyle = tailGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgb(250, 160, 70)';
      ctx.lineWidth = 1.5 * s;
      ctx.stroke();

      // Tail flame
      ctx.beginPath();
      ctx.moveTo(20*s, 150*s);
      ctx.bezierCurveTo(15*s, 140*s, 8*s, 125*s, 12*s, 115*s);
      ctx.bezierCurveTo(14*s, 108*s, 20*s, 112*s, 22*s, 120*s);
      ctx.bezierCurveTo(24*s, 110*s, 30*s, 100*s, 28*s, 110*s);
      ctx.bezierCurveTo(32*s, 105*s, 35*s, 115*s, 30*s, 125*s);
      ctx.bezierCurveTo(28*s, 135*s, 24*s, 142*s, 20*s, 150*s);
      ctx.closePath();
      const flameGrad = ctx.createRadialGradient(22*s, 125*s, 3*s, 22*s, 130*s, 25*s);
      flameGrad.addColorStop(0, 'rgb(255, 255, 220)');
      flameGrad.addColorStop(0.3, 'rgb(255, 240, 100)');
      flameGrad.addColorStop(0.6, 'rgb(255, 160, 30)');
      flameGrad.addColorStop(1, 'rgb(220, 60, 20)');
      ctx.fillStyle = flameGrad;
      ctx.fill();
      ctx.restore();

      // ── Body ──
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(128*s, 90*s);
      ctx.bezierCurveTo(155*s, 90*s, 170*s, 110*s, 170*s, 140*s);
      ctx.bezierCurveTo(170*s, 175*s, 160*s, 200*s, 148*s, 210*s);
      ctx.lineTo(108*s, 210*s);
      ctx.bezierCurveTo(96*s, 200*s, 86*s, 175*s, 86*s, 140*s);
      ctx.bezierCurveTo(86*s, 110*s, 101*s, 90*s, 128*s, 90*s);
      ctx.closePath();
      const bodyGrad = ctx.createRadialGradient(128*s, 145*s, 15*s, 128*s, 155*s, 60*s);
      bodyGrad.addColorStop(0, 'rgb(240, 150, 60)');
      bodyGrad.addColorStop(0.5, 'rgb(220, 120, 40)');
      bodyGrad.addColorStop(1, 'rgb(180, 80, 25)');
      ctx.fillStyle = bodyGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgb(250, 170, 80)';
      ctx.lineWidth = 2 * s;
      ctx.stroke();

      // Belly highlight
      ctx.beginPath();
      ctx.ellipse(128*s, 165*s, 25*s, 32*s, 0, 0, Math.PI * 2);
      const bellyGrad = ctx.createRadialGradient(128*s, 160*s, 5*s, 128*s, 165*s, 30*s);
      bellyGrad.addColorStop(0, 'rgb(255, 230, 160)');
      bellyGrad.addColorStop(0.5, 'rgb(245, 210, 120)');
      bellyGrad.addColorStop(1, 'rgb(230, 180, 80)');
      ctx.fillStyle = bellyGrad;
      ctx.fill();

      // Body shading lines
      ctx.strokeStyle = 'rgba(180, 80, 25, 0.4)';
      ctx.lineWidth = 1 * s;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        const yOff = 130 + i * 15;
        ctx.moveTo((105 + i*3)*s, yOff*s);
        ctx.bezierCurveTo((115+i*2)*s, (yOff+5)*s, (140-i*2)*s, (yOff+5)*s, (150-i*3)*s, yOff*s);
        ctx.stroke();
      }
      ctx.restore();

      // ── Arms ──
      ctx.save();
      // Left arm
      ctx.beginPath();
      ctx.moveTo(92*s, 130*s);
      ctx.bezierCurveTo(80*s, 135*s, 72*s, 150*s, 70*s, 165*s);
      ctx.bezierCurveTo(68*s, 175*s, 72*s, 180*s, 78*s, 178*s);
      ctx.bezierCurveTo(82*s, 176*s, 85*s, 170*s, 86*s, 160*s);
      ctx.bezierCurveTo(88*s, 150*s, 90*s, 140*s, 92*s, 130*s);
      ctx.closePath();
      ctx.fillStyle = 'rgb(220, 120, 40)';
      ctx.fill();
      ctx.strokeStyle = 'rgb(250, 160, 70)';
      ctx.lineWidth = 1.5*s;
      ctx.stroke();
      // Claws
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo((72+i*4)*s, (175-i*2)*s);
        ctx.lineTo((68+i*3)*s, (182-i)*s);
        ctx.strokeStyle = 'rgb(240, 220, 180)';
        ctx.lineWidth = 1.5*s;
        ctx.stroke();
      }

      // Right arm
      ctx.beginPath();
      ctx.moveTo(164*s, 130*s);
      ctx.bezierCurveTo(176*s, 135*s, 184*s, 150*s, 186*s, 165*s);
      ctx.bezierCurveTo(188*s, 175*s, 184*s, 180*s, 178*s, 178*s);
      ctx.bezierCurveTo(174*s, 176*s, 171*s, 170*s, 170*s, 160*s);
      ctx.bezierCurveTo(168*s, 150*s, 166*s, 140*s, 164*s, 130*s);
      ctx.closePath();
      ctx.fillStyle = 'rgb(220, 120, 40)';
      ctx.fill();
      ctx.strokeStyle = 'rgb(250, 160, 70)';
      ctx.lineWidth = 1.5*s;
      ctx.stroke();
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo((184-i*4)*s, (175-i*2)*s);
        ctx.lineTo((188-i*3)*s, (182-i)*s);
        ctx.strokeStyle = 'rgb(240, 220, 180)';
        ctx.lineWidth = 1.5*s;
        ctx.stroke();
      }
      ctx.restore();

      // ── Legs ──
      ctx.save();
      // Left leg
      ctx.beginPath();
      ctx.moveTo(108*s, 205*s);
      ctx.bezierCurveTo(105*s, 215*s, 100*s, 230*s, 98*s, 240*s);
      ctx.bezierCurveTo(96*s, 246*s, 94*s, 250*s, 88*s, 252*s);
      ctx.lineTo(115*s, 252*s);
      ctx.bezierCurveTo(118*s, 248*s, 116*s, 240*s, 118*s, 230*s);
      ctx.bezierCurveTo(120*s, 220*s, 118*s, 210*s, 118*s, 205*s);
      ctx.closePath();
      ctx.fillStyle = 'rgb(210, 110, 35)';
      ctx.fill();
      ctx.strokeStyle = 'rgb(245, 155, 65)';
      ctx.lineWidth = 1.5*s;
      ctx.stroke();
      // Foot claws
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo((92+i*10)*s, 252*s);
        ctx.lineTo((88+i*10)*s, 256*s);
        ctx.strokeStyle = 'rgb(240, 220, 180)';
        ctx.lineWidth = 2*s;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      // Right leg
      ctx.beginPath();
      ctx.moveTo(148*s, 205*s);
      ctx.bezierCurveTo(151*s, 215*s, 156*s, 230*s, 158*s, 240*s);
      ctx.bezierCurveTo(160*s, 246*s, 162*s, 250*s, 168*s, 252*s);
      ctx.lineTo(141*s, 252*s);
      ctx.bezierCurveTo(138*s, 248*s, 140*s, 240*s, 138*s, 230*s);
      ctx.bezierCurveTo(136*s, 220*s, 138*s, 210*s, 138*s, 205*s);
      ctx.closePath();
      ctx.fillStyle = 'rgb(210, 110, 35)';
      ctx.fill();
      ctx.strokeStyle = 'rgb(245, 155, 65)';
      ctx.lineWidth = 1.5*s;
      ctx.stroke();
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo((164-i*10)*s, 252*s);
        ctx.lineTo((168-i*10)*s, 256*s);
        ctx.strokeStyle = 'rgb(240, 220, 180)';
        ctx.lineWidth = 2*s;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      ctx.restore();

      // ── Head ──
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(128*s, 65*s);
      ctx.bezierCurveTo(148*s, 65*s, 158*s, 75*s, 160*s, 85*s);
      ctx.bezierCurveTo(162*s, 95*s, 158*s, 105*s, 150*s, 110*s);
      ctx.lineTo(145*s, 112*s);
      ctx.bezierCurveTo(140*s, 115*s, 135*s, 115*s, 128*s, 115*s);
      ctx.bezierCurveTo(121*s, 115*s, 116*s, 115*s, 111*s, 112*s);
      ctx.lineTo(106*s, 110*s);
      ctx.bezierCurveTo(98*s, 105*s, 94*s, 95*s, 96*s, 85*s);
      ctx.bezierCurveTo(98*s, 75*s, 108*s, 65*s, 128*s, 65*s);
      ctx.closePath();
      const headGrad = ctx.createRadialGradient(128*s, 85*s, 8*s, 128*s, 90*s, 35*s);
      headGrad.addColorStop(0, 'rgb(240, 150, 60)');
      headGrad.addColorStop(0.6, 'rgb(220, 120, 40)');
      headGrad.addColorStop(1, 'rgb(190, 90, 30)');
      ctx.fillStyle = headGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgb(250, 170, 80)';
      ctx.lineWidth = 2 * s;
      ctx.stroke();

      // Horns
      ctx.beginPath();
      ctx.moveTo(105*s, 72*s);
      ctx.bezierCurveTo(100*s, 65*s, 95*s, 50*s, 98*s, 45*s);
      ctx.bezierCurveTo(100*s, 42*s, 105*s, 48*s, 108*s, 58*s);
      ctx.bezierCurveTo(110*s, 63*s, 108*s, 68*s, 105*s, 72*s);
      ctx.fillStyle = 'rgb(200, 105, 35)';
      ctx.fill();
      ctx.strokeStyle = 'rgb(240, 155, 65)';
      ctx.lineWidth = 1.5*s;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(151*s, 72*s);
      ctx.bezierCurveTo(156*s, 65*s, 161*s, 50*s, 158*s, 45*s);
      ctx.bezierCurveTo(156*s, 42*s, 151*s, 48*s, 148*s, 58*s);
      ctx.bezierCurveTo(146*s, 63*s, 148*s, 68*s, 151*s, 72*s);
      ctx.fillStyle = 'rgb(200, 105, 35)';
      ctx.fill();
      ctx.strokeStyle = 'rgb(240, 155, 65)';
      ctx.lineWidth = 1.5*s;
      ctx.stroke();

      // Eyes
      ctx.fillStyle = 'rgb(255, 255, 240)';
      ctx.beginPath(); ctx.ellipse(118*s, 85*s, 7*s, 5*s, -0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(138*s, 85*s, 7*s, 5*s, 0.1, 0, Math.PI*2); ctx.fill();
      // Irises
      ctx.fillStyle = 'rgb(50, 80, 200)';
      ctx.beginPath(); ctx.ellipse(120*s, 85*s, 4*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(136*s, 85*s, 4*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
      // Pupils
      ctx.fillStyle = 'rgb(10, 10, 30)';
      ctx.beginPath(); ctx.arc(121*s, 85*s, 2*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(135*s, 85*s, 2*s, 0, Math.PI*2); ctx.fill();
      // Eye highlights
      ctx.fillStyle = 'rgb(255, 255, 255)';
      ctx.beginPath(); ctx.arc(119*s, 83*s, 1.5*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(134*s, 83*s, 1.5*s, 0, Math.PI*2); ctx.fill();

      // Nostrils
      ctx.fillStyle = 'rgb(160, 70, 20)';
      ctx.beginPath(); ctx.arc(122*s, 98*s, 2*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(134*s, 98*s, 2*s, 0, Math.PI*2); ctx.fill();

      // Mouth line
      ctx.beginPath();
      ctx.moveTo(115*s, 102*s);
      ctx.bezierCurveTo(120*s, 106*s, 128*s, 108*s, 136*s, 106*s);
      ctx.bezierCurveTo(140*s, 104*s, 142*s, 102*s, 141*s, 100*s);
      ctx.strokeStyle = 'rgb(170, 75, 25)';
      ctx.lineWidth = 1.5*s;
      ctx.stroke();
      ctx.restore();

      // ── Fire breath ──
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(145*s, 100*s);
      ctx.bezierCurveTo(165*s, 90*s, 190*s, 80*s, 220*s, 75*s);
      ctx.bezierCurveTo(235*s, 72*s, 248*s, 68*s, 250*s, 70*s);
      ctx.bezierCurveTo(252*s, 75*s, 240*s, 85*s, 225*s, 90*s);
      ctx.bezierCurveTo(200*s, 98*s, 175*s, 100*s, 155*s, 105*s);
      ctx.bezierCurveTo(148*s, 107*s, 145*s, 105*s, 145*s, 100*s);
      ctx.closePath();
      const fireGrad = ctx.createLinearGradient(145*s, 95*s, 250*s, 75*s);
      fireGrad.addColorStop(0, 'rgb(255, 240, 180)');
      fireGrad.addColorStop(0.2, 'rgb(255, 220, 80)');
      fireGrad.addColorStop(0.5, 'rgb(255, 150, 30)');
      fireGrad.addColorStop(0.8, 'rgb(230, 70, 15)');
      fireGrad.addColorStop(1, 'rgba(180, 30, 10, 0.6)');
      ctx.fillStyle = fireGrad;
      ctx.fill();

      // Fire detail flames
      for (let i = 0; i < 8; i++) {
        const fx = 160 + i * 12;
        const fy = 85 + Math.sin(i * 1.3) * 8;
        const fs = 4 + Math.random() * 6;
        ctx.beginPath();
        ctx.ellipse(fx*s, fy*s, fs*s*0.5, fs*s, Math.random()*Math.PI, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255, ${180+Math.random()*75}, ${Math.random()*80}, ${0.4+Math.random()*0.4})`;
        ctx.fill();
      }
      ctx.restore();
    }

    // ══════════════════════════════════════════════════════════════════
    // NEONIFICATION ENGINE (proper Sobel + distance field + multi-layer bloom)
    // ══════════════════════════════════════════════════════════════════

    function createBuf(w, h) { return { width: w, height: h, data: new Uint8ClampedArray(w*h*4) }; }
    function bufFromImageData(imgData) { return { width: imgData.width, height: imgData.height, data: new Uint8ClampedArray(imgData.data) }; }
    function getPx(b, x, y) { const i=(y*b.width+x)*4; return [b.data[i],b.data[i+1],b.data[i+2],b.data[i+3]/255]; }
    function setPx(b, x, y, c) {
      if(x<0||x>=b.width||y<0||y>=b.height) return;
      const i=(y*b.width+x)*4; b.data[i]=c[0]; b.data[i+1]=c[1]; b.data[i+2]=c[2]; b.data[i+3]=Math.round(c[3]*255);
    }

    // Proper Gaussian kernel
    function gaussKernel(r) {
      const size = r*2+1, k = new Float64Array(size), sig = r/3, s2 = 2*sig*sig;
      let sum = 0;
      for (let i=0;i<size;i++) { const x=i-r; k[i]=Math.exp(-(x*x)/s2); sum+=k[i]; }
      for (let i=0;i<size;i++) k[i]/=sum;
      return k;
    }

    function gaussianBlur(src, radius) {
      if (radius < 1) { const c = createBuf(src.width,src.height); c.data.set(src.data); return c; }
      const r = Math.round(radius), k = gaussKernel(r);
      const w=src.width, h=src.height;
      const tmp = new Float64Array(w*h*4), out = new Float64Array(w*h*4);
      for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
        let rr=0,gg=0,bb=0,aa=0;
        for (let j=-r;j<=r;j++) { const sx=Math.max(0,Math.min(w-1,x+j)),si=(y*w+sx)*4,wt=k[j+r];
          rr+=src.data[si]*wt; gg+=src.data[si+1]*wt; bb+=src.data[si+2]*wt; aa+=src.data[si+3]*wt; }
        const di=(y*w+x)*4; tmp[di]=rr;tmp[di+1]=gg;tmp[di+2]=bb;tmp[di+3]=aa;
      }
      for (let x=0;x<w;x++) for (let y=0;y<h;y++) {
        let rr=0,gg=0,bb=0,aa=0;
        for (let j=-r;j<=r;j++) { const sy=Math.max(0,Math.min(h-1,y+j)),si=(sy*w+x)*4,wt=k[j+r];
          rr+=tmp[si]*wt; gg+=tmp[si+1]*wt; bb+=tmp[si+2]*wt; aa+=tmp[si+3]*wt; }
        const di=(y*w+x)*4; out[di]=rr;out[di+1]=gg;out[di+2]=bb;out[di+3]=aa;
      }
      const dst = createBuf(w,h);
      for (let i=0;i<dst.data.length;i++) dst.data[i]=Math.max(0,Math.min(255,Math.round(out[i])));
      return dst;
    }

    // Sobel edge detection
    function sobelEdges(src) {
      const dst = createBuf(src.width, src.height);
      const w = src.width, h = src.height;
      for (let y=1;y<h-1;y++) for (let x=1;x<w-1;x++) {
        const lum = (px,py) => { const i=(py*w+px)*4; return src.data[i]*0.299+src.data[i+1]*0.587+src.data[i+2]*0.114; };
        const gx = -lum(x-1,y-1)+lum(x+1,y-1)-2*lum(x-1,y)+2*lum(x+1,y)-lum(x-1,y+1)+lum(x+1,y+1);
        const gy = -lum(x-1,y-1)-2*lum(x,y-1)-lum(x+1,y-1)+lum(x-1,y+1)+2*lum(x,y+1)+lum(x+1,y+1);
        const mag = Math.min(255, Math.sqrt(gx*gx+gy*gy));
        const i=(y*w+x)*4; dst.data[i]=mag; dst.data[i+1]=mag; dst.data[i+2]=mag; dst.data[i+3]=src.data[i+3];
      }
      return dst;
    }

    // Distance field from non-transparent pixels
    function distanceField(src, threshold) {
      const w=src.width, h=src.height, dist = new Float64Array(w*h);
      dist.fill(9999);
      for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
        const i=(y*w+x)*4;
        if (src.data[i+3]>10 && (src.data[i]+src.data[i+1]+src.data[i+2])>threshold*3)
          dist[y*w+x]=0;
      }
      for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
        const idx=y*w+x;
        if(x>0) dist[idx]=Math.min(dist[idx],dist[idx-1]+1);
        if(y>0) dist[idx]=Math.min(dist[idx],dist[(y-1)*w+x]+1);
      }
      for (let y=h-1;y>=0;y--) for (let x=w-1;x>=0;x--) {
        const idx=y*w+x;
        if(x<w-1) dist[idx]=Math.min(dist[idx],dist[idx+1]+1);
        if(y<h-1) dist[idx]=Math.min(dist[idx],dist[(y+1)*w+x]+1);
      }
      return dist;
    }

    // Neon color gradient (5-stop for rich shading)
    function neonGradient(t, neon, accent) {
      if (t < 0.15) {
        const s = t / 0.15;
        return lerpColor([2,2,5,1], neon.dim, s*0.3);
      } else if (t < 0.35) {
        const s = (t-0.15)/0.2;
        const dimDark = [Math.round(neon.dim[0]*0.4),Math.round(neon.dim[1]*0.4),Math.round(neon.dim[2]*0.4),1];
        return lerpColor(dimDark, neon.dim, s);
      } else if (t < 0.6) {
        const s = (t-0.35)/0.25;
        const mid = accent ? lerpColor(neon.dim, accent.dim, 0.3) : neon.dim;
        return lerpColor(neon.dim, mid, s);
      } else if (t < 0.85) {
        const s = (t-0.6)/0.25;
        return lerpColor(neon.dim, neon.core, s);
      } else {
        const s = (t-0.85)/0.15;
        const hot = [Math.min(255,neon.core[0]+80),Math.min(255,neon.core[1]+80),Math.min(255,neon.core[2]+80),1];
        return lerpColor(neon.core, hot, s);
      }
    }

    // Full neonification pipeline
    function neonifyImage(src, neon, accent, opts = {}) {
      const detail = opts.detail ?? 0.65;
      const outlineBright = opts.outlineBright ?? 1.0;
      const interiorBright = opts.interiorBright ?? 0.35;
      const edgeGlowR = opts.edgeGlowRadius ?? 3;
      const threshold = 25;

      const w = src.width, h = src.height;
      const dst = createBuf(w, h);

      // Compute luminance
      const lum = new Float64Array(w*h);
      for (let i=0;i<lum.length;i++) {
        const si=i*4, a=src.data[si+3]/255;
        lum[i] = (src.data[si]*0.299+src.data[si+1]*0.587+src.data[si+2]*0.114)*a/255;
      }

      // Sobel edges
      const edges = sobelEdges(src);

      // Distance field
      const dist = distanceField(src, threshold);
      let maxDist = 0;
      for (let i=0;i<dist.length;i++) if(dist[i]<9000) maxDist=Math.max(maxDist,dist[i]);
      maxDist = Math.max(1, maxDist);

      for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
        const i = (y*w+x)*4;
        const alpha = src.data[i+3];
        if (alpha < 10) continue;
        if (src.data[i]+src.data[i+1]+src.data[i+2] < threshold*3 && alpha < 128) continue;

        const idx = y*w+x;
        const pixLum = lum[idx];
        const edgeStr = edges.data[idx*4]/255;
        const d = dist[idx];

        let t = pixLum * detail;

        // Edge boost
        if (edgeStr > 0.15) t = Math.min(1, t + edgeStr * outlineBright);

        // Zone-based shading
        if (d <= 1) {
          t = Math.max(t, 0.75 + edgeStr * 0.25);
        } else if (d <= edgeGlowR) {
          const rimFade = 1 - (d-1) / edgeGlowR;
          t = Math.max(t, 0.4 + rimFade * 0.35);
        } else {
          t *= interiorBright;
        }
        t = Math.max(0, Math.min(1, t));

        // Hue variation from source
        const orig = [src.data[i], src.data[i+1], src.data[i+2], alpha/255];
        let color = neonGradient(t, neon, accent);

        if (t > 0.2 && t < 0.7) {
          const origHsl = rgbaToHsl(orig);
          const neonHsl = rgbaToHsl(color);
          const blendedH = neonHsl[0] + (origHsl[0] - neonHsl[0]) * 0.12;
          const inf = hslToRgba((blendedH+360)%360, neonHsl[1], neonHsl[2], color[3]);
          color = lerpColor(color, inf, 0.15);
        }

        dst.data[i] = color[0];
        dst.data[i+1] = color[1];
        dst.data[i+2] = color[2];
        dst.data[i+3] = alpha;
      }

      return dst;
    }

    // Multi-layer bloom
    function multiLayerBloom(src, opts = {}) {
      const innerR = opts.innerR ?? 2;
      const innerI = opts.innerI ?? 0.7;
      const midR = opts.midR ?? 8;
      const midI = opts.midI ?? 0.35;
      const outerR = opts.outerR ?? 20;
      const outerI = opts.outerI ?? 0.12;

      const result = createBuf(src.width, src.height);
      result.data.set(src.data);

      // Extract bright pixels
      const bright = createBuf(src.width, src.height);
      for (let i=0;i<src.data.length;i+=4) {
        const b = src.data[i]*0.299+src.data[i+1]*0.587+src.data[i+2]*0.114;
        if (b > 40) { bright.data[i]=src.data[i]; bright.data[i+1]=src.data[i+1]; bright.data[i+2]=src.data[i+2]; bright.data[i+3]=src.data[i+3]; }
      }

      // Inner glow
      let inner = gaussianBlur(bright, innerR);
      inner = gaussianBlur(inner, innerR);
      for (let i=0;i<result.data.length;i+=4) {
        result.data[i] = Math.min(255, result.data[i] + Math.round(inner.data[i]*innerI));
        result.data[i+1] = Math.min(255, result.data[i+1] + Math.round(inner.data[i+1]*innerI));
        result.data[i+2] = Math.min(255, result.data[i+2] + Math.round(inner.data[i+2]*innerI));
        result.data[i+3] = Math.min(255, result.data[i+3] + Math.round(inner.data[i+3]*innerI));
      }

      // Mid bloom (screen blend)
      let mid = gaussianBlur(bright, midR);
      mid = gaussianBlur(mid, midR * 0.7);
      for (let i=0;i<result.data.length;i+=4) {
        for (let c=0;c<3;c++) {
          const d = result.data[i+c]/255, sv = (mid.data[i+c]/255)*midI;
          result.data[i+c] = Math.round(Math.min(1, 1-(1-d)*(1-sv))*255);
        }
      }

      // Outer atmospheric
      const outer = gaussianBlur(bright, outerR);
      for (let i=0;i<result.data.length;i+=4) {
        for (let c=0;c<3;c++) {
          const d = result.data[i+c]/255, sv = (outer.data[i+c]/255)*outerI;
          result.data[i+c] = Math.round(Math.min(1, 1-(1-d)*(1-sv))*255);
        }
      }

      return result;
    }

    // ══════════════════════════════════════════════════════════════════
    // RENDERING
    // ══════════════════════════════════════════════════════════════════

    function renderBuf(canvasId, buf) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      canvas.width = buf.width; canvas.height = buf.height;
      ctx.imageSmoothingEnabled = false;
      ctx.putImageData(new ImageData(new Uint8ClampedArray(buf.data), buf.width, buf.height), 0, 0);
    }

    function renderScene(palette, opts) {
      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d');
      const W = 900, H = 500;
      ctx.imageSmoothingEnabled = false;

      // Black + tint
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = 'rgba(8, 2, 12, 1)'; ctx.fillRect(0,0,W,H);

      const neon = palette.primary, sec = palette.secondary, ter = palette.tertiary;

      // ── Crystalline terrain ──
      ctx.save();
      ctx.shadowColor = css(withAlpha(neon.core, 0.8));
      ctx.shadowBlur = 15;
      ctx.strokeStyle = css(neon.core);
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'miter';

      const terrain = [];
      let tx = 0;
      while (tx < 920) {
        const th = 380 - Math.random()*100 - Math.abs(Math.sin(tx*0.008))*80;
        terrain.push([tx, th]);
        tx += 6 + Math.random()*12;
      }
      terrain.push([920, H]); terrain.push([0, H]);

      ctx.beginPath();
      ctx.moveTo(terrain[0][0], terrain[0][1]);
      for (const [px,py] of terrain) ctx.lineTo(px,py);
      ctx.closePath();
      const tGrad = ctx.createLinearGradient(0, 280, 0, H);
      tGrad.addColorStop(0, css(withAlpha(neon.core, 0.1)));
      tGrad.addColorStop(0.5, css(withAlpha(neon.core, 0.04)));
      tGrad.addColorStop(1, css(withAlpha(neon.core, 0.01)));
      ctx.fillStyle = tGrad;
      ctx.fill();
      ctx.stroke();

      // Terrain inner lines
      ctx.strokeStyle = css(withAlpha(neon.core, 0.25));
      ctx.lineWidth = 0.5;
      ctx.shadowBlur = 4;
      for (let i=2;i<terrain.length-2;i+=2) {
        ctx.beginPath();
        ctx.moveTo(terrain[i][0], terrain[i][1]);
        ctx.lineTo(terrain[i][0] + (Math.random()-0.5)*10, terrain[i][1]+15+Math.random()*20);
        ctx.stroke();
      }
      ctx.restore();

      // ── Ice stalactites ──
      ctx.save();
      for (let i=0;i<9;i++) {
        const sx = 60+i*95+Math.random()*30, sh = 30+Math.random()*100, sw = 6+Math.random()*14;
        ctx.shadowColor = css(withAlpha(sec.core, 0.9));
        ctx.shadowBlur = 18;
        ctx.strokeStyle = css(sec.core);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sx-sw/2, 0); ctx.lineTo(sx+sw/2, 0);
        ctx.lineTo(sx+sw/4, sh*0.5); ctx.lineTo(sx+sw/8, sh*0.8);
        ctx.lineTo(sx, sh); ctx.lineTo(sx-sw/8, sh*0.8);
        ctx.lineTo(sx-sw/4, sh*0.5); ctx.closePath();
        ctx.fillStyle = css(withAlpha(sec.core, 0.04));
        ctx.fill(); ctx.stroke();

        // Inner line
        ctx.strokeStyle = css(withAlpha(sec.core, 0.3));
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(sx, 5); ctx.lineTo(sx, sh-3); ctx.stroke();

        // Particle drips
        for (let j=0;j<3;j++) {
          const px = sx+(Math.random()-0.5)*sw*0.3, py = sh+5+Math.random()*15;
          ctx.beginPath(); ctx.arc(px,py,1+Math.random(),0,Math.PI*2);
          ctx.fillStyle = css(withAlpha(sec.core, 0.4+Math.random()*0.4));
          ctx.fill();
        }
      }
      ctx.restore();

      // ── Charizard ──
      // Draw detailed source, grab imageData, neonify, bloom, composite
      const spriteCanvas = new OffscreenCanvas(256, 256);
      const spriteCtx = spriteCanvas.getContext('2d');
      drawDetailedCharizard(spriteCtx, 256, 256);
      const srcData = spriteCtx.getImageData(0, 0, 256, 256);
      const srcBuf = bufFromImageData(srcData);

      const neonBuf = neonifyImage(srcBuf, neon, sec, opts);
      const bloomBuf = multiLayerBloom(neonBuf, {
        innerR: 2, innerI: opts.bloomIntensity * 0.8,
        midR: 6, midI: opts.bloomIntensity * 0.4,
        outerR: 16, outerI: opts.bloomIntensity * 0.15,
      });

      const spriteOut = new OffscreenCanvas(256, 256);
      const spriteOutCtx = spriteOut.getContext('2d');
      spriteOutCtx.putImageData(new ImageData(new Uint8ClampedArray(bloomBuf.data), 256, 256), 0, 0);

      ctx.save();
      ctx.drawImage(spriteOut, 300, 80);
      ctx.restore();

      // ── Fire particles ──
      ctx.save();
      for (let i=0;i<50;i++) {
        const px = 380+Math.random()*200, py = 300+Math.random()*120;
        const sz = 0.5+Math.random()*3, al = 0.2+Math.random()*0.6;
        ctx.shadowColor = css(withAlpha(ter.core, 0.7));
        ctx.shadowBlur = sz*3;
        ctx.fillStyle = css(withAlpha(ter.core, al));
        ctx.beginPath(); ctx.arc(px,py,sz,0,Math.PI*2); ctx.fill();
      }
      // Ambient glow particles
      for (let i=0;i<20;i++) {
        const px = Math.random()*W, py = Math.random()*H*0.7;
        const sz = 0.3+Math.random()*1.5, al = 0.1+Math.random()*0.2;
        ctx.shadowColor = css(withAlpha(sec.core, 0.4));
        ctx.shadowBlur = sz*4;
        ctx.fillStyle = css(withAlpha(sec.core, al));
        ctx.beginPath(); ctx.arc(px,py,sz,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();

      // ── Post-process bloom ──
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.filter = 'blur(20px)';
      ctx.globalAlpha = 0.06;
      ctx.drawImage(canvas, 0, 0);
      ctx.restore();
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.filter = 'blur(6px)';
      ctx.globalAlpha = 0.08;
      ctx.drawImage(canvas, 0, 0);
      ctx.restore();
    }

    // ══════════════════════════════════════════════════════════════════
    // MAIN
    // ══════════════════════════════════════════════════════════════════

    let currentPalette = 'inferno';

    function getOpts() {
      return {
        detail: parseInt(document.getElementById('detail').value) / 100,
        outlineBright: parseInt(document.getElementById('outline').value) / 100,
        interiorBright: parseInt(document.getElementById('interior').value) / 100,
        edgeGlowRadius: parseInt(document.getElementById('glowRadius').value),
        bloomIntensity: parseInt(document.getElementById('bloomInt').value) / 100,
      };
    }

    function render() {
      const palette = PALETTES[currentPalette];
      const opts = getOpts();
      const status = document.getElementById('status');

      status.textContent = 'Drawing high-detail source...';

      // 1. Draw high-detail source using Canvas2D paths
      const srcCanvas = document.getElementById('source');
      const srcCtx = srcCanvas.getContext('2d');
      srcCtx.clearRect(0, 0, 256, 256);
      drawDetailedCharizard(srcCtx, 256, 256);

      status.textContent = 'Running neonification pipeline...';

      // 2. Neonify
      const srcData = srcCtx.getImageData(0, 0, 256, 256);
      const srcBuf = bufFromImageData(srcData);
      const neonBuf = neonifyImage(srcBuf, palette.primary, palette.secondary, opts);
      renderBuf('neonified', neonBuf);

      status.textContent = 'Generating multi-layer bloom...';

      // 3. Bloom
      const bloomBuf = multiLayerBloom(neonBuf, {
        innerR: 2, innerI: opts.bloomIntensity * 0.8,
        midR: 6, midI: opts.bloomIntensity * 0.4,
        outerR: 16, outerI: opts.bloomIntensity * 0.15,
      });
      renderBuf('bloomed', bloomBuf);

      status.textContent = 'Compositing scene...';

      // 4. Full scene
      renderScene(palette, opts);

      status.textContent = `READY — ${palette.primary.name.toUpperCase()} PALETTE | Pipeline: Sobel->DistField->NeonGrad->3xBloom`;
      status.style.color = css(palette.primary.core);
      status.style.textShadow = `0 0 8px ${css(palette.primary.core)}`;
    }

    // Event listeners
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPalette = btn.dataset.palette;
        render();
      });
    });

    document.querySelectorAll('input[type="range"]').forEach(input => {
      input.addEventListener('input', () => render());
    });

    // Go
    render();
  </script>
</body>
</html>
