<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Engine - Original Charizard Sprite</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#1a1530;display:flex;flex-direction:column;align-items:center;padding:20px;font-family:'Press Start 2P',monospace;color:#fff}
    h1{font-size:11px;color:#e8a0ff;margin-bottom:12px}
    .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
    canvas{border:1px solid #2a2540;image-rendering:pixelated;image-rendering:crisp-edges}
    .label{font-size:6px;color:#666;text-align:center;margin-top:4px}
  </style>
</head>
<body>
  <h1>ORIGINAL CHARIZARD — PIXEL ART GENERATION</h1>
  <div class="row">
    <div><canvas id="sprite"></canvas><div class="label">2x SCALE</div></div>
    <div><canvas id="sprite1x"></canvas><div class="label">1x NATIVE</div></div>
    <div><canvas id="dark"></canvas><div class="label">DARK BG</div></div>
  </div>
  <script>
    const W = 200, H = 200;
    const buf = new Uint8ClampedArray(W * H * 4);

    // ── Engine ──
    function hash(x,y,s){let h=(x*374761393+y*668265263+s*1274126177)|0;h=((h^(h>>13))*1274126177)|0;return((h^(h>>16))&0x7fffffff)/0x7fffffff}
    function noise2d(x,y,s){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);return hash(ix,iy,s)+(hash(ix+1,iy,s)-hash(ix,iy,s))*sx+(hash(ix,iy+1,s)-hash(ix,iy,s))*sy+(hash(ix,iy,s)-hash(ix+1,iy,s)-hash(ix,iy+1,s)+hash(ix+1,iy+1,s))*sx*sy}
    function fbm(x,y,oct,s){let v=0,a=1,f=1,m=0;for(let i=0;i<oct;i++){v+=noise2d(x*f,y*f,s+i*31)*a;m+=a;a*=0.5;f*=2.1}return v/m}
    function hsl2rgb(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return[(r+m)*255+0.5|0,(g+m)*255+0.5|0,(b+m)*255+0.5|0]}
    function makePal(bh,bs,bl,n){const p=[];for(let i=0;i<n;i++){const t=i/(n-1);const hs=t<0.5?-22*(1-t*2):12*(t-0.5)*2;const s=Math.max(0,Math.min(100,bs+(t<0.3?8*(1-t/0.3):t>0.8?-15*(t-0.8)/0.2:0)));const l=Math.min(92,5+t*(bl+15));p.push(hsl2rgb(bh+hs,s,l))}return p}
    const B4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    function dithPick(x,y,t){return t>B4[y&3][x&3]/16}

    function setP(x,y,r,g,b,a) {
      x|=0; y|=0;
      if(x<0||x>=W||y<0||y>=H)return;
      const i=(y*W+x)*4;
      if(a===undefined||a>=255){buf[i]=r;buf[i+1]=g;buf[i+2]=b;buf[i+3]=255;return}
      if(a<1)return;
      const sa=a/255,da=buf[i+3]/255,oa=sa+da*(1-sa);
      if(oa<0.002)return;
      buf[i]=((r*sa+buf[i]*da*(1-sa))/oa+0.5)|0;
      buf[i+1]=((g*sa+buf[i+1]*da*(1-sa))/oa+0.5)|0;
      buf[i+2]=((b*sa+buf[i+2]*da*(1-sa))/oa+0.5)|0;
      buf[i+3]=(oa*255+0.5)|0;
    }

    // ── Shape primitives with noise-perturbed edges ──
    // Returns < 0 inside, > 0 outside, ~0 at edge
    function ellipseSDF(px, py, cx, cy, rx, ry, angle, noiseSeed, roughness) {
      const cos = Math.cos(angle), sin = Math.sin(angle);
      const dx = px - cx, dy = py - cy;
      const lx = dx * cos + dy * sin;
      const ly = -dx * sin + dy * cos;
      const base = Math.sqrt((lx/rx)**2 + (ly/ry)**2) - 1;
      const edgeNoise = (fbm(lx*0.15, ly*0.15, 4, noiseSeed) - 0.5) * roughness;
      return base + edgeNoise;
    }

    // Capsule SDF (rounded line segment)
    function capsuleSDF(px, py, ax, ay, bx, by, r, noiseSeed, roughness) {
      const abx = bx-ax, aby = by-ay;
      const apx = px-ax, apy = py-ay;
      const t = Math.max(0, Math.min(1, (apx*abx+apy*aby)/(abx*abx+aby*aby)));
      const cx = ax+abx*t, cy = ay+aby*t;
      const dx = px-cx, dy = py-cy;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const noise = (fbm(px*0.12, py*0.12, 4, noiseSeed) - 0.5) * roughness * r;
      return dist - r - noise;
    }

    // Triangle-ish shape SDF (for wing tips, horns)
    function triSDF(px, py, x0, y0, x1, y1, x2, y2, noiseSeed, roughness) {
      function edgeDist(px,py,ex,ey,fx,fy) {
        const dx=fx-ex,dy=fy-ey,t=Math.max(0,Math.min(1,((px-ex)*dx+(py-ey)*dy)/(dx*dx+dy*dy)));
        return Math.sqrt((px-ex-dx*t)**2+(py-ey-dy*t)**2);
      }
      // Signed: negative inside
      function cross(ax,ay,bx,by){return ax*by-ay*bx}
      const d0=cross(x1-x0,y1-y0,px-x0,py-y0);
      const d1=cross(x2-x1,y2-y1,px-x1,py-y1);
      const d2=cross(x0-x2,y0-y2,px-x2,py-y2);
      const inside=(d0>=0&&d1>=0&&d2>=0)||(d0<=0&&d1<=0&&d2<=0);
      const dist=Math.min(edgeDist(px,py,x0,y0,x1,y1),edgeDist(px,py,x1,y1,x2,y2),edgeDist(px,py,x2,y2,x0,y0));
      const base=inside?-dist:dist;
      return base + (fbm(px*0.1,py*0.1,3,noiseSeed)-0.5)*roughness*5;
    }

    // ── Material palettes ──
    const palSkin1   = makePal(25, 78, 52, 10);
    const palSkin2   = makePal(15, 68, 45, 8);
    const palSkin3   = makePal(35, 60, 48, 8);
    const palBelly1  = makePal(48, 50, 72, 8);
    const palBelly2  = makePal(40, 42, 65, 6);
    const palBelly3  = makePal(55, 38, 68, 6);
    const palWing1   = makePal(188, 50, 38, 10);
    const palWing2   = makePal(200, 42, 32, 8);
    const palWing3   = makePal(172, 45, 35, 8);
    const palMembrane1=makePal(185, 35, 28, 8);
    const palMembrane2=makePal(195, 28, 22, 6);
    const palMembrane3=makePal(210, 30, 25, 6);
    const palFlame1  = makePal(38, 95, 65, 8);
    const palFlame2  = makePal(18, 92, 55, 8);
    const palFlame3  = makePal(52, 88, 72, 6);
    const palClaw1   = makePal(42, 18, 62, 6);
    const palClaw2   = makePal(32, 22, 55, 6);
    const palHorn1   = makePal(35, 55, 48, 6);
    const palHorn2   = makePal(28, 45, 40, 6);
    const palEye     = makePal(50, 15, 88, 4);

    // ── Body plan: Flying Charizard facing right, wings spread ──
    // All coordinates in 200x200 space

    function getRegion(px, py) {
      // Returns { region, depth, sdf } or null
      // Check from front to back

      // Flame (tail tip) — in front of everything
      if (capsuleSDF(px,py, 28,130, 15,118, 8, 700,0.4) < 0) return {region:'flame', depth:0};
      if (capsuleSDF(px,py, 18,120, 10,105, 6, 701,0.5) < 0) return {region:'flame', depth:0};
      if (capsuleSDF(px,py, 12,108, 8,95, 4, 702,0.5) < 0) return {region:'flame', depth:0};

      // Head
      const headSDF = ellipseSDF(px,py, 148,60, 18,14, -0.2, 500,0.08);
      if (headSDF < 0) {
        // Eye region
        if (ellipseSDF(px,py, 155,56, 4,3.5, 0, 510,0.02) < 0) return {region:'eye', depth:1};
        // Mouth interior
        if (ellipseSDF(px,py, 162,67, 8,3, -0.15, 511,0.06) < 0) return {region:'mouthInner', depth:1};
        // Nostril
        if (ellipseSDF(px,py, 160,58, 2,1.5, 0, 512,0.1) < 0) return {region:'dark', depth:1};
        return {region:'head', depth:1};
      }

      // Snout/jaw
      if (ellipseSDF(px,py, 163,62, 12,8, -0.1, 505,0.1) < 0) return {region:'head', depth:1};
      // Lower jaw (open mouth)
      if (ellipseSDF(px,py, 158,70, 10,5, -0.05, 506,0.08) < 0) return {region:'head', depth:2};

      // Fire breath
      if (capsuleSDF(px,py, 170,62, 192,56, 5, 710,0.45) < 0) return {region:'flame', depth:0};
      if (capsuleSDF(px,py, 188,55, 198,52, 3, 711,0.5) < 0) return {region:'flame', depth:0};

      // Horns
      if (triSDF(px,py, 138,50, 130,32, 136,46, 520,0.12) < 0) return {region:'horn', depth:1};
      if (triSDF(px,py, 143,48, 140,28, 147,44, 521,0.12) < 0) return {region:'horn', depth:1};

      // Neck
      if (capsuleSDF(px,py, 130,72, 115,95, 10, 530,0.08) < 0) return {region:'skin', depth:3};

      // Body (main torso)
      const bodySDF = ellipseSDF(px,py, 105,110, 32,24, 0.15, 540,0.06);
      if (bodySDF < 0) {
        // Belly region (underside)
        if (ellipseSDF(px,py, 108,125, 22,14, 0.1, 541,0.05) < 0) return {region:'belly', depth:3};
        return {region:'skin', depth:3};
      }

      // Front arm
      if (capsuleSDF(px,py, 125,115, 138,135, 5, 550,0.12) < 0) return {region:'skin', depth:2};
      // Front claws
      if (capsuleSDF(px,py, 138,135, 142,140, 2.5, 551,0.15) < 0) return {region:'claw', depth:2};
      if (capsuleSDF(px,py, 136,137, 139,143, 2, 552,0.15) < 0) return {region:'claw', depth:2};

      // Back arm
      if (capsuleSDF(px,py, 88,112, 80,130, 5, 555,0.1) < 0) return {region:'skin', depth:4};
      if (capsuleSDF(px,py, 80,130, 78,136, 2.5, 556,0.15) < 0) return {region:'claw', depth:4};

      // Front leg
      if (capsuleSDF(px,py, 118,128, 128,155, 7, 560,0.1) < 0) return {region:'skin', depth:2};
      // Front foot/claws
      if (capsuleSDF(px,py, 128,155, 135,162, 4, 561,0.12) < 0) return {region:'skin', depth:2};
      if (capsuleSDF(px,py, 135,160, 140,165, 2, 562,0.15) < 0) return {region:'claw', depth:2};
      if (capsuleSDF(px,py, 133,163, 137,168, 2, 563,0.15) < 0) return {region:'claw', depth:2};
      if (capsuleSDF(px,py, 130,164, 133,170, 1.8, 564,0.15) < 0) return {region:'claw', depth:2};

      // Back leg
      if (capsuleSDF(px,py, 88,125, 82,150, 6, 570,0.1) < 0) return {region:'skin', depth:4};
      if (capsuleSDF(px,py, 82,150, 78,158, 3.5, 571,0.12) < 0) return {region:'skin', depth:4};
      if (capsuleSDF(px,py, 78,157, 75,163, 2, 572,0.15) < 0) return {region:'claw', depth:4};
      if (capsuleSDF(px,py, 80,159, 78,165, 1.8, 573,0.15) < 0) return {region:'claw', depth:4};

      // Tail
      if (capsuleSDF(px,py, 75,115, 55,125, 7, 580,0.1) < 0) return {region:'skin', depth:5};
      if (capsuleSDF(px,py, 55,125, 38,128, 5.5, 581,0.1) < 0) return {region:'skin', depth:5};
      if (capsuleSDF(px,py, 38,128, 28,130, 4, 582,0.12) < 0) return {region:'skin', depth:5};

      // Wings (behind everything) — structural bones
      if (capsuleSDF(px,py, 110,95, 140,40, 4, 600,0.08) < 0) return {region:'wingBone', depth:6};
      if (capsuleSDF(px,py, 140,40, 170,25, 3, 601,0.1) < 0) return {region:'wingBone', depth:6};
      if (capsuleSDF(px,py, 140,40, 160,55, 2.5, 602,0.1) < 0) return {region:'wingBone', depth:6};
      if (capsuleSDF(px,py, 140,40, 120,22, 2.5, 603,0.1) < 0) return {region:'wingBone', depth:6};

      // Wing membrane panels
      if (triSDF(px,py, 110,95, 140,40, 170,25, 610,0.08) < 0) return {region:'membrane', depth:7};
      if (triSDF(px,py, 110,95, 170,25, 175,65, 611,0.08) < 0) return {region:'membrane', depth:7};
      if (triSDF(px,py, 110,95, 140,40, 120,22, 612,0.08) < 0) return {region:'membrane', depth:7};
      if (triSDF(px,py, 110,95, 120,22, 90,35, 613,0.1) < 0) return {region:'membrane', depth:7};

      // Wing tips (pointed)
      if (triSDF(px,py, 170,25, 182,18, 175,35, 620,0.15) < 0) return {region:'wingBone', depth:6};
      if (triSDF(px,py, 120,22, 112,12, 115,28, 621,0.15) < 0) return {region:'wingBone', depth:6};
      if (triSDF(px,py, 90,35, 80,28, 88,42, 622,0.15) < 0) return {region:'wingBone', depth:6};

      return null;
    }

    // ── Material rendering ──
    const MATS = {
      skin:      { pals: [palSkin1, palSkin2, palSkin3], outline: [18,10,6] },
      head:      { pals: [palSkin1, palSkin2, palSkin3], outline: [18,10,6] },
      belly:     { pals: [palBelly1, palBelly2, palBelly3], outline: [22,18,10] },
      wingBone:  { pals: [palWing1, palWing2, palWing3], outline: [10,16,18] },
      membrane:  { pals: [palMembrane1, palMembrane2, palMembrane3], outline: [8,12,15] },
      flame:     { pals: [palFlame1, palFlame2, palFlame3], outline: [28,8,4] },
      claw:      { pals: [palClaw1, palClaw2, palClaw1], outline: [18,15,12] },
      horn:      { pals: [palHorn1, palHorn2, palHorn1], outline: [16,12,8] },
      eye:       { pals: [palEye, palEye, palEye], outline: [10,8,6] },
      mouthInner:{ pals: [makePal(350,40,15,5), makePal(340,35,12,4), makePal(0,30,18,4)], outline: [12,5,5] },
      dark:      { pals: [makePal(20,20,10,4), makePal(280,15,8,4), makePal(20,20,10,4)], outline: [5,3,3] },
    };

    const lightX = -0.55, lightY = -0.75;

    function renderPixel(x, y) {
      const region = getRegion(x, y);
      if (!region) return;

      // Edge detection: check if neighbors are different/empty
      let isEdge = false, isInnerEdge = false;
      for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        const nr = getRegion(x+dx, y+dy);
        if (!nr) { isEdge = true; break; }
        if (nr.region !== region.region) { isInnerEdge = true; }
      }

      const mat = MATS[region.region] || MATS.skin;

      if (isEdge) {
        setP(x, y, mat.outline[0], mat.outline[1], mat.outline[2]);
        return;
      }
      if (isInnerEdge) {
        const [or,og,ob] = mat.outline;
        setP(x, y, or+15, og+12, ob+10);
        return;
      }

      // Lightness from position + noise
      let L = 0.35 + (x * lightX + y * lightY) * 0.002;
      L += (fbm(x*0.1, y*0.1, 5, 100 + region.region.length) - 0.5) * 0.15;
      L += (fbm(x*0.3, y*0.3, 4, 101 + region.region.length) - 0.5) * 0.08;
      L += (fbm(x*0.7, y*0.7, 3, 102 + region.region.length) - 0.5) * 0.04;

      // Scale detail (for skin regions)
      if (region.region === 'skin' || region.region === 'head') {
        const scaleN = fbm(x * 0.4, y * 0.35, 3, 150);
        if (scaleN > 0.55 && scaleN < 0.6) L -= 0.06;
        if (scaleN > 0.7 && scaleN < 0.73) L += 0.04;
      }

      // Wing vein detail
      if (region.region === 'membrane') {
        const veinN = fbm(x * 0.15, y * 0.2, 4, 160);
        if (veinN > 0.58 && veinN < 0.63) L -= 0.08;
      }

      L = Math.max(0.02, Math.min(0.98, L));

      // Multi-palette selection
      const hueN = fbm(x*0.08, y*0.08, 4, 200 + region.depth);
      const fineN = hash(x, y, 300 + region.depth);
      const pals = mat.pals;
      let pal;
      if (hueN < 0.35) pal = pals[0];
      else if (hueN < 0.65) pal = pals[1];
      else pal = pals[2];

      const pLen = pal.length;
      const ri = (L * (pLen - 0.01)) | 0;
      const ni = Math.min(ri + 1, pLen - 1);
      const bt = L * (pLen - 1) - ri;
      let [r, g, b] = dithPick(x, y, bt) ? pal[ni] : pal[ri];

      // Per-pixel palette switch
      if (fineN > 0.87) {
        const ap = pals[((fineN * 10) | 0) % pals.length];
        const ai = Math.min(ap.length - 1, (L * ap.length) | 0);
        [r, g, b] = ap[ai];
      }

      // Micro-detail
      if (hash(x, y, 400) > 0.9) {
        const bump = hash(x, y, 401) > 0.5 ? 1 : -1;
        const adj = Math.max(0, Math.min(pLen - 1, ri + bump));
        if (hash(x, y, 402) > 0.5) [r, g, b] = pal[adj];
        else { r = (r + pal[adj][0]) >> 1; g = (g + pal[adj][1]) >> 1; b = (b + pal[adj][2]) >> 1; }
      }

      // Cross-material accent
      if (hash(x, y, 500) > 0.95) {
        const accPals = [palSkin2, palWing2, palBelly1, palFlame1];
        const ap = accPals[(hash(x, y, 501) * accPals.length) | 0];
        const ai = Math.min(ap.length - 1, (L * ap.length) | 0);
        const [ar, ag, ab] = ap[ai];
        r = (r * 0.7 + ar * 0.3) | 0; g = (g * 0.7 + ag * 0.3) | 0; b = (b * 0.7 + ab * 0.3) | 0;
      }

      setP(x, y, r, g, b);
    }

    // ── Render ──
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) renderPixel(x, y);

    // Add eye highlight (bright white pixel)
    setP(154, 54, 255, 252, 240);
    setP(153, 55, 240, 235, 220);

    // Show at 2x
    const c2 = document.getElementById('sprite');
    c2.width = W; c2.height = H;
    c2.style.width = (W*2)+'px'; c2.style.height = (H*2)+'px';
    c2.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buf), W, H), 0, 0);

    // 1x
    const c1 = document.getElementById('sprite1x');
    c1.width = W; c1.height = H;
    c1.style.width = W+'px'; c1.style.height = H+'px';
    c1.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buf), W, H), 0, 0);

    // Dark bg
    const cd = document.getElementById('dark');
    cd.width = W; cd.height = H;
    cd.style.width = (W*2)+'px'; cd.style.height = (H*2)+'px';
    const dCtx = cd.getContext('2d');
    dCtx.fillStyle = '#0e0a1e'; dCtx.fillRect(0, 0, W, H);
    dCtx.putImageData(new ImageData(new Uint8ClampedArray(buf), W, H), 0, 0);
  </script>
</body>
</html>
