<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Engine - Space Scene (High Detail)</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0818;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh}
    canvas{image-rendering:pixelated;image-rendering:crisp-edges}
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <script>
    // High-detail pixel-level rendering
    // 480x320 native, 2x scale = 960x640 display
    // Finer pixels, more noise octaves, richer palettes

    const ART_W = 480, ART_H = 320;
    const SCALE = 2;
    const canvas = document.getElementById('scene');
    canvas.width = ART_W; canvas.height = ART_H;
    canvas.style.width = (ART_W * SCALE) + 'px';
    canvas.style.height = (ART_H * SCALE) + 'px';
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Frame buffer
    let frame = ctx.createImageData(ART_W, ART_H);
    const fp = frame.data;

    function setP(x, y, r, g, b, a) {
      x |= 0; y |= 0;
      if (x < 0 || x >= ART_W || y < 0 || y >= ART_H) return;
      const i = (y * ART_W + x) << 2;
      if (a === undefined || a >= 255) { fp[i]=r; fp[i+1]=g; fp[i+2]=b; fp[i+3]=255; return; }
      if (a < 1) return;
      const sa=a/255, da=fp[i+3]/255, oa=sa+da*(1-sa);
      if(oa<0.002)return;
      fp[i]=((r*sa+fp[i]*da*(1-sa))/oa+0.5)|0;
      fp[i+1]=((g*sa+fp[i+1]*da*(1-sa))/oa+0.5)|0;
      fp[i+2]=((b*sa+fp[i+2]*da*(1-sa))/oa+0.5)|0;
      fp[i+3]=(oa*255+0.5)|0;
    }

    // ── Noise ──
    function hash(x,y,s){let h=(x*374761393+y*668265263+s*1274126177)|0;h=((h^(h>>13))*1274126177)|0;return((h^(h>>16))&0x7fffffff)/0x7fffffff}
    function noise2d(x,y,s){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);const a=hash(ix,iy,s),b=hash(ix+1,iy,s),c=hash(ix,iy+1,s),d=hash(ix+1,iy+1,s);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}
    function fbm(x,y,oct,s){let v=0,a=1,f=1,m=0;for(let i=0;i<oct;i++){v+=noise2d(x*f,y*f,s+i*31)*a;m+=a;a*=0.5;f*=2.1}return v/m}

    // ── Color ──
    function hsl2rgb(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return[(r+m)*255+0.5|0,(g+m)*255+0.5|0,(b+m)*255+0.5|0]}

    function makePal(bh,bs,bl,n){const p=[];for(let i=0;i<n;i++){const t=i/(n-1);const hs=t<0.5?-25*(1-t*2):15*(t-0.5)*2;const h=bh+hs;const sb=t<0.3?10*(1-t/0.3):t>0.8?-18*(t-0.8)/0.2:0;const s=Math.max(0,Math.min(100,bs+sb));const l=Math.min(92,5+t*(bl+15));p.push(hsl2rgb(h,s,l))}return p}

    // Dithering
    const B4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    function dithPick(x,y,t){return t>B4[y&3][x&3]/16}

    function irregR(a,r,rough,seed){return r+fbm(Math.cos(a)*4,Math.sin(a)*4,5,seed)*rough*r}

    // ══════════════════════════════════════════════════════════════════
    // PRE-RENDERED LAYERS (computed once, composited per frame)
    // ══════════════════════════════════════════════════════════════════

    const CX = ART_W/2, CY = ART_H/2;
    const PR = 55; // planet radius (bigger at higher res)

    // ── Stars (static) ──
    const starBuf = new Uint8ClampedArray(ART_W*ART_H*4);
    {
      for(let y=0;y<ART_H;y++)for(let x=0;x<ART_W;x++){
        const i=(y*ART_W+x)*4;
        const n=fbm(x*0.015,y*0.015,4,200);
        starBuf[i]=8+n*10|0; starBuf[i+1]=6+n*6|0; starBuf[i+2]=16+n*14|0; starBuf[i+3]=255;
      }
      // Nebula
      for(let k=0;k<4;k++){
        const nx=60+hash(k,0,300)*(ART_W-120),ny=40+hash(k,1,300)*(ART_H-80),nr=40+hash(k,2,300)*70;
        const nh=[280,330,200,15][k];const[cr,cg,cb]=hsl2rgb(nh,30,16);
        for(let y=Math.max(0,ny-nr|0);y<Math.min(ART_H,(ny+nr|0)+1);y++)for(let x=Math.max(0,nx-nr|0);x<Math.min(ART_W,(nx+nr|0)+1);x++){
          const d=Math.sqrt((x-nx)**2+(y-ny)**2);if(d>nr)continue;const t=1-d/nr;const al=t*t*0.1;
          const i=(y*ART_W+x)*4;
          starBuf[i]=Math.min(255,starBuf[i]+(cr*al|0));starBuf[i+1]=Math.min(255,starBuf[i+1]+(cg*al|0));starBuf[i+2]=Math.min(255,starBuf[i+2]+(cb*al|0));
        }
      }
      // Stars
      for(let i=0;i<400;i++){
        const x=hash(i,0,400)*ART_W|0,y=hash(i,1,400)*ART_H|0;
        const br=80+hash(i,2,400)*175|0;const hu=hash(i,3,400)<0.3?220:hash(i,3,400)<0.5?40:0;
        const sa=hash(i,4,400)*20|0;const[sr,sg,sb]=hsl2rgb(hu,sa,35+br/255*55);
        const idx=(y*ART_W+x)*4;starBuf[idx]=sr;starBuf[idx+1]=sg;starBuf[idx+2]=sb;
        if(br>180){const[dr,dg,db]=hsl2rgb(hu,sa,25+br/255*20);
          for(const[dx,dy]of[[-1,0],[1,0],[0,-1],[0,1]]){const nx=x+dx,ny=y+dy;
            if(nx>=0&&nx<ART_W&&ny>=0&&ny<ART_H){const ni=(ny*ART_W+nx)*4;
              starBuf[ni]=Math.min(255,starBuf[ni]+(dr*0.25|0));starBuf[ni+1]=Math.min(255,starBuf[ni+1]+(dg*0.25|0));starBuf[ni+2]=Math.min(255,starBuf[ni+2]+(db*0.25|0))}}}
      }
    }

    // ── Planet (static — pre-rendered with maximum detail) ──
    //
    // COLOR PHILOSOPHY: Each pixel gets INDEPENDENT hue, saturation, and
    // lightness variation. Not just "shade index into one palette."
    // Even uniformly dark areas have 4+ distinct colors interleaved,
    // creating the psychedelic depth of the reference art.
    //
    // Multiple palettes blended by noise:
    //  - Base red (lit surface)
    //  - Cool purple (shadow)
    //  - Warm orange (highlight accent)
    //  - Blue-gray (mineral deposits)
    //  - Deep crimson (volcanic)
    const palBase    = makePal(5, 68, 52, 12);
    const palShadow  = makePal(280, 35, 20, 10);  // purple shadows
    const palShadow2 = makePal(230, 30, 16, 8);   // blue-gray shadow accent
    const palShadow3 = makePal(340, 50, 18, 8);   // deep crimson shadow
    const palWarm    = makePal(25, 75, 55, 10);    // orange highlight
    const palMineral = makePal(200, 25, 35, 8);    // blue-gray mineral
    const palVolcanic= makePal(15, 80, 40, 8);     // volcanic orange-red

    const planetBuf = new Int32Array(ART_W * ART_H);
    const planetAlpha = new Uint8Array(ART_W * ART_H);
    {
      planetBuf.fill(-1);
      const lightX = Math.cos(-0.8), lightY = Math.sin(-0.8);

      for(let py=-PR-4;py<=PR+4;py++)for(let px=-PR-4;px<=PR+4;px++){
        const x=(CX+px)|0, y=(CY+py)|0;
        if(x<0||x>=ART_W||y<0||y>=ART_H)continue;
        const dist=Math.sqrt(px*px+py*py);
        const angle=Math.atan2(py,px);
        const edgeR=irregR(angle,PR,0.05,42);
        const idx=y*ART_W+x;

        // Atmosphere rim
        if(dist>edgeR&&dist<edgeR+4){
          const rimT=1-(dist-edgeR)/4;
          const ld=(px*lightX+py*lightY)/dist;
          if(ld>-0.3){
            const rimB=rimT*(0.25+ld*0.35);
            const[rr,rg,rb]=palBase[9];
            planetBuf[idx]=(rr<<16)|(rg<<8)|rb;
            planetAlpha[idx]=rimB*90|0;
          }
          continue;
        }
        if(dist>edgeR)continue;

        // Outline
        if(dist>edgeR-0.8){
          planetBuf[idx]=(10<<16)|(5<<8)|7;
          planetAlpha[idx]=255;
          continue;
        }

        const normD=dist/edgeR;
        const ld=(px*lightX+py*lightY)/(dist+0.001);

        // ── CHANNEL 1: Base lightness ──
        let L = 0.22 + ld * 0.33 + (1-normD) * 0.12;
        L += (fbm(px*0.1, py*0.1, 6, 77) - 0.5) * 0.18;
        L += (fbm(px*0.35, py*0.35, 4, 78) - 0.5) * 0.08;
        L += (fbm(px*0.8, py*0.8, 3, 79) - 0.5) * 0.04;

        // Atmospheric bands
        const bandN = fbm(px*0.04 + py*0.001, py*0.12, 4, 123);
        L += (bandN - 0.5) * 0.07;

        // ── CHANNEL 2: Hue variation (independent of lightness) ──
        // This is what gives different colors even in uniformly dark areas
        const hueNoise1 = fbm(px*0.06, py*0.06, 5, 300); // broad regions
        const hueNoise2 = fbm(px*0.2, py*0.2, 4, 301);   // medium detail
        const hueNoise3 = fbm(px*0.5, py*0.5, 3, 302);   // fine detail

        // ── CHANNEL 3: Material type (which palette to use) ──
        const matNoise = fbm(px*0.08, py*0.08, 4, 400);
        const matFine = hash(x, y, 401);

        // Craters
        let craterMod = 0;
        let inCrater = false;
        for(let ci=0;ci<14;ci++){
          const ca=hash(ci,0,888)*Math.PI*2, cd=hash(ci,1,888)*0.8;
          const cr=1.5+hash(ci,2,888)*8;
          const ccx=Math.cos(ca)*cd*PR, ccy=Math.sin(ca)*cd*PR;
          const cdist=Math.sqrt((px-ccx)**2+(py-ccy)**2);
          const crEdge=irregR(Math.atan2(py-ccy,px-ccx),cr,0.2,888+ci);
          if(cdist<crEdge){
            inCrater = true;
            const crT=cdist/crEdge;
            if(crT>0.75){
              const rimL=((px-ccx)*lightX+(py-ccy)*lightY)/(cdist+0.01);
              craterMod = 0.08 + rimL*0.06;
            } else if(crT>0.5){
              craterMod = -0.05;
              if(hash(x,y,900+ci)>0.7) craterMod -= 0.05;
            } else {
              craterMod = -0.2*(1-crT/0.5);
              craterMod += (hash(x,y,901+ci)-0.5)*0.08;
            }
            break;
          }
        }
        L += craterMod;

        // Ridges and valleys
        const ridge = fbm(px*0.2, py*0.15, 4, 200);
        if(ridge>0.58&&ridge<0.62) L -= 0.08;
        if(ridge>0.72&&ridge<0.75) L += 0.05;

        // Terminator
        if(ld < -0.05) L *= 0.25 + 0.75*Math.max(0, (ld+0.05)/0.05 + 0.3);

        L = Math.max(0, Math.min(1, L));

        // ── FINAL COLOR: Blend multiple palettes based on independent noise channels ──
        // This is what creates 4+ colors even in dark uniform areas.
        //
        // The key insight: instead of picking ONE palette, we blend
        // contributions from several palettes weighted by noise.

        let r, g, b;

        if (ld > 0.1) {
          // ── LIT SIDE: base red + warm accent + mineral streaks ──
          const palIdx = (L * (palBase.length - 0.01)) | 0;
          const nextIdx = Math.min(palIdx + 1, palBase.length - 1);
          const bandT = L * (palBase.length - 1) - palIdx;
          [r, g, b] = dithPick(x, y, bandT) ? palBase[nextIdx] : palBase[palIdx];

          // Warm accent blending (noise-driven)
          if (hueNoise1 > 0.55) {
            const wIdx = Math.min(palWarm.length-1, (L * palWarm.length) | 0);
            const [wr, wg, wb] = palWarm[wIdx];
            const blend = (hueNoise1 - 0.55) * 3; // 0-1
            r = (r * (1-blend) + wr * blend) | 0;
            g = (g * (1-blend) + wg * blend) | 0;
            b = (b * (1-blend) + wb * blend) | 0;
          }

          // Mineral streak (occasional different-hue pixels)
          if (matNoise > 0.7 && hueNoise2 > 0.6) {
            const mIdx = Math.min(palMineral.length-1, (L * palMineral.length) | 0);
            [r, g, b] = palMineral[mIdx];
          }

        } else if (ld > -0.15) {
          // ── TERMINATOR ZONE: blend between lit and shadow palettes ──
          const shadowT = (-ld + 0.1) / 0.25;

          const lIdx = (L * (palBase.length - 0.01)) | 0;
          const [lr, lg, lb] = palBase[Math.min(lIdx, palBase.length-1)];

          const sIdx = (L * (palShadow.length - 0.01)) | 0;
          const [sr, sg, sb] = palShadow[Math.min(sIdx, palShadow.length-1)];

          // Dithered blend at terminator (not smooth!)
          if (dithPick(x, y, shadowT)) {
            r = sr; g = sg; b = sb;
          } else {
            r = lr; g = lg; b = lb;
          }

          // Volcanic accent in terminator zone
          if (hueNoise2 > 0.65) {
            const vIdx = Math.min(palVolcanic.length-1, (L * 1.5 * palVolcanic.length) | 0);
            const [vr, vg, vb] = palVolcanic[vIdx];
            r = (r * 0.6 + vr * 0.4) | 0;
            g = (g * 0.6 + vg * 0.4) | 0;
            b = (b * 0.6 + vb * 0.4) | 0;
          }

        } else {
          // ── SHADOW SIDE: MULTIPLE dark palettes blended by noise ──
          // This is where the "3rd and 4th color" comes from.
          // Even though it's all dark, we use 3 different shadow palettes
          // with independent noise to select between them.

          // Each pixel picks from one of 3 shadow palettes based on noise
          const palChoice = hueNoise1 * 3; // 0-3

          let pal, pLen;
          if (palChoice < 1 || (matFine > 0.8)) {
            // Purple shadow
            pal = palShadow; pLen = pal.length;
          } else if (palChoice < 2) {
            // Blue-gray shadow
            pal = palShadow2; pLen = pal.length;
          } else {
            // Deep crimson shadow
            pal = palShadow3; pLen = pal.length;
          }

          const sIdx = (L * (pLen - 0.01)) | 0;
          const sNext = Math.min(sIdx + 1, pLen - 1);
          const sBandT = L * (pLen - 1) - sIdx;
          [r, g, b] = dithPick(x, y, sBandT) ? pal[sNext] : pal[sIdx];

          // Per-pixel palette switching: ~15% of pixels use a DIFFERENT
          // shadow palette than their neighbors. This is the "trippiness."
          if (hueNoise3 > 0.62) {
            const altPal = hueNoise2 > 0.5 ? palShadow2 : palShadow3;
            const altIdx = Math.min(altPal.length-1, (L * altPal.length * 1.2) | 0);
            [r, g, b] = altPal[altIdx];
          }

          // Volcanic hot spots deep in shadow (rare bright accent)
          if (matNoise > 0.78 && inCrater && L > 0.05) {
            const vIdx = Math.min(palVolcanic.length-1, (L * 2 * palVolcanic.length) | 0);
            [r, g, b] = palVolcanic[vIdx];
          }

          // Mineral deposits (blue-gray flecks)
          if (hash(x, y, 601) > 0.9 && hueNoise2 > 0.5) {
            const mIdx = Math.min(palMineral.length-1, Math.max(0, (L * palMineral.length * 1.5) | 0));
            [r, g, b] = palMineral[mIdx];
          }
        }

        // ── Scattered micro-detail (independent of everything above) ──
        // ~10% of ALL pixels get a random nudge from a different palette
        if (hash(x, y, 557) > 0.9) {
          const microPals = [palShadow, palShadow2, palShadow3, palWarm, palMineral, palVolcanic];
          const mPal = microPals[(hash(x, y, 558) * microPals.length) | 0];
          const mIdx = Math.min(mPal.length-1, (L * mPal.length) | 0);
          const [mr, mg, mb] = mPal[mIdx];
          // 50/50 replace or blend
          if (hash(x, y, 559) > 0.5) {
            r = mr; g = mg; b = mb;
          } else {
            r = (r + mr) >> 1; g = (g + mg) >> 1; b = (b + mb) >> 1;
          }
        }

        planetBuf[idx] = (r << 16) | (g << 8) | b;
        planetAlpha[idx] = 255;
      }
    }

    // ══════════════════════════════════════════════════════════════════
    // DYNAMIC OBJECTS
    // ══════════════════════════════════════════════════════════════════

    // Asteroids — each gets 3 palettes for multi-hue depth
    const asteroids=[];
    for(let i=0;i<14;i++){
      const h=hash(i,0,55);
      const baseHue = 20+hash(i,4,55)*40;
      asteroids.push({
        orbitR:72+h*120, speed:(0.08+hash(i,1,55)*0.2)*(hash(i,2,55)<0.3?-1:1),
        size:4+Math.floor(hash(i,3,55)*14),
        pal1:makePal(baseHue, 15+hash(i,5,55)*20, 35+hash(i,6,55)*15, 8),
        pal2:makePal(baseHue+40, 20, 28, 6),  // warm accent
        pal3:makePal(baseHue-60, 15, 22, 6),   // cool accent
        seed:i*137, tilt:0.65+hash(i,7,55)*0.35,
        phase:hash(i,8,55)*Math.PI*2, rotSpeed:(hash(i,9,55)-0.5)*2.5
      });
    }

    function drawAsteroid(a,t){
      const ox=CX+Math.cos(a.phase+t*a.speed)*a.orbitR;
      const oy=CY+Math.sin(a.phase+t*a.speed)*a.orbitR*a.tilt;
      const rot=t*a.rotSpeed;const sz=a.size;const cr=Math.cos(rot),sr=Math.sin(rot);

      for(let py=-sz-3;py<=sz+3;py++)for(let px=-sz-3;px<=sz+3;px++){
        const rpx=px*cr-py*sr, rpy=px*sr+py*cr;
        const x=(ox+px)|0, y=(oy+py)|0;
        if(x<0||x>=ART_W||y<0||y>=ART_H)continue;

        const dist=Math.sqrt(rpx*rpx+rpy*rpy);
        const angle=Math.atan2(rpy,rpx);
        const edgeR=irregR(angle,sz*0.7,0.4,a.seed);

        if(dist>edgeR+0.5)continue;
        if(dist>edgeR-0.5){setP(x,y,6,5,4);continue}

        const ld=(rpx*(-0.55)+rpy*(-0.7))/(dist+0.01);
        let shade=0.28+ld*0.33;
        shade+=(fbm(rpx*0.25,rpy*0.25,5,a.seed+10)-0.5)*0.22;
        shade+=(fbm(rpx*0.6,rpy*0.6,3,a.seed+11)-0.5)*0.1;

        const ck=fbm(rpx*0.45,rpy*0.45,4,a.seed+20);
        if(ck>0.62&&ck<0.66)shade-=0.12;

        for(let pi=0;pi<3;pi++){
          const pa=hash(pi,0,a.seed+50)*Math.PI*2,pd=hash(pi,1,a.seed+50)*0.5;
          const pr=1+hash(pi,2,a.seed+50)*2.5;
          const pcx=Math.cos(pa)*pd*sz*0.7,pcy=Math.sin(pa)*pd*sz*0.7;
          const pdist=Math.sqrt((rpx-pcx)**2+(rpy-pcy)**2);
          if(pdist<pr){shade-=0.12*(1-pdist/pr);shade+=(hash(x,y,a.seed+60+pi)-0.5)*0.05}
        }

        shade=Math.max(0,Math.min(1,shade));

        // Multi-palette selection (same principle as planet)
        const hueN=fbm(rpx*0.3,rpy*0.3,3,a.seed+30);
        let pal,pLen;
        if(hueN<0.35){ pal=a.pal1; pLen=pal.length; }
        else if(hueN<0.6){ pal=a.pal2; pLen=pal.length; }
        else { pal=a.pal3; pLen=pal.length; }

        const ri=(shade*(pLen-0.01))|0;
        const ni=Math.min(ri+1,pLen-1);
        let[r,g,b]=dithPick(x,y,shade*(pLen-1)-ri)?pal[ni]:pal[ri];

        // Per-pixel palette switch (~12%)
        if(hash(x+a.seed,y,666)>0.88){
          const altPal=hash(x,y,668)>0.5?a.pal2:a.pal3;
          const ai=Math.min(altPal.length-1,(shade*altPal.length)|0);
          [r,g,b]=altPal[ai];
        }
        setP(x,y,r,g,b);
      }
    }

    // Comets
    const comets=[];
    const cHues=[185,42,275];
    for(let i=0;i<3;i++){
      const h=cHues[i];
      comets.push({
        orbitR:85+i*40, speed:0.3+hash(i,0,99)*0.2,
        phase:hash(i,1,99)*Math.PI*2, tilt:0.55+hash(i,2,99)*0.4,
        size:2+Math.floor(hash(i,3,99)*2),
        pal:makePal(h,80,62,7), seed:500+i, trail:[]
      });
    }

    function drawComet(c,t){
      const cx=CX+Math.cos(c.phase+t*c.speed)*c.orbitR;
      const cy=CY+Math.sin(c.phase+t*c.speed)*c.orbitR*c.tilt;
      const pal=c.pal;const sz=c.size;

      c.trail.push({x:cx,y:cy});
      if(c.trail.length>28)c.trail.shift();

      // Trail: scattered pixel particles with color gradient
      for(let i=0;i<c.trail.length;i++){
        const tp=c.trail[i];
        const lifeT=i/c.trail.length;
        const numP=1+Math.floor(lifeT*4);
        const spread=(1-lifeT)*4;

        for(let p=0;p<numP;p++){
          const ppx=(tp.x+(hash(i,p,c.seed+100)-0.5)*spread)|0;
          const ppy=(tp.y+(hash(i,p+50,c.seed+100)-0.5)*spread)|0;
          if(ppx<0||ppx>=ART_W||ppy<0||ppy>=ART_H)continue;

          // Color: bright near head, dimmer at tail
          const ci=Math.min(pal.length-1,(lifeT*4)|0);
          const [r,g,b]=pal[ci];
          const alpha=(lifeT*220)|0;
          setP(ppx,ppy,r,g,b,alpha);

          // Occasional extra bright pixel
          if(lifeT>0.6&&hash(i,p+99,c.seed+101)>0.7){
            setP(ppx,ppy,pal[pal.length-1][0],pal[pal.length-1][1],pal[pal.length-1][2],alpha);
          }
        }
      }

      // Core: irregular, multi-shade
      for(let py=-sz-3;py<=sz+3;py++)for(let px=-sz-3;px<=sz+3;px++){
        const x=(cx+px)|0,y=(cy+py)|0;
        if(x<0||x>=ART_W||y<0||y>=ART_H)continue;
        const dist=Math.sqrt(px*px+py*py);
        const angle=Math.atan2(py,px);
        const edgeR=irregR(angle,sz,0.35,c.seed);

        if(dist>edgeR+2)continue;

        // Glow halo
        if(dist>edgeR){
          const glowT=1-(dist-edgeR)/2;
          const[r,g,b]=pal[4];
          setP(x,y,r,g,b,(glowT*55)|0);
          continue;
        }

        // Core surface
        const coreT=1-dist/edgeR;
        let ci;
        if(coreT>0.6)ci=pal.length-1;
        else if(coreT>0.35)ci=pal.length-2;
        else if(coreT>0.15)ci=pal.length-3;
        else ci=pal.length-4;

        // Surface texture on core
        ci=Math.max(0,Math.min(pal.length-1,ci+(hash(x,y,c.seed+200)>0.8?(hash(x,y,c.seed+201)>0.5?1:-1):0)));
        const[r,g,b]=pal[ci];
        setP(x,y,r,g,b);
      }
    }

    // Orbit dots
    function drawOrbits(){
      for(let ai=0;ai<3;ai++){
        const a=asteroids[ai];
        for(let i=0;i<80;i++){
          const ang=(i/80)*Math.PI*2;
          const x=(CX+Math.cos(ang)*a.orbitR)|0;
          const y=(CY+Math.sin(ang)*a.orbitR*a.tilt)|0;
          if(x<0||x>=ART_W||y<0||y>=ART_H)continue;
          if(i%5===0)setP(x,y,25,20,38,35);
        }
      }
    }

    // ══════════════════════════════════════════════════════════════════
    // MAIN LOOP
    // ══════════════════════════════════════════════════════════════════

    let time=0;
    function orbY(phase,speed,orbitR,tilt,t){return Math.sin(phase+t*speed)*orbitR*tilt}

    function render(){
      time+=1/60;

      // Blit stars
      fp.set(starBuf);

      // Blit pre-rendered planet
      for(let i=0;i<planetBuf.length;i++){
        if(planetBuf[i]<0)continue;
        const a=planetAlpha[i];
        const r=(planetBuf[i]>>16)&255, g=(planetBuf[i]>>8)&255, b=planetBuf[i]&255;
        const x=i%ART_W, y=(i/ART_W)|0;
        setP(x,y,r,g,b,a);
      }

      // Orbit hints
      drawOrbits();

      // Z-sort objects
      const objs=[];
      for(const a of asteroids)objs.push({t:'a',o:a,y:orbY(a.phase,a.speed,a.orbitR,a.tilt,time)});
      for(const c of comets)objs.push({t:'c',o:c,y:orbY(c.phase,c.speed,c.orbitR,c.tilt,time)});

      // Behind planet (y < 0)
      for(const o of objs.filter(o=>o.y<0).sort((a,b)=>a.y-b.y)){
        if(o.t==='a')drawAsteroid(o.o,time);else drawComet(o.o,time);
      }

      // Re-blit planet over behind objects (planet is in front of them)
      for(let i=0;i<planetBuf.length;i++){
        if(planetAlpha[i]<200)continue; // only solid planet pixels
        const r=(planetBuf[i]>>16)&255,g=(planetBuf[i]>>8)&255,b=planetBuf[i]&255;
        const fi=i<<2;
        fp[fi]=r;fp[fi+1]=g;fp[fi+2]=b;fp[fi+3]=255;
      }

      // In front of planet (y >= 0)
      for(const o of objs.filter(o=>o.y>=0).sort((a,b)=>a.y-b.y)){
        if(o.t==='a')drawAsteroid(o.o,time);else drawComet(o.o,time);
      }

      ctx.putImageData(frame,0,0);
      requestAnimationFrame(render);
    }

    document.getElementById('scene').addEventListener('click',()=>{
      // Toggle 1x/2x scale on click
      const cur=parseInt(canvas.style.width);
      if(cur>ART_W*1.5){canvas.style.width=ART_W+'px';canvas.style.height=ART_H+'px'}
      else{canvas.style.width=(ART_W*SCALE)+'px';canvas.style.height=(ART_H*SCALE)+'px'}
    });

    render();
  </script>
</body>
</html>
