<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#181230"/>
      <stop offset="40%" stop-color="#0e0a1a"/>
      <stop offset="100%" stop-color="#030205"/>
    </radialGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#ee5040" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ee5040" stop-opacity="0"/>
    </radialGradient>

    <!-- W gradient: white center → orange → deep red -->
    <linearGradient id="wFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffe0c0"/>
      <stop offset="12%" stop-color="#ff9058"/>
      <stop offset="40%" stop-color="#dd3018"/>
      <stop offset="65%" stop-color="#cc2510"/>
      <stop offset="85%" stop-color="#dd3520"/>
      <stop offset="100%" stop-color="#ee5535"/>
    </linearGradient>

    <!-- Three-layer glow: tight white core + orange mid + red wide -->
    <filter id="wGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="tight"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="mid"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="wide"/>
      <feColorMatrix in="tight" type="matrix" values="1.4 0.1 0 0 0.15  0.1 0.8 0 0 0.08  0 0 0.6 0 0.03  0 0 0 1.3 0" result="hotCore"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="mid"/>
        <feMergeNode in="hotCore"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#glow)"/>

  <!-- ═══ HEX FRAME — thin hairline + bright vertex nodes ═══ -->
  <!-- Outer frame: hairline, precise -->
  <polygon points="128,20 216,58 216,184 128,222 40,184 40,58"
           fill="none" stroke="#dd4530" stroke-opacity="0.45" stroke-width="1.2"
           stroke-linejoin="miter" filter="url(#softGlow)"/>

  <!-- Inner inset hex: cooler tint, thinner, receded -->
  <polygon points="128,34 205,66 205,176 128,208 51,176 51,66"
           fill="none" stroke="#aa5050" stroke-opacity="0.18" stroke-width="0.6"
           stroke-linejoin="miter"/>

  <!-- Vertex point-lights with white specular core -->
  <g filter="url(#softGlow)">
    <!-- Outer glow (larger) -->
    <circle cx="128" cy="20" r="5" fill="#ff7040" fill-opacity="0.35"/>
    <circle cx="216" cy="58" r="4" fill="#ff7040" fill-opacity="0.25"/>
    <circle cx="216" cy="184" r="4" fill="#ff7040" fill-opacity="0.25"/>
    <circle cx="128" cy="222" r="5" fill="#ff7040" fill-opacity="0.35"/>
    <circle cx="40" cy="184" r="4" fill="#ff7040" fill-opacity="0.25"/>
    <circle cx="40" cy="58" r="4" fill="#ff7040" fill-opacity="0.25"/>
    <!-- White specular cores (brighter, sharper) -->
    <circle cx="128" cy="20" r="2" fill="#fff0e0" fill-opacity="0.8"/>
    <circle cx="216" cy="58" r="1.5" fill="#ffe8d8" fill-opacity="0.65"/>
    <circle cx="216" cy="184" r="1.5" fill="#ffe8d8" fill-opacity="0.65"/>
    <circle cx="128" cy="222" r="2" fill="#fff0e0" fill-opacity="0.8"/>
    <circle cx="40" cy="184" r="1.5" fill="#ffe8d8" fill-opacity="0.65"/>
    <circle cx="40" cy="58" r="1.5" fill="#ffe8d8" fill-opacity="0.65"/>
  </g>

  <!-- ═══ THE W — tighter proportions, three-layer glow ═══ -->
  <g filter="url(#wGlow)">
    <!-- W: thinner strokes to match hairline hex aesthetic -->
    <path d="M72,68 L95,190 L115,118 L128,170 L141,118 L161,190 L184,68
             L172,68 L156,172 L140,112 L128,150 L116,112 L100,172 L84,68 Z"
          fill="url(#wFill)" stroke="#ff6040" stroke-width="1.2" stroke-linejoin="miter"
          stroke-opacity="0.7"/>

    <!-- Specular highlight strokes on upper-left edges of W legs -->
    <clipPath id="wClip">
      <path d="M72,68 L95,190 L115,118 L128,170 L141,118 L161,190 L184,68
               L172,68 L156,172 L140,112 L128,150 L116,112 L100,172 L84,68 Z"/>
    </clipPath>
    <g clip-path="url(#wClip)" opacity="0.25">
      <line x1="78" y1="72" x2="97" y2="178" stroke="#ffeee0" stroke-width="1"/>
      <line x1="182" y1="72" x2="159" y2="178" stroke="#ffeee0" stroke-width="1"/>
    </g>
  </g>
</svg>
