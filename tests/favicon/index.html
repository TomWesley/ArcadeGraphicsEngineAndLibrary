<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favicon Generator — SVG Approach</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0c0b12;color:#ccc;font-family:'Share Tech Mono',monospace;padding:40px;display:flex;flex-direction:column;align-items:center}
    h1{font-family:'Orbitron',sans-serif;font-size:14px;color:#cc3030;margin-bottom:6px;letter-spacing:4px}
    .sub{font-size:10px;color:#555;margin-bottom:30px;letter-spacing:2px}
    .previews{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;margin-bottom:30px;align-items:end}
    .preview{display:flex;flex-direction:column;align-items:center;gap:8px}
    .preview .label{font-size:9px;color:#555;letter-spacing:1px}
    .preview .frame{background:#0c0b12;border:1px solid #222;display:flex;align-items:center;justify-content:center;padding:8px;border-radius:4px}
    .browser-mock{background:#1a1a22;border-radius:8px 8px 0 0;width:450px;border:1px solid #2a2a35;overflow:hidden;margin-bottom:20px}
    .browser-tab{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#12121a;border-bottom:1px solid #2a2a35}
    .browser-tab .dots{display:flex;gap:4px}
    .browser-tab .dot{width:8px;height:8px;border-radius:50%}
    .browser-tab .tab-label{display:flex;align-items:center;gap:6px;background:#1e1e28;padding:4px 12px;border-radius:4px 4px 0 0;font-size:9px;color:#888}
    .browser-tab .tab-label img{width:14px;height:14px}
    .browser-body{height:60px;display:flex;align-items:center;justify-content:center;color:#333;font-size:10px;letter-spacing:2px}
    .download-btn{margin-top:10px;background:rgba(200,40,40,0.08);border:1px solid rgba(200,40,40,0.25);color:#aa4444;
      font-family:'Orbitron',sans-serif;font-size:11px;padding:10px 24px;cursor:pointer;letter-spacing:2px;transition:all 0.2s}
    .download-btn:hover{border-color:rgba(200,40,40,0.5);color:#dd5555}
    .svg-source{margin-top:20px;width:100%;max-width:700px}
    .svg-source summary{font-size:9px;color:#555;cursor:pointer;letter-spacing:2px;padding:6px 0}
    .svg-source pre{background:#0a0a12;border:1px solid #1a1a25;padding:12px;font-size:8px;color:#666;overflow-x:auto;max-height:300px;overflow-y:auto;margin-top:6px;border-radius:4px}
  </style>
</head>
<body>
  <h1>FAVICON — SVG APPROACH</h1>
  <p class="sub">VECTOR PRECISION // INFINITE SCALABILITY</p>

  <div class="previews">
    <div class="preview">
      <div class="frame" style="padding:12px"><div id="svg256" style="width:128px;height:128px"></div></div>
      <span class="label">256×256 (shown 128)</span>
    </div>
    <div class="preview">
      <div class="frame"><div id="svg64" style="width:64px;height:64px"></div></div>
      <span class="label">64×64</span>
    </div>
    <div class="preview">
      <div class="frame"><div id="svg32" style="width:32px;height:32px"></div></div>
      <span class="label">32×32</span>
    </div>
    <div class="preview">
      <div class="frame"><div id="svg16" style="width:16px;height:16px"></div></div>
      <span class="label">16×16</span>
    </div>
    <div class="preview">
      <div class="frame" style="background:#f0ede8"><div id="svgLight" style="width:64px;height:64px"></div></div>
      <span class="label">On light bg</span>
    </div>
  </div>

  <div class="browser-mock">
    <div class="browser-tab">
      <div class="dots">
        <div class="dot" style="background:#ff5f57"></div>
        <div class="dot" style="background:#febc2e"></div>
        <div class="dot" style="background:#28c840"></div>
      </div>
      <div class="tab-label">
        <img id="tabIcon">
        <span>VOID SECTOR — Play Now</span>
      </div>
    </div>
    <div class="browser-body">GAME CONTENT</div>
  </div>

  <button class="download-btn" onclick="downloadSVG()">DOWNLOAD SVG</button>
  <button class="download-btn" onclick="downloadPNG()" style="margin-left:8px">DOWNLOAD 256px PNG</button>

  <details class="svg-source">
    <summary>VIEW SVG SOURCE</summary>
    <pre id="svgCode"></pre>
  </details>

  <script>
    const SVG_SOURCE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#151028"/>
      <stop offset="100%" stop-color="#040306"/>
    </radialGradient>

    <radialGradient id="glow" cx="50%" cy="45%" r="38%">
      <stop offset="0%" stop-color="#ee5040" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ee5040" stop-opacity="0"/>
    </radialGradient>

    <!-- W fill: hot amber top → deep red → warm bottom -->
    <linearGradient id="wFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffd0a0"/>
      <stop offset="20%" stop-color="#ff8050"/>
      <stop offset="50%" stop-color="#cc2818"/>
      <stop offset="80%" stop-color="#dd4028"/>
      <stop offset="100%" stop-color="#ee6040"/>
    </linearGradient>

    <filter id="wGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#glow)"/>

  <!-- ═══ HEXAGONAL FRAME — bright, clean, bold ═══ -->
  <polygon points="128,18 218,58 218,186 128,226 38,186 38,58"
           fill="none" stroke="#dd4530" stroke-opacity="0.45" stroke-width="2.5"
           stroke-linejoin="miter" filter="url(#lineGlow)"/>

  <!-- Lit top edges (directional light from above) -->
  <line x1="38" y1="58" x2="128" y2="18" stroke="#ff9070" stroke-opacity="0.55" stroke-width="2" filter="url(#lineGlow)"/>
  <line x1="128" y1="18" x2="218" y2="58" stroke="#ff8060" stroke-opacity="0.4" stroke-width="1.8" filter="url(#lineGlow)"/>

  <!-- Inner hex ring (85% scale, layered depth) -->
  <polygon points="128,36 204,68 204,176 128,208 52,176 52,68"
           fill="none" stroke="#dd4530" stroke-opacity="0.15" stroke-width="1"
           stroke-linejoin="miter"/>

  <!-- Vertex indicators (small, precise — matching warm palette) -->
  <g fill="#ff8060" fill-opacity="0.5">
    <circle cx="128" cy="18" r="2.2"/><circle cx="218" cy="58" r="2"/>
    <circle cx="218" cy="186" r="2"/><circle cx="128" cy="226" r="2.2"/>
    <circle cx="38" cy="186" r="2"/><circle cx="38" cy="58" r="2"/>
  </g>
  <!-- Top/bottom crosshair ticks (calibration) -->
  <g stroke="#ff8060" stroke-opacity="0.3" stroke-width="0.8">
    <line x1="128" y1="13" x2="128" y2="23"/><line x1="123" y1="18" x2="133" y2="18"/>
    <line x1="128" y1="221" x2="128" y2="231"/><line x1="123" y1="226" x2="133" y2="226"/>
  </g>

  <!-- Cool teal underglow — STRONGER, visible -->
  <radialGradient id="coolGlow" cx="50%" cy="60%" r="35%">
    <stop offset="0%" stop-color="#40c0d0" stop-opacity="0.15"/>
    <stop offset="60%" stop-color="#308090" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#308090" stop-opacity="0"/>
  </radialGradient>
  <rect x="40" y="80" width="176" height="140" fill="url(#coolGlow)"/>

  <!-- Range tick marks (bolder, visible) -->
  <g stroke="#dd5040" stroke-opacity="0.4" stroke-width="1.5">
    <!-- Left vertex ticks -->
    <line x1="33" y1="56" x2="43" y2="56"/><line x1="33" y1="62" x2="40" y2="62"/>
    <line x1="33" y1="184" x2="43" y2="184"/><line x1="33" y1="190" x2="40" y2="190"/>
    <!-- Right vertex ticks -->
    <line x1="213" y1="56" x2="223" y2="56"/><line x1="216" y1="62" x2="223" y2="62"/>
    <line x1="213" y1="184" x2="223" y2="184"/><line x1="216" y1="190" x2="223" y2="190"/>
  </g>

  <!-- ═══ THE W — clean, bold, tech-styled ═══ -->
  <g filter="url(#wGlow)">
    <!-- W shape: bold, angular, reads clearly -->
    <path d="M72,72 L96,188 L114,124 L128,172 L142,124 L160,188 L184,72
             L168,72 L152,168 L138,116 L128,150 L118,116 L104,168 L88,72 Z"
          fill="url(#wFill)" stroke="#ff7050" stroke-width="2" stroke-linejoin="miter"
          stroke-opacity="0.85"/>

    <!-- Tech detail: thin horizontal scan lines across the W (subtle) -->
    <clipPath id="wClip">
      <path d="M72,72 L96,188 L114,124 L128,172 L142,124 L160,188 L184,72
               L168,72 L152,168 L138,116 L128,150 L118,116 L104,168 L88,72 Z"/>
    </clipPath>
    <g clip-path="url(#wClip)" opacity="0.12">
      <line x1="60" y1="90" x2="196" y2="90" stroke="#ffd0c0" stroke-width="0.6"/>
      <line x1="60" y1="110" x2="196" y2="110" stroke="#ffd0c0" stroke-width="0.6"/>
      <line x1="60" y1="130" x2="196" y2="130" stroke="#ffd0c0" stroke-width="0.6"/>
      <line x1="60" y1="150" x2="196" y2="150" stroke="#ffd0c0" stroke-width="0.6"/>
      <line x1="60" y1="170" x2="196" y2="170" stroke="#ffd0c0" stroke-width="0.6"/>
    </g>

    <!-- Specular highlight ridges down each W stroke face (3D bevel) -->
    <g clip-path="url(#wClip)" opacity="0.3" stroke="#fff4e8" stroke-width="1.2" stroke-linecap="round">
      <!-- Left outer leg -->
      <line x1="80" y1="76" x2="97" y2="178"/>
      <!-- Left inner leg -->
      <line x1="100" y1="170" x2="113" y2="128"/>
      <!-- Center left -->
      <line x1="116" y1="122" x2="128" y2="164"/>
      <!-- Center right -->
      <line x1="128" y1="164" x2="140" y2="122"/>
      <!-- Right inner leg -->
      <line x1="143" y1="128" x2="156" y2="170"/>
      <!-- Right outer leg -->
      <line x1="176" y1="76" x2="159" y2="178"/>
    </g>

    <!-- Top edge bright accent (machined edge catch) -->
    <line x1="72" y1="71" x2="88" y2="71" stroke="#ffd8c0" stroke-width="1.5" stroke-opacity="0.5" filter="url(#lineGlow)"/>
    <line x1="168" y1="71" x2="184" y2="71" stroke="#ffd8c0" stroke-width="1.5" stroke-opacity="0.5" filter="url(#lineGlow)"/>
  </g>

  <!-- Teal accent lines — BOLD, unmissable cool contrast -->
  <line x1="38" y1="186" x2="128" y2="226" stroke="#55dde8" stroke-opacity="0.55" stroke-width="2" filter="url(#lineGlow)"/>
  <line x1="128" y1="226" x2="218" y2="186" stroke="#55dde8" stroke-opacity="0.45" stroke-width="1.8" filter="url(#lineGlow)"/>
  <!-- Teal vertex glow at bottom -->
  <circle cx="128" cy="226" r="3" fill="#55dde8" fill-opacity="0.5"/>
  <!-- Left side hint of teal -->
  <line x1="38" y1="140" x2="38" y2="186" stroke="#55dde8" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Small wing accents (minimal, clean — just angular marks flanking the W) -->
  <line x1="108" y1="100" x2="50" y2="78" stroke="#dd4530" stroke-opacity="0.3" stroke-width="1.5" filter="url(#lineGlow)"/>
  <line x1="108" y1="112" x2="60" y2="96" stroke="#dd4530" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="148" y1="100" x2="206" y2="78" stroke="#dd4530" stroke-opacity="0.3" stroke-width="1.5" filter="url(#lineGlow)"/>
  <line x1="148" y1="112" x2="196" y2="96" stroke="#dd4530" stroke-opacity="0.15" stroke-width="1"/>
</svg>
`;

    // Inject SVG into all preview slots
    ['svg256','svg64','svg32','svg16','svgLight'].forEach(id => {
      document.getElementById(id).innerHTML = SVG_SOURCE;
    });

    // Show SVG source
    document.getElementById('svgCode').textContent = SVG_SOURCE;

    // Set as actual favicon
    const svgBlob = new Blob([SVG_SOURCE], {type: 'image/svg+xml'});
    const svgUrl = URL.createObjectURL(svgBlob);
    const link = document.createElement('link');
    link.rel = 'icon';
    link.type = 'image/svg+xml';
    link.href = svgUrl;
    document.head.appendChild(link);
    document.getElementById('tabIcon').src = svgUrl;

    function downloadSVG() {
      const a = document.createElement('a');
      a.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG_SOURCE);
      a.download = 'favicon.svg';
      a.click();
    }

    function downloadPNG() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, 256, 256);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'favicon-256.png';
        a.click();
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG_SOURCE);
    }
  </script>
</body>
</html>
