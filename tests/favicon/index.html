<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favicon Generator — SVG Approach</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0c0b12;color:#ccc;font-family:'Share Tech Mono',monospace;padding:40px;display:flex;flex-direction:column;align-items:center}
    h1{font-family:'Orbitron',sans-serif;font-size:14px;color:#cc3030;margin-bottom:6px;letter-spacing:4px}
    .sub{font-size:10px;color:#555;margin-bottom:30px;letter-spacing:2px}
    .previews{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;margin-bottom:30px;align-items:end}
    .preview{display:flex;flex-direction:column;align-items:center;gap:8px}
    .preview .label{font-size:9px;color:#555;letter-spacing:1px}
    .preview .frame{background:#0c0b12;border:1px solid #222;display:flex;align-items:center;justify-content:center;padding:8px;border-radius:4px}
    .browser-mock{background:#1a1a22;border-radius:8px 8px 0 0;width:450px;border:1px solid #2a2a35;overflow:hidden;margin-bottom:20px}
    .browser-tab{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#12121a;border-bottom:1px solid #2a2a35}
    .browser-tab .dots{display:flex;gap:4px}
    .browser-tab .dot{width:8px;height:8px;border-radius:50%}
    .browser-tab .tab-label{display:flex;align-items:center;gap:6px;background:#1e1e28;padding:4px 12px;border-radius:4px 4px 0 0;font-size:9px;color:#888}
    .browser-tab .tab-label img{width:14px;height:14px}
    .browser-body{height:60px;display:flex;align-items:center;justify-content:center;color:#333;font-size:10px;letter-spacing:2px}
    .download-btn{margin-top:10px;background:rgba(200,40,40,0.08);border:1px solid rgba(200,40,40,0.25);color:#aa4444;
      font-family:'Orbitron',sans-serif;font-size:11px;padding:10px 24px;cursor:pointer;letter-spacing:2px;transition:all 0.2s}
    .download-btn:hover{border-color:rgba(200,40,40,0.5);color:#dd5555}
    .svg-source{margin-top:20px;width:100%;max-width:700px}
    .svg-source summary{font-size:9px;color:#555;cursor:pointer;letter-spacing:2px;padding:6px 0}
    .svg-source pre{background:#0a0a12;border:1px solid #1a1a25;padding:12px;font-size:8px;color:#666;overflow-x:auto;max-height:300px;overflow-y:auto;margin-top:6px;border-radius:4px}
  </style>
</head>
<body>
  <h1>FAVICON — SVG APPROACH</h1>
  <p class="sub">VECTOR PRECISION // INFINITE SCALABILITY</p>

  <div class="previews">
    <div class="preview">
      <div class="frame" style="padding:12px"><div id="svg256" style="width:128px;height:128px"></div></div>
      <span class="label">256×256 (shown 128)</span>
    </div>
    <div class="preview">
      <div class="frame"><div id="svg64" style="width:64px;height:64px"></div></div>
      <span class="label">64×64</span>
    </div>
    <div class="preview">
      <div class="frame"><div id="svg32" style="width:32px;height:32px"></div></div>
      <span class="label">32×32</span>
    </div>
    <div class="preview">
      <div class="frame"><div id="svg16" style="width:16px;height:16px"></div></div>
      <span class="label">16×16</span>
    </div>
    <div class="preview">
      <div class="frame" style="background:#f0ede8"><div id="svgLight" style="width:64px;height:64px"></div></div>
      <span class="label">On light bg</span>
    </div>
  </div>

  <div class="browser-mock">
    <div class="browser-tab">
      <div class="dots">
        <div class="dot" style="background:#ff5f57"></div>
        <div class="dot" style="background:#febc2e"></div>
        <div class="dot" style="background:#28c840"></div>
      </div>
      <div class="tab-label">
        <img id="tabIcon">
        <span>VOID SECTOR — Play Now</span>
      </div>
    </div>
    <div class="browser-body">GAME CONTENT</div>
  </div>

  <button class="download-btn" onclick="downloadSVG()">DOWNLOAD SVG</button>
  <button class="download-btn" onclick="downloadPNG()" style="margin-left:8px">DOWNLOAD 256px PNG</button>

  <details class="svg-source">
    <summary>VIEW SVG SOURCE</summary>
    <pre id="svgCode"></pre>
  </details>

  <script>
    const SVG_SOURCE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Deeper background radial with stronger vignette -->
    <radialGradient id="bg" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#181330"/>
      <stop offset="40%" stop-color="#0c0a16"/>
      <stop offset="100%" stop-color="#030305"/>
    </radialGradient>

    <!-- Stronger atmospheric glow with outer corona -->
    <radialGradient id="glow" cx="50%" cy="44%" r="38%">
      <stop offset="0%" stop-color="#ee5040" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#dd4030" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#cc3520" stop-opacity="0"/>
    </radialGradient>
    <!-- Extended outer corona (light emission beyond hex) -->
    <radialGradient id="corona" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#cc3520" stop-opacity="0"/>
      <stop offset="60%" stop-color="#cc3520" stop-opacity="0.04"/>
      <stop offset="80%" stop-color="#bb2515" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#aa2010" stop-opacity="0"/>
    </radialGradient>

    <!-- Wing gradients with stronger opacity range -->
    <linearGradient id="wingL" x1="0%" y1="40%" x2="85%" y2="60%">
      <stop offset="0%" stop-color="#cc3520" stop-opacity="0.02"/>
      <stop offset="35%" stop-color="#cc3520" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#dd4030" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ee5040" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wingR" x1="100%" y1="40%" x2="15%" y2="60%">
      <stop offset="0%" stop-color="#cc3520" stop-opacity="0.02"/>
      <stop offset="35%" stop-color="#cc3520" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#dd4030" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ee5040" stop-opacity="0.5"/>
    </linearGradient>

    <!-- W body gradient: white-hot center → deep amber → warm edges -->
    <linearGradient id="wFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffe8d0" stop-opacity="0.95"/>
      <stop offset="12%" stop-color="#ffa870" stop-opacity="0.92"/>
      <stop offset="30%" stop-color="#ee6535" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#cc3818" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#dd4525" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ee6545" stop-opacity="0.88"/>
    </linearGradient>

    <!-- Sharper top-edge highlight -->
    <linearGradient id="wHi" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffc0b0" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#ffb0a0" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#ffb0a0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffc0b0" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Two-tone W glow: tight hot core + wider atmospheric -->
    <filter id="wGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="sharp"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="mid"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="wide"/>
      <feColorMatrix in="sharp" type="matrix" values="1.3 0 0 0 0.1  0 0.8 0 0 0.05  0 0 0.7 0 0.02  0 0 0 1.2 0" result="hotCore"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="mid"/>
        <feMergeNode in="hotCore"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wing glow -->
    <filter id="wingGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sharp edge highlight filter (crisp 1px glow) -->
    <filter id="edgeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Reflection -->
    <linearGradient id="reflect" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#cc3520" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#cc3520" stop-opacity="0"/>
    </linearGradient>

    <!-- Outer containment ring gradient -->
    <radialGradient id="ringGrad" cx="50%" cy="46%" r="48%">
      <stop offset="80%" stop-color="#cc3520" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#cc3520" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background with deeper vignette + corona -->
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#corona)"/>
  <rect width="256" height="256" fill="url(#glow)"/>

  <!-- Hexagonal containment frame (crisp, visible) -->
  <polygon points="128,14 222,60 222,180 128,226 34,180 34,60"
           fill="none" stroke="#dd4030" stroke-opacity="0.22" stroke-width="1.8" filter="url(#edgeGlow)"/>
  <polygon points="128,22 216,64 216,176 128,218 40,176 40,64"
           fill="none" stroke="#cc3520" stroke-opacity="0.08" stroke-width="0.7"/>
  <!-- Corner vertex dots — COOL CYAN accent for premium material contrast -->
  <g fill="#60c8d8" fill-opacity="0.4">
    <circle cx="128" cy="14" r="2.5"/><circle cx="222" cy="60" r="2.5"/>
    <circle cx="222" cy="180" r="2.5"/><circle cx="128" cy="226" r="2.5"/>
    <circle cx="34" cy="180" r="2.5"/><circle cx="34" cy="60" r="2.5"/>
  </g>
  <!-- Cyan specular shimmer on top hex edges -->
  <line x1="36" y1="61" x2="80" y2="38" stroke="#80e0f0" stroke-opacity="0.12" stroke-width="0.6"/>
  <line x1="176" y1="38" x2="220" y2="61" stroke="#80e0f0" stroke-opacity="0.08" stroke-width="0.5"/>
  <!-- Directional specular edge on hex (upper-left face lit) -->
  <line x1="34" y1="60" x2="128" y2="14" stroke="#ffd8c8" stroke-opacity="0.35" stroke-width="1.8" filter="url(#edgeGlow)"/>
  <line x1="128" y1="14" x2="222" y2="60" stroke="#ffc8b8" stroke-opacity="0.18" stroke-width="1.2"/>
  <!-- Inner hex ring (visible secondary layer) -->
  <polygon points="128,32 206,68 206,172 128,208 50,172 50,68"
           fill="none" stroke="#dd5040" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="6,5" filter="url(#edgeGlow)"/>
  <!-- Inner glow ring -->
  <circle cx="128" cy="120" r="75" fill="none" stroke="#dd5040" stroke-opacity="0.08" stroke-width="0.8"/>

  <!-- ═══ LEFT WING (sharper angles) ═══ -->
  <g filter="url(#wingGlow)">
    <!-- Main blade — sharper tip angle, more angular -->
    <path d="M110,96 L76,52 L32,65 L20,82 L46,98 L78,116 L110,120 Z"
          fill="url(#wingL)" stroke="#dd4030" stroke-opacity="0.65" stroke-width="1.5"
          stroke-linejoin="miter" shape-rendering="crispEdges"/>
    <!-- Secondary blade (thinner, more angular) -->
    <path d="M108,88 L68,42 L30,52 L54,74 L90,96 Z"
          fill="#cc3520" fill-opacity="0.12" stroke="#cc3520" stroke-opacity="0.3" stroke-width="0.7"/>
    <!-- Wing structure lines -->
    <line x1="100" y1="102" x2="44" y2="74" stroke="#dd4030" stroke-opacity="0.22" stroke-width="0.7"/>
    <line x1="98" y1="110" x2="52" y2="88" stroke="#cc3520" stroke-opacity="0.15" stroke-width="0.5"/>
    <line x1="104" y1="94" x2="56" y2="58" stroke="#dd4030" stroke-opacity="0.18" stroke-width="0.6"/>
    <!-- SHARP precision edge highlights (hard 1px) -->
    <line x1="76" y1="52" x2="32" y2="65" stroke="#ffb09a" stroke-opacity="0.5" stroke-width="1.5" filter="url(#edgeGlow)"/>
    <line x1="76" y1="52" x2="110" y2="96" stroke="#ffa088" stroke-opacity="0.35" stroke-width="1.2" filter="url(#edgeGlow)"/>
    <!-- White-hot inner edge + specular vertex dot at wing tip -->
    <line x1="76" y1="53" x2="38" y2="64" stroke="#ffd8c8" stroke-opacity="0.25" stroke-width="0.6"/>
    <circle cx="20" cy="82" r="2" fill="#80e0f0" fill-opacity="0.25"/>
    <circle cx="76" cy="52" r="1.5" fill="#ffe8e0" fill-opacity="0.5"/>
  </g>

  <!-- ═══ RIGHT WING (sharper angles) ═══ -->
  <g filter="url(#wingGlow)">
    <path d="M146,96 L180,52 L224,65 L236,82 L210,98 L178,116 L146,120 Z"
          fill="url(#wingR)" stroke="#dd4030" stroke-opacity="0.65" stroke-width="1.5"
          stroke-linejoin="miter"/>
    <path d="M148,88 L188,42 L226,52 L202,74 L166,96 Z"
          fill="#cc3520" fill-opacity="0.12" stroke="#cc3520" stroke-opacity="0.3" stroke-width="0.7"/>
    <line x1="156" y1="102" x2="212" y2="74" stroke="#dd4030" stroke-opacity="0.22" stroke-width="0.7"/>
    <line x1="158" y1="110" x2="204" y2="88" stroke="#cc3520" stroke-opacity="0.15" stroke-width="0.5"/>
    <line x1="152" y1="94" x2="200" y2="58" stroke="#dd4030" stroke-opacity="0.18" stroke-width="0.6"/>
    <line x1="180" y1="52" x2="224" y2="65" stroke="#ffb09a" stroke-opacity="0.5" stroke-width="1.5" filter="url(#edgeGlow)"/>
    <line x1="180" y1="52" x2="146" y2="96" stroke="#ffa088" stroke-opacity="0.35" stroke-width="1.2" filter="url(#edgeGlow)"/>
    <line x1="180" y1="53" x2="218" y2="64" stroke="#ffd8c8" stroke-opacity="0.25" stroke-width="0.6"/>
    <circle cx="236" cy="82" r="2" fill="#80e0f0" fill-opacity="0.25"/>
    <circle cx="180" cy="52" r="1.5" fill="#ffe8e0" fill-opacity="0.5"/>
  </g>

  <!-- ═══ THE W ═══ -->
  <g filter="url(#wGlow)">
    <!-- W solid shape -->
    <path d="M66,65 L91,195 L112,118 L128,178 L144,118 L165,195 L190,65
             L174,65 L157,175 L141,110 L128,158 L115,110 L99,175 L82,65 Z"
          fill="url(#wFill)" stroke="#ff7050" stroke-opacity="0.9" stroke-width="2.5"
          stroke-linejoin="miter"/>

    <!-- Highlight overlay -->
    <path d="M66,65 L91,195 L112,118 L128,178 L144,118 L165,195 L190,65
             L174,65 L157,175 L141,110 L128,158 L115,110 L99,175 L82,65 Z"
          fill="url(#wHi)" stroke="none"/>

    <!-- Inner bevel lines -->
    <line x1="74" y1="70" x2="95" y2="183" stroke="#ffb0a0" stroke-opacity="0.14" stroke-width="1.2"/>
    <line x1="95" y1="183" x2="112" y2="122" stroke="#ffb0a0" stroke-opacity="0.08" stroke-width="0.8"/>
    <line x1="114" y1="122" x2="128" y2="170" stroke="#ffb0a0" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="128" y1="170" x2="142" y2="122" stroke="#ffb0a0" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="144" y1="122" x2="161" y2="183" stroke="#ffb0a0" stroke-opacity="0.08" stroke-width="0.8"/>
    <line x1="182" y1="70" x2="161" y2="183" stroke="#ffb0a0" stroke-opacity="0.14" stroke-width="1.2"/>

    <!-- SHARP 1px top edge highlights (machined metal catch) -->
    <line x1="66" y1="63.5" x2="82" y2="63.5" stroke="#ffe0d0" stroke-opacity="0.6" stroke-width="1.5" filter="url(#edgeGlow)"/>
    <line x1="174" y1="63.5" x2="190" y2="63.5" stroke="#ffe0d0" stroke-opacity="0.6" stroke-width="1.5" filter="url(#edgeGlow)"/>
    <!-- Outer leg edge highlights -->
    <line x1="67" y1="66" x2="76" y2="90" stroke="#ffd0c0" stroke-opacity="0.15" stroke-width="0.8"/>
    <line x1="189" y1="66" x2="180" y2="90" stroke="#ffd0c0" stroke-opacity="0.15" stroke-width="0.8"/>

    <!-- Bottom point accent dots (brighter) -->
    <circle cx="91" cy="193" r="2.2" fill="#ff9070" fill-opacity="0.5" filter="url(#edgeGlow)"/>
    <circle cx="128" cy="176" r="2" fill="#ffa080" fill-opacity="0.45" filter="url(#edgeGlow)"/>
    <circle cx="165" cy="193" r="2.2" fill="#ff9070" fill-opacity="0.5" filter="url(#edgeGlow)"/>
  </g>

  <!-- Specular highlight: white-hot apex on the W -->
  <radialGradient id="specular" cx="50%" cy="20%" r="20%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
    <stop offset="40%" stop-color="#ffd0c0" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#ffd0c0" stop-opacity="0"/>
  </radialGradient>
  <rect x="80" y="55" width="96" height="60" fill="url(#specular)"/>

  <!-- Reflection -->
  <rect x="55" y="198" width="146" height="38" fill="url(#reflect)"/>

  <!-- Corner marks (sharper) -->
  <g stroke="#cc3520" stroke-opacity="0.15" stroke-width="1">
    <line x1="12" y1="18" x2="12" y2="32"/><line x1="12" y1="18" x2="26" y2="18"/>
    <line x1="244" y1="18" x2="244" y2="32"/><line x1="230" y1="18" x2="244" y2="18"/>
    <line x1="12" y1="238" x2="12" y2="224"/><line x1="12" y1="238" x2="26" y2="238"/>
    <line x1="244" y1="238" x2="244" y2="224"/><line x1="230" y1="238" x2="244" y2="238"/>
  </g>
  <!-- Corner dots -->
  <g fill="#cc3520" fill-opacity="0.2">
    <circle cx="12" cy="18" r="1.5"/><circle cx="244" cy="18" r="1.5"/>
    <circle cx="12" cy="238" r="1.5"/><circle cx="244" cy="238" r="1.5"/>
  </g>
</svg>`;

    // Inject SVG into all preview slots
    ['svg256','svg64','svg32','svg16','svgLight'].forEach(id => {
      document.getElementById(id).innerHTML = SVG_SOURCE;
    });

    // Show SVG source
    document.getElementById('svgCode').textContent = SVG_SOURCE;

    // Set as actual favicon
    const svgBlob = new Blob([SVG_SOURCE], {type: 'image/svg+xml'});
    const svgUrl = URL.createObjectURL(svgBlob);
    const link = document.createElement('link');
    link.rel = 'icon';
    link.type = 'image/svg+xml';
    link.href = svgUrl;
    document.head.appendChild(link);
    document.getElementById('tabIcon').src = svgUrl;

    function downloadSVG() {
      const a = document.createElement('a');
      a.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG_SOURCE);
      a.download = 'favicon.svg';
      a.click();
    }

    function downloadPNG() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, 256, 256);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'favicon-256.png';
        a.click();
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG_SOURCE);
    }
  </script>
</body>
</html>
