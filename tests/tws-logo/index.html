<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWS — Logo Round 4</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070708;
      min-height: 100vh; color: #d9d9d4;
      font-family: 'Rajdhani', sans-serif;
      padding: 36px 44px 100px;
      display: flex; flex-direction: column; align-items: center;
    }
    h1 { font-family: 'Share Tech Mono', monospace; font-size: 16px; letter-spacing: 6px; color: #f7f7f2; align-self: flex-start; }
    .sub { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #5c5c55; letter-spacing: 2px; margin: 6px 0 34px; align-self: flex-start; }
    .sub b { color: #FFDA03; font-weight: 400; }

    .hero {
      width: min(920px, 100%);
      background: #0a0a0b; border: 1px solid #17171a;
      display: flex; align-items: center; justify-content: center;
      padding: 30px 0;
      margin-bottom: 26px;
    }
    .hero svg { width: 100%; max-width: 760px; height: auto; }

    .chips { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .chip {
      width: 300px; height: 190px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #1d1d1f;
    }
    .chip.light { background: #ffffff; }
    .chip.yellow { background: #FFDA03; }
    .chip svg { width: 260px; height: auto; }
    .cap { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: #5c5c55; letter-spacing: 2px; margin-top: 22px; }
  </style>
</head>
<body>
  <h1>THE WINNING SEQUENCE</h1>
  <div class="sub">LOGO ROUND 4 // RELAY — CLEANED VECTOR BUILD // BLACK · WHITE · <b>#FFDA03</b> // CODE · CREATE · COMPETE</div>

  <div class="hero" id="hero"></div>
  <div class="chips" id="chips"></div>
  <div class="cap">LIGHT AND YELLOW SURFACES // MARK IS PURE SVG GEOMETRY — NO FONT IN THE MONOGRAM</div>

  <script>
    const YELLOW = '#FFDA03';
    const WHITE = '#F7F7F2';
    const BLACK = '#0B0B0C';
    // ink = T/W + words; accent = S + periods + relay tail
    const SURFACES = {
      dark:   { ink: WHITE, accent: YELLOW },
      light:  { ink: BLACK, accent: YELLOW },
      yellow: { ink: BLACK, accent: WHITE },
    };

    function svgMark(surface) {
      const { ink, accent } = SURFACES[surface];

      // ── The monogram — heavy oblique strokes, interlocked ──
      // Drawn upright, skewed as a group. Stroke 21, butt caps, miter joins.
      // T:  bar 0..80, stem at 40
      // W:  58..150 — first stroke tucks under the T bar
      // S:  top bar reaches back under the W's final stroke
      const letters = `
        <g stroke="${ink}" stroke-width="21" fill="none"
           stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2">
          <!-- T: stem overlaps fully into the bar — no seam -->
          <path d="M0,10.5 L84,10.5"/>
          <path d="M42,2 L42,96"/>
          <!-- W: first stroke tucks under the T bar; last rises to the cap -->
          <path d="M62,12 L84,96 L106,14 L128,96 L150,0"/>
        </g>
        <!-- S: one continuous path — mitered corners, no seams; terminal
             hooks (top-right down, bottom-left up) break the '5' reading -->
        <g stroke="${accent}" stroke-width="21" fill="none"
           stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2">
          <path d="M242,26 L242,10.5 L174,10.5 L174,42.5 L228,42.5 L228,85.5 L158,85.5 L158,68"/>
        </g>`;

      // ── The relay line — white leg hands off to the yellow leg ──
      const relay = `
        <g>
          <rect x="-2" y="-26" width="114" height="4.2" fill="${ink}"/>
          <path d="M112,-30.5 L126,-23.9 L112,-17.3 Z" fill="${ink}"/>
          <path d="M134,-30.5 L142,-23.9 L134,-17.3 L139.5,-17.3 L147.5,-23.9 L139.5,-30.5 Z" fill="${accent}"/>
          <rect x="154" y="-26" width="74" height="4.2" fill="${accent}"/>
          <path d="M228,-30.5 L242,-23.9 L228,-17.3 Z" fill="${accent}"/>
        </g>`;

      // ── Tagline — CODE. CREATE. COMPETE. with accent periods ──
      const tagline = `
        <text x="180" y="212" font-family="Rajdhani, sans-serif" font-weight="600"
              font-size="17" letter-spacing="4" text-anchor="middle" fill="${ink}"
              >CODE<tspan fill="${accent}">.</tspan>&#8195;CREATE<tspan fill="${accent}">.</tspan>&#8195;COMPETE<tspan fill="${accent}">.</tspan></text>
        <path d="M320,201 L327,206.5 L320,212 L324,212 L331,206.5 L324,201 Z" fill="${accent}"/>`;

      return `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 252">
  <g transform="translate(74,62) skewX(-12)">
    ${relay}
    ${letters}
  </g>
  ${tagline}
</svg>`;
    }

    document.getElementById('hero').innerHTML = svgMark('dark');
    const chips = document.getElementById('chips');
    for (const s of ['light', 'yellow']) {
      const chip = document.createElement('div');
      chip.className = 'chip ' + s;
      chip.innerHTML = svgMark(s);
      chips.appendChild(chip);
    }
  </script>
</body>
</html>
