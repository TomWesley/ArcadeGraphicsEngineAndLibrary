<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Library — Review & Approve</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#f0ede8;color:#333;font-family:'Rajdhani',sans-serif;padding:20px}
    h1{font-family:'Orbitron',sans-serif;font-size:16px;text-align:center;margin-bottom:4px;
      color:#cc2222}
    .sub{text-align:center;font-size:11px;color:#888;margin-bottom:12px;font-family:'Share Tech Mono',monospace;letter-spacing:2px}
    .stats{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Share Tech Mono',monospace}
    .stats .approved{color:#22aa44} .stats .pending{color:#cc2222}
    .controls{display:flex;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .controls button{background:rgba(200,30,30,0.04);border:1px solid rgba(200,30,30,0.15);color:#994444;
      font-family:'Rajdhani',sans-serif;font-size:13px;padding:6px 16px;cursor:pointer;letter-spacing:1px;transition:all 0.2s}
    .controls button:hover{border-color:rgba(200,30,30,0.4);color:#cc2222;background:rgba(200,30,30,0.08)}
    .controls button.active{border-color:rgba(30,160,60,0.4);color:#22aa44}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-width:1200px;margin:0 auto}
    .icon-card{
      display:flex;flex-direction:column;align-items:center;padding:10px 6px 8px;
      border:1px solid rgba(0,0,0,0.08);background:rgba(255,255,255,0.5);
      cursor:pointer;transition:all 0.25s;position:relative;border-radius:4px;
    }
    .icon-card:hover{border-color:rgba(200,30,30,0.3);background:rgba(255,255,255,0.8)}
    .icon-card.approved{border-color:rgba(30,160,60,0.35);background:rgba(230,255,235,0.5)}
    .icon-card.approved::after{content:'✓';position:absolute;top:4px;right:6px;color:#22aa44;font-size:14px;font-weight:bold}
    .icon-card canvas{margin-bottom:6px;background:#ffffff;border-radius:4px;border:1px solid rgba(0,0,0,0.06)}
    .icon-card .name{font-family:'Share Tech Mono',monospace;font-size:8px;color:#666;letter-spacing:1px;text-align:center}
    .icon-card.approved .name{color:#22884a}
    .export-area{margin-top:20px;text-align:center}
    .export-area textarea{background:#fff;border:1px solid #ddd;color:#555;font-family:'Share Tech Mono',monospace;
      font-size:9px;width:100%;max-width:800px;height:60px;padding:8px;resize:vertical}
  </style>
</head>
<body>
  <h1>ICON LIBRARY — REVIEW & APPROVE</h1>
  <p class="sub">CLICK TO APPROVE // CLICK AGAIN TO UNAPPROVE</p>
  <div class="stats" id="stats">0 / 50 APPROVED</div>
  <div class="controls">
    <button onclick="filterIcons('all')" class="active" id="filterAll">ALL (50)</button>
    <button onclick="filterIcons('approved')" id="filterApproved">APPROVED</button>
    <button onclick="filterIcons('pending')" id="filterPending">PENDING</button>
    <button onclick="approveAll()">APPROVE ALL</button>
    <button onclick="clearAll()">CLEAR ALL</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="export-area">
    <textarea id="exportList" readonly placeholder="Approved icon names will appear here..."></textarea>
  </div>

  <script>
    // Scarlet red + near-black for review on white background
    const P=[200,25,25], S=[30,30,35];
    const BOOST = 2.5;
    const pc=a=>`rgba(${P[0]},${P[1]},${P[2]},${Math.min(1,a*BOOST)})`;
    const sc=a=>`rgba(${S[0]},${S[1]},${S[2]},${Math.min(1,a*BOOST)})`;
    function glow(ctx,c,blur,a=0.4){ctx.shadowColor=`rgba(${c[0]},${c[1]},${c[2]},${Math.min(1,a*BOOST)})`;ctx.shadowBlur=blur*1.3}
    function noGlow(ctx){ctx.shadowColor='transparent';ctx.shadowBlur=0}

    // ══════════════════════════════════════════════════════════════════
    // 50 ICONS — HUD instrument style
    // ══════════════════════════════════════════════════════════════════

    const ICONS = {};
    const SZ = 80; // canvas size
    function u(n){return n*SZ/80}

    function defineIcon(name, drawFn) { ICONS[name] = drawFn; }

    // ── Playback / Navigation ──
    defineIcon('play', (ctx,cx,cy)=>{
      ctx.strokeStyle=pc(0.15);ctx.lineWidth=u(0.6);ctx.beginPath();ctx.arc(cx,cy,u(28),0,Math.PI*2);ctx.stroke();
      for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2;ctx.strokeStyle=i%3===0?sc(0.3):pc(0.08);ctx.lineWidth=i%3===0?u(0.8):u(0.4);
        ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*u(25),cy+Math.sin(a)*u(25));ctx.lineTo(cx+Math.cos(a)*u(i%3===0?30:28),cy+Math.sin(a)*u(i%3===0?30:28));ctx.stroke()}
      const g=ctx.createLinearGradient(cx-u(7),cy-u(10),cx+u(12),cy+u(6));g.addColorStop(0,pc(0.18));g.addColorStop(1,sc(0.12));
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx-u(7),cy-u(10));ctx.lineTo(cx+u(12),cy);ctx.lineTo(cx-u(7),cy+u(10));ctx.closePath();ctx.fill();
      glow(ctx,S,10,0.35);ctx.strokeStyle=sc(0.6);ctx.lineWidth=u(1);ctx.stroke();noGlow(ctx);
      glow(ctx,S,6,0.4);ctx.fillStyle=sc(0.5);ctx.beginPath();ctx.arc(cx+u(1.5),cy,u(1.5),0,Math.PI*2);ctx.fill();noGlow(ctx);
    });

    defineIcon('pause', (ctx,cx,cy)=>{
      ctx.strokeStyle=pc(0.12);ctx.lineWidth=u(0.6);ctx.beginPath();ctx.arc(cx,cy,u(26),0,Math.PI*2);ctx.stroke();
      for(const xo of[-u(5),u(5)]){const bx=cx+xo-u(3),by=cy-u(12),bw=u(6),bh=u(24);
        const g=ctx.createLinearGradient(bx,by,bx,by+bh);g.addColorStop(0,pc(0.2));g.addColorStop(1,pc(0.05));ctx.fillStyle=g;ctx.fillRect(bx,by,bw,bh);
        glow(ctx,P,6,0.25);ctx.strokeStyle=pc(0.45);ctx.lineWidth=u(0.7);ctx.strokeRect(bx,by,bw,bh);noGlow(ctx);
        ctx.strokeStyle=sc(0.25);ctx.lineWidth=u(0.4);ctx.beginPath();ctx.moveTo(bx+bw*0.3,by+u(2));ctx.lineTo(bx+bw*0.3,by+bh-u(2));ctx.stroke()}
    });

    defineIcon('stop', (ctx,cx,cy)=>{
      ctx.strokeStyle=pc(0.12);ctx.lineWidth=u(0.6);ctx.beginPath();ctx.arc(cx,cy,u(26),0,Math.PI*2);ctx.stroke();
      const s=u(18);glow(ctx,P,6,0.2);
      const g=ctx.createLinearGradient(cx-s/2,cy-s/2,cx+s/2,cy+s/2);g.addColorStop(0,pc(0.18));g.addColorStop(1,pc(0.06));
      ctx.fillStyle=g;ctx.fillRect(cx-s/2,cy-s/2,s,s);ctx.strokeStyle=pc(0.4);ctx.lineWidth=u(0.8);ctx.strokeRect(cx-s/2,cy-s/2,s,s);noGlow(ctx);
    });

    defineIcon('forward', (ctx,cx,cy)=>{
      glow(ctx,S,6,0.25);ctx.strokeStyle=sc(0.5);ctx.lineWidth=u(1.2);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(cx-u(8),cy-u(8));ctx.lineTo(cx+u(4),cy);ctx.lineTo(cx-u(8),cy+u(8));ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx,cy-u(8));ctx.lineTo(cx+u(12),cy);ctx.lineTo(cx,cy+u(8));ctx.stroke();noGlow(ctx);
    });

    defineIcon('back', (ctx,cx,cy)=>{
      glow(ctx,S,6,0.25);ctx.strokeStyle=sc(0.5);ctx.lineWidth=u(1.2);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(cx+u(8),cy-u(8));ctx.lineTo(cx-u(4),cy);ctx.lineTo(cx+u(8),cy+u(8));ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx,cy-u(8));ctx.lineTo(cx-u(12),cy);ctx.lineTo(cx,cy+u(8));ctx.stroke();noGlow(ctx);
    });

    defineIcon('restart', (ctx,cx,cy)=>{
      glow(ctx,S,6,0.2);ctx.strokeStyle=sc(0.4);ctx.lineWidth=u(1.2);ctx.lineCap='round';
      ctx.beginPath();ctx.arc(cx,cy,u(14),0.3,Math.PI*1.8);ctx.stroke();noGlow(ctx);
      ctx.fillStyle=sc(0.5);ctx.beginPath();const a=0.3;ctx.moveTo(cx+Math.cos(a)*u(10),cy+Math.sin(a)*u(10));
      ctx.lineTo(cx+Math.cos(a)*u(18),cy+Math.sin(a)*u(18));ctx.lineTo(cx+Math.cos(a+0.4)*u(14),cy+Math.sin(a+0.4)*u(14));ctx.fill();
    });

    // ── UI / Menu ──
    defineIcon('home', (ctx,cx,cy)=>{
      const g=ctx.createLinearGradient(cx,cy-u(14),cx,cy+u(14));g.addColorStop(0,pc(0.15));g.addColorStop(1,pc(0.04));
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx,cy-u(14));ctx.lineTo(cx+u(16),cy+u(2));ctx.lineTo(cx+u(12),cy+u(2));ctx.lineTo(cx+u(12),cy+u(14));
      ctx.lineTo(cx-u(12),cy+u(14));ctx.lineTo(cx-u(12),cy+u(2));ctx.lineTo(cx-u(16),cy+u(2));ctx.closePath();ctx.fill();
      glow(ctx,P,6,0.2);ctx.strokeStyle=pc(0.45);ctx.lineWidth=u(0.8);ctx.stroke();noGlow(ctx);
      glow(ctx,S,5,0.25);ctx.fillStyle=sc(0.2);ctx.fillRect(cx-u(3),cy+u(3),u(6),u(11));ctx.strokeStyle=sc(0.4);ctx.lineWidth=u(0.5);ctx.strokeRect(cx-u(3),cy+u(3),u(6),u(11));noGlow(ctx);
      ctx.fillStyle=pc(0.1);ctx.fillRect(cx+u(5),cy+u(3),u(5),u(4));ctx.strokeStyle=pc(0.2);ctx.lineWidth=u(0.4);ctx.strokeRect(cx+u(5),cy+u(3),u(5),u(4));
    });

    defineIcon('settings', (ctx,cx,cy)=>{
      ctx.setLineDash([u(2.5),u(3)]);ctx.strokeStyle=pc(0.08);ctx.lineWidth=u(0.4);ctx.beginPath();ctx.arc(cx,cy,u(30),0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      const teeth=8,or=u(20),ir=u(14),tw=Math.PI/teeth*0.4;ctx.beginPath();
      for(let i=0;i<teeth;i++){const a=(i/teeth)*Math.PI*2-Math.PI/2;ctx.lineTo(cx+Math.cos(a-tw)*ir,cy+Math.sin(a-tw)*ir);ctx.lineTo(cx+Math.cos(a-tw*0.7)*or,cy+Math.sin(a-tw*0.7)*or);ctx.lineTo(cx+Math.cos(a+tw*0.7)*or,cy+Math.sin(a+tw*0.7)*or);ctx.lineTo(cx+Math.cos(a+tw)*ir,cy+Math.sin(a+tw)*ir)}ctx.closePath();
      const gg=ctx.createRadialGradient(cx-u(4),cy-u(4),0,cx,cy,or);gg.addColorStop(0,pc(0.1));gg.addColorStop(1,pc(0.02));ctx.fillStyle=gg;ctx.fill();
      glow(ctx,P,6,0.2);ctx.strokeStyle=pc(0.4);ctx.lineWidth=u(0.7);ctx.stroke();noGlow(ctx);
      glow(ctx,S,6,0.3);ctx.fillStyle=sc(0.15);ctx.beginPath();ctx.arc(cx,cy,u(5),0,Math.PI*2);ctx.fill();ctx.strokeStyle=sc(0.4);ctx.lineWidth=u(0.5);ctx.stroke();noGlow(ctx);
      ctx.fillStyle=sc(0.4);ctx.beginPath();ctx.arc(cx,cy,u(1.5),0,Math.PI*2);ctx.fill();
    });

    defineIcon('menu-hamburger', (ctx,cx,cy)=>{
      glow(ctx,P,4,0.2);ctx.lineCap='round';
      for(let i=0;i<3;i++){const y=cy+(i-1)*u(8);ctx.strokeStyle=i===1?sc(0.5):pc(0.4);ctx.lineWidth=u(1.2);
        ctx.beginPath();ctx.moveTo(cx-u(14),y);ctx.lineTo(cx+u(14),y);ctx.stroke()}noGlow(ctx);
    });

    defineIcon('close', (ctx,cx,cy)=>{
      ctx.strokeStyle=pc(0.12);ctx.lineWidth=u(0.6);ctx.beginPath();ctx.arc(cx,cy,u(24),0,Math.PI*2);ctx.stroke();
      glow(ctx,P,6,0.3);ctx.strokeStyle=pc(0.55);ctx.lineWidth=u(1.5);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(cx-u(9),cy-u(9));ctx.lineTo(cx+u(9),cy+u(9));ctx.moveTo(cx+u(9),cy-u(9));ctx.lineTo(cx-u(9),cy+u(9));ctx.stroke();noGlow(ctx);
    });

    defineIcon('check', (ctx,cx,cy)=>{
      ctx.strokeStyle=sc(0.1);ctx.lineWidth=u(0.6);ctx.beginPath();ctx.arc(cx,cy,u(24),0,Math.PI*2);ctx.stroke();
      glow(ctx,S,8,0.35);ctx.strokeStyle=sc(0.65);ctx.lineWidth=u(2);ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(cx-u(10),cy);ctx.lineTo(cx-u(3),cy+u(8));ctx.lineTo(cx+u(12),cy-u(8));ctx.stroke();noGlow(ctx);
    });

    defineIcon('info', (ctx,cx,cy)=>{
      glow(ctx,S,6,0.2);ctx.strokeStyle=sc(0.35);ctx.lineWidth=u(0.8);ctx.beginPath();ctx.arc(cx,cy,u(22),0,Math.PI*2);ctx.stroke();noGlow(ctx);
      ctx.fillStyle=sc(0.5);ctx.beginPath();ctx.arc(cx,cy-u(8),u(2.5),0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=sc(0.45);ctx.lineWidth=u(2);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy-u(2));ctx.lineTo(cx,cy+u(10));ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-u(4),cy+u(10));ctx.lineTo(cx+u(4),cy+u(10));ctx.stroke();
    });

    defineIcon('warning', (ctx,cx,cy)=>{
      const g=ctx.createLinearGradient(cx,cy-u(16),cx,cy+u(14));g.addColorStop(0,pc(0.25));g.addColorStop(1,pc(0.06));
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx,cy-u(16));ctx.lineTo(cx+u(18),cy+u(14));ctx.lineTo(cx-u(18),cy+u(14));ctx.closePath();ctx.fill();
      glow(ctx,P,8,0.4);ctx.strokeStyle=pc(0.7);ctx.lineWidth=u(0.8);ctx.stroke();noGlow(ctx);
      ctx.fillStyle=pc(0.7);ctx.beginPath();ctx.arc(cx,cy+u(6),u(2),0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=pc(0.65);ctx.lineWidth=u(1.8);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy-u(6));ctx.lineTo(cx,cy+u(1));ctx.stroke();
    });

    defineIcon('error', (ctx,cx,cy)=>{
      glow(ctx,P,6,0.2);ctx.strokeStyle=pc(0.35);ctx.lineWidth=u(0.8);ctx.beginPath();ctx.arc(cx,cy,u(22),0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=pc(0.08);ctx.fill();
      ctx.strokeStyle=pc(0.55);ctx.lineWidth=u(1.5);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(cx-u(8),cy-u(8));ctx.lineTo(cx+u(8),cy+u(8));ctx.moveTo(cx+u(8),cy-u(8));ctx.lineTo(cx-u(8),cy+u(8));ctx.stroke();noGlow(ctx);
    });

    defineIcon('search', (ctx,cx,cy)=>{
      glow(ctx,P,5,0.2);ctx.strokeStyle=pc(0.4);ctx.lineWidth=u(1);ctx.beginPath();ctx.arc(cx-u(3),cy-u(3),u(12),0,Math.PI*2);ctx.stroke();noGlow(ctx);
      glow(ctx,S,6,0.3);ctx.strokeStyle=sc(0.5);ctx.lineWidth=u(2);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx+u(6),cy+u(6));ctx.lineTo(cx+u(15),cy+u(15));ctx.stroke();noGlow(ctx);
    });

    defineIcon('expand', (ctx,cx,cy)=>{
      ctx.strokeStyle=pc(0.3);ctx.lineWidth=u(0.8);ctx.lineCap='round';
      const s=u(10);[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([dx,dy])=>{
        ctx.beginPath();ctx.moveTo(cx+dx*s,cy+dy*u(4));ctx.lineTo(cx+dx*s,cy+dy*s);ctx.lineTo(cx+dx*u(4),cy+dy*s);ctx.stroke()});
    });

    defineIcon('minimize', (ctx,cx,cy)=>{
      glow(ctx,P,4,0.2);ctx.strokeStyle=pc(0.45);ctx.lineWidth=u(1.5);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(cx-u(12),cy);ctx.lineTo(cx+u(12),cy);ctx.stroke();noGlow(ctx);
    });

    // ── Game-specific ──
    defineIcon('sword', (ctx,cx,cy)=>{
      const bg=ctx.createLinearGradient(cx,cy-u(18),cx,cy+u(6));bg.addColorStop(0,pc(0.2));bg.addColorStop(0.5,pc(0.08));bg.addColorStop(1,pc(0.12));
      ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(cx,cy-u(18));ctx.lineTo(cx+u(3),cy+u(3));ctx.lineTo(cx,cy+u(5));ctx.lineTo(cx-u(3),cy+u(3));ctx.closePath();ctx.fill();
      glow(ctx,P,5,0.2);ctx.strokeStyle=pc(0.45);ctx.lineWidth=u(0.7);ctx.stroke();noGlow(ctx);
      ctx.strokeStyle=sc(0.2);ctx.lineWidth=u(0.3);ctx.beginPath();ctx.moveTo(cx,cy-u(16));ctx.lineTo(cx,cy+u(3));ctx.stroke();
      glow(ctx,S,4,0.25);ctx.fillStyle=sc(0.25);ctx.fillRect(cx-u(7),cy+u(4),u(14),u(2.5));ctx.strokeStyle=sc(0.4);ctx.lineWidth=u(0.5);ctx.strokeRect(cx-u(7),cy+u(4),u(14),u(2.5));noGlow(ctx);
      ctx.fillStyle=pc(0.12);ctx.fillRect(cx-u(1.5),cy+u(6.5),u(3),u(8));ctx.strokeStyle=pc(0.25);ctx.lineWidth=u(0.4);ctx.strokeRect(cx-u(1.5),cy+u(6.5),u(3),u(8));
      ctx.fillStyle=pc(0.2);ctx.beginPath();ctx.arc(cx,cy+u(16),u(2),0,Math.PI*2);ctx.fill();ctx.strokeStyle=pc(0.3);ctx.stroke();
    });

    defineIcon('shield', (ctx,cx,cy)=>{
      const g=ctx.createLinearGradient(cx-u(12),cy-u(16),cx+u(8),cy+u(16));g.addColorStop(0,pc(0.15));g.addColorStop(0.5,pc(0.05));g.addColorStop(1,pc(0.1));
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx,cy-u(16));ctx.lineTo(cx+u(14),cy-u(8));ctx.lineTo(cx+u(14),cy+u(2));
      ctx.bezierCurveTo(cx+u(12),cy+u(10),cx+u(5),cy+u(16),cx,cy+u(18));ctx.bezierCurveTo(cx-u(5),cy+u(16),cx-u(12),cy+u(10),cx-u(14),cy+u(2));
      ctx.lineTo(cx-u(14),cy-u(8));ctx.closePath();ctx.fill();
      glow(ctx,P,6,0.2);ctx.strokeStyle=pc(0.4);ctx.lineWidth=u(0.8);ctx.stroke();noGlow(ctx);
      glow(ctx,S,4,0.2);ctx.strokeStyle=sc(0.3);ctx.lineWidth=u(0.5);
      ctx.beginPath();ctx.moveTo(cx,cy-u(8));ctx.lineTo(cx,cy+u(8));ctx.moveTo(cx-u(5),cy-u(2));ctx.lineTo(cx+u(5),cy-u(2));ctx.stroke();noGlow(ctx);
    });

    defineIcon('heart', (ctx,cx,cy)=>{
      const g=ctx.createRadialGradient(cx-u(3),cy-u(4),u(2),cx,cy,u(18));g.addColorStop(0,pc(0.2));g.addColorStop(1,pc(0.04));
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx,cy+u(14));ctx.bezierCurveTo(cx-u(22),cy-u(2),cx-u(8),cy-u(18),cx,cy-u(8));
      ctx.bezierCurveTo(cx+u(8),cy-u(18),cx+u(22),cy-u(2),cx,cy+u(14));ctx.fill();
      glow(ctx,P,8,0.25);ctx.strokeStyle=pc(0.5);ctx.lineWidth=u(0.8);ctx.stroke();noGlow(ctx);
      ctx.fillStyle=pc(0.15);ctx.beginPath();ctx.ellipse(cx-u(5),cy-u(6),u(3),u(4),-0.3,0,Math.PI*2);ctx.fill();
    });

    defineIcon('star', (ctx,cx,cy)=>{
      function starPath(r1,r2){ctx.beginPath();for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2-Math.PI/2,r=i%2===0?r1:r2;
        i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}ctx.closePath()}
      const g=ctx.createRadialGradient(cx,cy,u(2),cx,cy,u(18));g.addColorStop(0,pc(0.2));g.addColorStop(1,pc(0.04));
      starPath(u(18),u(8));ctx.fillStyle=g;ctx.fill();
      glow(ctx,P,6,0.25);ctx.strokeStyle=pc(0.5);ctx.lineWidth=u(0.8);ctx.stroke();noGlow(ctx);
      starPath(u(10),u(5));ctx.strokeStyle=pc(0.15);ctx.lineWidth=u(0.4);ctx.stroke();
    });

    defineIcon('coin', (ctx,cx,cy)=>{
      const g=ctx.createRadialGradient(cx-u(4),cy-u(4),u(2),cx,cy,u(18));g.addColorStop(0,pc(0.18));g.addColorStop(1,pc(0.04));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,u(18),0,Math.PI*2);ctx.fill();
      glow(ctx,P,5,0.2);ctx.strokeStyle=pc(0.4);ctx.lineWidth=u(0.8);ctx.stroke();
      ctx.beginPath();ctx.arc(cx,cy,u(12),0,Math.PI*2);ctx.strokeStyle=pc(0.2);ctx.lineWidth=u(0.5);ctx.stroke();noGlow(ctx);
      ctx.font=`bold ${u(14)}px 'Orbitron',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=pc(0.45);ctx.fillText('$',cx,cy+u(1));
    });

    defineIcon('trophy', (ctx,cx,cy)=>{

    defineIcon('gift', (ctx,cx,cy)=>{

    defineIcon('diamond', (ctx,cx,cy)=>{

      let a2=Math.PI+0.5;ctx.beginPath();ctx.moveTo(cx+Math.cos(a2)*u(10),cy+Math.sin(a2)*u(10));ctx.lineTo(cx+Math.cos(a2)*u(18),cy+Math.sin(a2)*u(18));ctx.lineTo(cx+Math.cos(a2-0.4)*u(14),cy+Math.sin(a2-0.4)*u(14));ctx.fill();

      ctx.strokeStyle=pc(0.2);ctx.lineWidth=u(0.6);ctx.beginPath();ctx.moveTo(cx-u(14),cy+u(6));ctx.lineTo(cx-u(14),cy+u(14));ctx.lineTo(cx+u(14),cy+u(14));ctx.lineTo(cx+u(14),cy+u(6));ctx.stroke();

      ctx.beginPath();ctx.moveTo(cx,cy-u(12));ctx.lineTo(cx,cy+u(6));ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-u(5),cy+u(1));ctx.lineTo(cx,cy+u(7));ctx.lineTo(cx+u(5),cy+u(1));ctx.stroke();noGlow(ctx);
    });

    // ══════════════════════════════════════════════════════════════════
    // REVIEW UI
    // ══════════════════════════════════════════════════════════════════

    const approved = new Set();
    const iconNames = Object.keys(ICONS);
    let filter = 'all';

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const visible = iconNames.filter(n => {
        if (filter === 'approved') return approved.has(n);
        if (filter === 'pending') return !approved.has(n);
        return true;
      });

      for (const name of visible) {
        const card = document.createElement('div');
        card.className = 'icon-card' + (approved.has(name) ? ' approved' : '');
        card.onclick = () => { approved.has(name) ? approved.delete(name) : approved.add(name); renderGrid(); updateStats(); };

        const cv = document.createElement('canvas');
        cv.width = SZ; cv.height = SZ;
        cv.style.width = '56px'; cv.style.height = '56px';
        const ctx = cv.getContext('2d');
        ICONS[name](ctx, SZ/2, SZ/2);
        card.appendChild(cv);

        const label = document.createElement('div');
        label.className = 'name';
        label.textContent = name;
        card.appendChild(label);

        grid.appendChild(card);
      }
    }

    function updateStats() {
      document.getElementById('stats').innerHTML = `<span class="approved">${approved.size}</span> / ${iconNames.length} APPROVED — <span class="pending">${iconNames.length - approved.size}</span> PENDING`;
      document.getElementById('exportList').value = approved.size > 0 ? [...approved].join(', ') : '';
    }

    function filterIcons(f) {
      filter = f;
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      document.getElementById(f === 'all' ? 'filterAll' : f === 'approved' ? 'filterApproved' : 'filterPending').classList.add('active');
      renderGrid();
    }

    function approveAll() { iconNames.forEach(n => approved.add(n)); renderGrid(); updateStats(); }
    function clearAll() { approved.clear(); renderGrid(); updateStats(); }

    renderGrid();
    updateStats();
  </script>
