<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Library — Review & Approve</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0c0b12;color:#ccc;font-family:'Rajdhani',sans-serif;padding:20px}
    h1{font-family:'Orbitron',sans-serif;font-size:16px;text-align:center;margin-bottom:4px;color:#cc3030}
    .sub{text-align:center;font-size:11px;color:#555;margin-bottom:12px;font-family:'Share Tech Mono',monospace;letter-spacing:2px}
    .stats{text-align:center;font-size:12px;color:#777;margin-bottom:16px;font-family:'Share Tech Mono',monospace}
    .stats .approved{color:#40cc60} .stats .pending{color:#cc4040}
    .controls{display:flex;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .controls button{background:rgba(200,40,40,0.06);border:1px solid rgba(200,40,40,0.2);color:#884444;
      font-family:'Rajdhani',sans-serif;font-size:13px;padding:6px 16px;cursor:pointer;letter-spacing:1px;transition:all 0.2s}
    .controls button:hover{border-color:rgba(200,40,40,0.5);color:#cc4040}
    .controls button.active{border-color:rgba(60,200,80,0.4);color:#40cc60}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;max-width:1200px;margin:0 auto}
    .icon-card{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all 0.25s;position:relative}
    .icon-card:hover{transform:scale(1.05)}
    .icon-card.approved::after{content:'✓';position:absolute;top:2px;right:8px;color:#40cc60;font-size:16px;font-weight:bold;z-index:1}
    .icon-card canvas{border-radius:2px}
    .icon-card .name{font-family:'Share Tech Mono',monospace;font-size:7px;color:#555;letter-spacing:1px;margin-top:2px}
    .icon-card.approved .name{color:#40aa55}
    .export-area{margin-top:20px;text-align:center}
    .export-area textarea{background:#111;border:1px solid #222;color:#888;font-family:'Share Tech Mono',monospace;
      font-size:9px;width:100%;max-width:800px;height:60px;padding:8px;resize:vertical}
  </style>
</head>
<body>
  <h1>ICON LIBRARY — REVIEW & APPROVE</h1>
  <p class="sub">CLICK TO APPROVE // CLICK AGAIN TO UNAPPROVE</p>
  <div class="stats" id="stats">0 / 50 APPROVED</div>
  <div class="controls">
    <button onclick="filterIcons('all')" class="active" id="filterAll">ALL (50)</button>
    <button onclick="filterIcons('approved')" id="filterApproved">APPROVED</button>
    <button onclick="filterIcons('pending')" id="filterPending">PENDING</button>
    <button onclick="approveAll()">APPROVE ALL</button>
    <button onclick="clearAll()">CLEAR ALL</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="export-area">
    <textarea id="exportList" readonly placeholder="Approved icon names will appear here..."></textarea>
  </div>

  <script>
    const SZ=100; // bigger canvas for framed icons
    const P=[200,50,50], S=[50,50,55]; // scarlet + near-black
    const A=[180,60,60]; // accent (slightly lighter scarlet)
    const pc=a=>`rgba(${P[0]},${P[1]},${P[2]},${a})`;
    const sc=a=>`rgba(${S[0]},${S[1]},${S[2]},${a})`;
    const ac=a=>`rgba(${A[0]},${A[1]},${A[2]},${a})`;
    function u(n){return n*SZ/100}
    function G(ctx,c,b,a=0.5){ctx.shadowColor=`rgba(${c[0]},${c[1]},${c[2]},${a})`;ctx.shadowBlur=b}
    function N(ctx){ctx.shadowColor='transparent';ctx.shadowBlur=0}
    const APPROVED=new Set(['fullscreen','info','refresh','quest','search','energy','settings','error','download','plus','minus','upload','diamond','star','craft','inventory','forward','back','heart','skull','target','play','pause','stop','arrow-up','arrow-down','arrow-left','arrow-right','warning']);

    // ── PANEL FRAME — every icon gets this container ──
    function drawFrame(ctx){
      const m=3, s=SZ-m*2, cs=8; // margin, size, corner clip
      // Dark panel background
      ctx.fillStyle='rgba(12,11,20,0.95)';
      ctx.beginPath();ctx.moveTo(m+cs,m);ctx.lineTo(m+s-cs,m);ctx.lineTo(m+s,m+cs);ctx.lineTo(m+s,m+s-cs);
      ctx.lineTo(m+s-cs,m+s);ctx.lineTo(m+cs,m+s);ctx.lineTo(m,m+s-cs);ctx.lineTo(m,m+cs);ctx.closePath();ctx.fill();
      // Border
      ctx.strokeStyle=pc(0.25);ctx.lineWidth=1;ctx.stroke();
      // Corner accents (bright dots + short lines)
      ctx.fillStyle=pc(0.5);
      const corners=[[m+1,m+1],[m+s-1,m+1],[m+1,m+s-1],[m+s-1,m+s-1]];
      corners.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill()});
      // Corner bracket lines
      ctx.strokeStyle=pc(0.2);ctx.lineWidth=0.8;
      ctx.beginPath();ctx.moveTo(m+cs+2,m+1);ctx.lineTo(m+cs+8,m+1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(m+1,m+cs+2);ctx.lineTo(m+1,m+cs+8);ctx.stroke();
      ctx.beginPath();ctx.moveTo(m+s-cs-8,m+1);ctx.lineTo(m+s-cs-2,m+1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(m+s-1,m+cs+2);ctx.lineTo(m+s-1,m+cs+8);ctx.stroke();
    }

    // ── DRAWING HELPERS ──
    function bold(ctx,a=0.85,w=2){G(ctx,P,6,0.35);ctx.strokeStyle=pc(a);ctx.lineWidth=u(w);ctx.lineCap='round';ctx.lineJoin='round'}
    function fill(ctx,a=0.5){ctx.fillStyle=pc(a)}
    function thin(ctx,a=0.3,w=0.8){N(ctx);ctx.strokeStyle=pc(a);ctx.lineWidth=u(w);ctx.lineCap='round'}
    // Solid fill for silhouette shapes
    function solid(ctx,a=0.7){ctx.fillStyle=pc(a)}
    // Dark detail lines drawn ON TOP of solid fills (internal structure)
    function det(ctx,a=0.35,w=1){N(ctx);ctx.strokeStyle=`rgba(15,12,22,${a})`;ctx.lineWidth=u(w);ctx.lineCap='round';ctx.lineJoin='round'}
    // Bright highlight lines on solid fills
    function hi(ctx,a=0.95,w=0.7){N(ctx);ctx.strokeStyle=pc(a);ctx.lineWidth=u(w);ctx.lineCap='round'}

    const ICONS={};
    function I(name,fn){ICONS[name]=fn}

    // ══════════════════════════════════════════════════════════════════
    // 50 ICONS — framed, creatively interpreted, sleek
    // ══════════════════════════════════════════════════════════════════

    // ── PLAYBACK ──
    I('play',(x,cx,cy)=>{
      const g=x.createLinearGradient(cx-u(10),cy-u(14),cx+u(14),cy+u(10));
      g.addColorStop(0,pc(0.55));g.addColorStop(0.5,pc(0.2));g.addColorStop(1,pc(0.45));
      x.fillStyle=g;x.beginPath();x.moveTo(cx-u(10),cy-u(14));x.lineTo(cx+u(14),cy);x.lineTo(cx-u(10),cy+u(14));x.closePath();x.fill();
      bold(x,0.9,2);x.stroke();N(x);
      hi(x,0.65,0.6);x.beginPath();x.moveTo(cx-u(8),cy-u(11));x.lineTo(cx+u(9),cy);x.stroke();
    });

    I('pause',(x,cx,cy)=>{
      for(const xo of[-u(7),u(3)]){
        const g=x.createLinearGradient(cx+xo,cy-u(14),cx+xo+u(6),cy+u(14));
        g.addColorStop(0,pc(0.5));g.addColorStop(0.4,pc(0.18));g.addColorStop(1,pc(0.42));
        x.fillStyle=g;x.fillRect(cx+xo,cy-u(14),u(6),u(28));
        bold(x,0.85,1.8);x.strokeRect(cx+xo,cy-u(14),u(6),u(28));N(x);
        hi(x,0.55,0.5);x.beginPath();x.moveTo(cx+xo+u(1.5),cy-u(12));x.lineTo(cx+xo+u(1.5),cy+u(12));x.stroke();
      }
    });

    I('stop',(x,cx,cy)=>{
      const g=x.createLinearGradient(cx-u(13),cy-u(13),cx+u(13),cy+u(13));
      g.addColorStop(0,pc(0.5));g.addColorStop(0.4,pc(0.18));g.addColorStop(1,pc(0.42));
      x.fillStyle=g;x.fillRect(cx-u(13),cy-u(13),u(26),u(26));
      bold(x,0.85,1.8);x.strokeRect(cx-u(13),cy-u(13),u(26),u(26));N(x);
      hi(x,0.45,0.5);x.beginPath();x.moveTo(cx-u(11),cy-u(13));x.lineTo(cx-u(13),cy-u(11));x.stroke();
    });

    I('forward',(x,cx,cy)=>{
      // SOLID thick chevrons — like the reference
      solid(x,0.75);x.beginPath();
      x.moveTo(cx-u(16),cy-u(16));x.lineTo(cx-u(2),cy);x.lineTo(cx-u(16),cy+u(16));
      x.lineTo(cx-u(8),cy+u(16));x.lineTo(cx+u(6),cy);x.lineTo(cx-u(8),cy-u(16));x.closePath();x.fill();
      x.beginPath();
      x.moveTo(cx-u(4),cy-u(16));x.lineTo(cx+u(10),cy);x.lineTo(cx-u(4),cy+u(16));
      x.lineTo(cx+u(4),cy+u(16));x.lineTo(cx+u(18),cy);x.lineTo(cx+u(4),cy-u(16));x.closePath();x.fill();
      G(x,P,4,0.2);x.strokeStyle=pc(0.85);x.lineWidth=u(0.8);
      x.beginPath();x.moveTo(cx-u(16),cy-u(16));x.lineTo(cx-u(2),cy);x.lineTo(cx-u(16),cy+u(16));
      x.lineTo(cx-u(8),cy+u(16));x.lineTo(cx+u(6),cy);x.lineTo(cx-u(8),cy-u(16));x.closePath();x.stroke();
      x.beginPath();x.moveTo(cx-u(4),cy-u(16));x.lineTo(cx+u(10),cy);x.lineTo(cx-u(4),cy+u(16));
      x.lineTo(cx+u(4),cy+u(16));x.lineTo(cx+u(18),cy);x.lineTo(cx+u(4),cy-u(16));x.closePath();x.stroke();N(x);
    });

    I('back',(x,cx,cy)=>{
      solid(x,0.75);x.beginPath();
      x.moveTo(cx+u(16),cy-u(16));x.lineTo(cx+u(2),cy);x.lineTo(cx+u(16),cy+u(16));
      x.lineTo(cx+u(8),cy+u(16));x.lineTo(cx-u(6),cy);x.lineTo(cx+u(8),cy-u(16));x.closePath();x.fill();
      x.beginPath();
      x.moveTo(cx+u(4),cy-u(16));x.lineTo(cx-u(10),cy);x.lineTo(cx+u(4),cy+u(16));
      x.lineTo(cx-u(4),cy+u(16));x.lineTo(cx-u(18),cy);x.lineTo(cx-u(4),cy-u(16));x.closePath();x.fill();
      G(x,P,4,0.2);x.strokeStyle=pc(0.85);x.lineWidth=u(0.8);
      x.beginPath();x.moveTo(cx+u(16),cy-u(16));x.lineTo(cx+u(2),cy);x.lineTo(cx+u(16),cy+u(16));
      x.lineTo(cx+u(8),cy+u(16));x.lineTo(cx-u(6),cy);x.lineTo(cx+u(8),cy-u(16));x.closePath();x.stroke();
      x.beginPath();x.moveTo(cx+u(4),cy-u(16));x.lineTo(cx-u(10),cy);x.lineTo(cx+u(4),cy+u(16));
      x.lineTo(cx-u(4),cy+u(16));x.lineTo(cx-u(18),cy);x.lineTo(cx-u(4),cy-u(16));x.closePath();x.stroke();N(x);
    });

    I('restart',(x,cx,cy)=>{
      // Circular arc with solid arrow tip — gradient arc
      const ag=x.createConicGradient(0.4,cx,cy);ag.addColorStop(0,pc(0.8));ag.addColorStop(0.4,pc(0.3));ag.addColorStop(0.7,pc(0.6));
      x.strokeStyle=ag;x.lineWidth=u(3);x.lineCap='round';
      x.beginPath();x.arc(cx,cy,u(14),0.5,Math.PI*1.8);x.stroke();
      // Solid filled arrowhead
      solid(x,0.75);x.beginPath();const a=0.5;
      x.moveTo(cx+Math.cos(a)*u(8),cy+Math.sin(a)*u(8));
      x.lineTo(cx+Math.cos(a)*u(20),cy+Math.sin(a)*u(20));
      x.lineTo(cx+Math.cos(a+0.55)*u(14),cy+Math.sin(a+0.55)*u(14));x.closePath();x.fill();
    });

    // ── UI / SYSTEM ──
    I('home',(x,cx,cy)=>{
      // HOME BASE — angular structure with broadcast signal
      // Building/base silhouette
      const hg=x.createLinearGradient(cx-u(14),cy-u(8),cx+u(10),cy+u(16));
      hg.addColorStop(0,pc(0.45));hg.addColorStop(0.5,pc(0.15));hg.addColorStop(1,pc(0.35));
      x.fillStyle=hg;x.beginPath();
      x.moveTo(cx,cy-u(12));x.lineTo(cx+u(16),cy+u(4));x.lineTo(cx+u(12),cy+u(4));
      x.lineTo(cx+u(12),cy+u(16));x.lineTo(cx-u(12),cy+u(16));x.lineTo(cx-u(12),cy+u(4));
      x.lineTo(cx-u(16),cy+u(4));x.closePath();x.fill();
      bold(x,0.75,1.5);x.stroke();N(x);
      // Door
      solid(x,0.25);x.fillRect(cx-u(4),cy+u(4),u(8),u(12));
      det(x,0.3,0.6);x.strokeRect(cx-u(4),cy+u(4),u(8),u(12));
      // Antenna
      bold(x,0.6,1.5);x.beginPath();x.moveTo(cx+u(6),cy-u(6));x.lineTo(cx+u(6),cy-u(20));x.stroke();N(x);
      // Signal arcs from antenna
      bold(x,0.4,1);x.beginPath();x.arc(cx+u(6),cy-u(20),u(4),-Math.PI*0.8,-Math.PI*0.2);x.stroke();
      x.beginPath();x.arc(cx+u(6),cy-u(20),u(7),-Math.PI*0.75,-Math.PI*0.25);x.stroke();
      x.beginPath();x.arc(cx+u(6),cy-u(20),u(10),-Math.PI*0.7,-Math.PI*0.3);x.stroke();N(x);
      // Window
      fill(x,0.35);x.fillRect(cx+u(4),cy+u(5),u(5),u(4));bold(x,0.35,0.6);x.strokeRect(cx+u(4),cy+u(5),u(5),u(4));N(x);
    });

    I('settings',(x,cx,cy)=>{
      // APPROVED — interconnected nodes (atomic/network style)
      // Central node
      G(x,P,5,0.4);fill(x,0.7);x.beginPath();x.arc(cx,cy,u(4),0,Math.PI*2);x.fill();N(x);
      // Orbital nodes
      const nodes=[[u(14),-Math.PI*0.3],[u(14),Math.PI*0.5],[u(14),Math.PI*1.2]];
      nodes.forEach(([r,a])=>{
        const nx=cx+Math.cos(a)*r,ny=cy+Math.sin(a)*r;
        // Connection line
        bold(x,0.5,1.5);x.beginPath();x.moveTo(cx,cy);x.lineTo(nx,ny);x.stroke();N(x);
        // Node
        fill(x,0.55);x.beginPath();x.arc(nx,ny,u(3),0,Math.PI*2);x.fill();
      });
      // Orbit ring
      thin(x,0.2,0.8);x.beginPath();x.arc(cx,cy,u(14),0,Math.PI*2);x.stroke();
    });

    I('menu-hamburger',(x,cx,cy)=>{
      // Three bars with staggered lengths and gradient fills
      const widths=[u(26),u(20),u(14)];
      [-u(9),0,u(9)].forEach((yo,i)=>{
        const w=widths[i],h=u(4);const bx=cx-w/2;
        const g=x.createLinearGradient(bx,cy+yo,bx+w,cy+yo);
        g.addColorStop(0,pc(0.55));g.addColorStop(0.5,pc(0.2));g.addColorStop(1,pc(0.45));
        x.fillStyle=g;x.fillRect(bx,cy+yo-h/2,w,h);
        bold(x,0.7,1);x.strokeRect(bx,cy+yo-h/2,w,h);N(x);
      });
    });

    I('close',(x,cx,cy)=>{
      // X with gradient bars
      solid(x,0.55);x.save();x.translate(cx,cy);x.rotate(Math.PI/4);
      x.fillRect(-u(2),-u(15),u(4),u(30));x.fillRect(-u(15),-u(2),u(30),u(4));x.restore();
      bold(x,0.8,1.2);x.save();x.translate(cx,cy);x.rotate(Math.PI/4);
      x.strokeRect(-u(2),-u(15),u(4),u(30));x.strokeRect(-u(15),-u(2),u(30),u(4));x.restore();N(x);
    });

    I('check',(x,cx,cy)=>{
      // Bold check with gradient fill
      solid(x,0.6);x.beginPath();
      x.moveTo(cx-u(16),cy-u(2));x.lineTo(cx-u(12),cy-u(6));x.lineTo(cx-u(4),cy+u(6));
      x.lineTo(cx+u(16),cy-u(14));x.lineTo(cx+u(16),cy-u(8));x.lineTo(cx-u(4),cy+u(14));
      x.lineTo(cx-u(16),cy+u(2));x.closePath();x.fill();
      bold(x,0.8,1.2);x.stroke();N(x);
    });

    I('info',(x,cx,cy)=>{
      // APPROVED
      bold(x,0.45,1.5);x.beginPath();x.arc(cx,cy,u(18),0,Math.PI*2);x.stroke();N(x);
      fill(x,0.7);x.beginPath();x.arc(cx,cy-u(7),u(2.5),0,Math.PI*2);x.fill();
      bold(x,0.7,2.5);x.beginPath();x.moveTo(cx,cy-u(1));x.lineTo(cx,cy+u(10));x.stroke();
      x.beginPath();x.moveTo(cx-u(4),cy+u(10));x.lineTo(cx+u(4),cy+u(10));x.stroke();N(x);
    });

    I('warning',(x,cx,cy)=>{
      fill(x,0.15);x.beginPath();x.moveTo(cx,cy-u(18));x.lineTo(cx+u(18),cy+u(14));x.lineTo(cx-u(18),cy+u(14));x.closePath();x.fill();
      bold(x,0.85,2.2);x.stroke();N(x);
      fill(x,0.8);x.beginPath();x.arc(cx,cy+u(7),u(2.5),0,Math.PI*2);x.fill();
      bold(x,0.8,2.5);x.beginPath();x.moveTo(cx,cy-u(6));x.lineTo(cx,cy+u(2));x.stroke();N(x);
    });

    I('error',(x,cx,cy)=>{
      // APPROVED
      fill(x,0.12);x.beginPath();x.arc(cx,cy,u(18),0,Math.PI*2);x.fill();bold(x,0.55,1.5);x.stroke();
      bold(x,0.85,2.5);x.beginPath();x.moveTo(cx-u(9),cy-u(9));x.lineTo(cx+u(9),cy+u(9));
      x.moveTo(cx+u(9),cy-u(9));x.lineTo(cx-u(9),cy+u(9));x.stroke();N(x);
    });

    I('search',(x,cx,cy)=>{
      // APPROVED
      bold(x,0.7,2);x.beginPath();x.arc(cx-u(3),cy-u(3),u(12),0,Math.PI*2);x.stroke();N(x);
      bold(x,0.85,3);x.beginPath();x.moveTo(cx+u(6),cy+u(6));x.lineTo(cx+u(16),cy+u(16));x.stroke();N(x);
    });

    I('expand',(x,cx,cy)=>{
      // Filled corner arrows pointing outward
      const s=u(14),g=u(5);
      [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([dx,dy])=>{
        solid(x,0.4);x.beginPath();x.moveTo(cx+dx*g,cy+dy*s);x.lineTo(cx+dx*s,cy+dy*s);x.lineTo(cx+dx*s,cy+dy*g);
        x.lineTo(cx+dx*(s-u(3)),cy+dy*(g+u(2)));x.lineTo(cx+dx*(s-u(3)),cy+dy*(s-u(3)));x.lineTo(cx+dx*(g+u(2)),cy+dy*(s-u(3)));x.closePath();x.fill();
        bold(x,0.75,1.2);x.stroke();N(x);
      });
    });

    I('minimize',(x,cx,cy)=>{
      // Filled bar with beveled ends
      const mg=x.createLinearGradient(cx-u(16),cy,cx+u(16),cy);
      mg.addColorStop(0,pc(0.5));mg.addColorStop(0.5,pc(0.2));mg.addColorStop(1,pc(0.45));
      x.fillStyle=mg;x.fillRect(cx-u(16),cy-u(2.5),u(32),u(5));
      bold(x,0.8,1.2);x.strokeRect(cx-u(16),cy-u(2.5),u(32),u(5));N(x);
    });

    I('fullscreen',(x,cx,cy)=>{
      // APPROVED
      bold(x,0.8,2.5);const s=u(14),g=u(5);
      [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([dx,dy])=>{
        x.beginPath();x.moveTo(cx+dx*g,cy+dy*s);x.lineTo(cx+dx*s,cy+dy*s);x.lineTo(cx+dx*s,cy+dy*g);x.stroke()});N(x);
    });

    // ── GAME ITEMS (creatively interpreted) ──
    I('sword',(x,cx,cy)=>{
      // ATTACK VECTOR — angular blade pointing upward, geometric and sharp
      // Blade — elongated angular diamond
      solid(x,0.5);x.beginPath();
      x.moveTo(cx,cy-u(24));
      x.lineTo(cx+u(6),cy-u(4));
      x.lineTo(cx+u(3),cy+u(2));
      x.lineTo(cx-u(3),cy+u(2));
      x.lineTo(cx-u(6),cy-u(4));
      x.closePath();x.fill();
      bold(x,0.85,1.5);x.stroke();N(x);
      // Center line
      det(x,0.35,0.8);x.beginPath();x.moveTo(cx,cy-u(22));x.lineTo(cx,cy+u(1));x.stroke();
      // Guard — angular horizontal bar
      solid(x,0.4);x.beginPath();
      x.moveTo(cx-u(14),cy+u(1));x.lineTo(cx-u(10),cy-u(2));x.lineTo(cx+u(10),cy-u(2));
      x.lineTo(cx+u(14),cy+u(1));x.lineTo(cx+u(10),cy+u(4));x.lineTo(cx-u(10),cy+u(4));x.closePath();x.fill();
      bold(x,0.65,1);x.stroke();N(x);
      // Grip

      // Sweep line

      // Blips
      G(x,P,5,0.5);fill(x,0.7);x.beginPath();x.arc(cx+u(10),cy-u(5),u(2.5),0,Math.PI*2);x.fill();
      fill(x,0.4);x.beginPath();x.arc(cx-u(7),cy+u(9),u(2),0,Math.PI*2);x.fill();N(x);
    });

    I('energy',(x,cx,cy)=>{
      // APPROVED
      thin(x,0.2,1.5);x.beginPath();x.arc(cx,cy,u(18),0,Math.PI*2);x.stroke();
      bold(x,0.85,3);x.beginPath();x.arc(cx,cy,u(18),-Math.PI/2,-Math.PI/2+Math.PI*1.4);x.stroke();N(x);
      const ea=-Math.PI/2+Math.PI*1.4;G(x,P,6,0.6);fill(x,0.8);x.beginPath();x.arc(cx+Math.cos(ea)*u(18),cy+Math.sin(ea)*u(18),u(3),0,Math.PI*2);x.fill();N(x);
      fill(x,0.3);x.beginPath();x.moveTo(cx+u(2),cy-u(6));x.lineTo(cx-u(2),cy+u(1));x.lineTo(cx+u(1),cy+u(1));
      x.lineTo(cx-u(2),cy+u(6));x.lineTo(cx+u(2),cy-u(1));x.lineTo(cx-u(1),cy-u(1));x.closePath();x.fill();
      bold(x,0.5,0.8);x.stroke();N(x);
    });

    // ── GAME SYSTEMS ──
    I('inventory',(x,cx,cy)=>{
      // CARGO MANIFEST — data grid with status indicators
      // Outer frame
      bold(x,0.6,1.8);x.strokeRect(cx-u(18),cy-u(18),u(36),u(36));N(x);
      // 3x3 grid cells
      const cs=u(12);for(let r=0;r<3;r++)for(let c=0;c<3;c++){
        const gx=cx-u(18)+c*cs,gy=cy-u(18)+r*cs;
        thin(x,0.25,0.8);x.strokeRect(gx,gy,cs,cs);
        // Status dots in each cell (filled/empty/active)
        const status=[[0.6,3],[0.3,2],[0.5,2.5],[0.25,2],[0.7,3],[0,0],[0.4,2.5],[0,0],[0.35,2]];
        const[sa,sr]=status[r*3+c];
        if(sa>0){fill(x,sa);x.beginPath();x.arc(gx+cs/2,gy+cs/2,u(sr),0,Math.PI*2);x.fill()}
      }
      // Active cell highlight
      G(x,P,4,0.3);x.strokeStyle=pc(0.7);x.lineWidth=u(1.2);x.strokeRect(cx-u(18),cy-u(18),cs,cs);N(x);
    });

    I('craft',(x,cx,cy)=>{
      // ENGINEERING — hexagonal schematic with center assembly point
      thin(x,0.25,0.8);x.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/2,r=u(20);
        i===0?x.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.closePath();x.stroke();
      // Connecting lines from center to vertices
      for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/2;
        thin(x,0.15,0.5);x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*u(18),cy+Math.sin(a)*u(18));x.stroke()}
      // Center assembly ring
      bold(x,0.65,1.5);x.beginPath();x.arc(cx,cy,u(8),0,Math.PI*2);x.stroke();N(x);
      // Center dot (focus point)
      G(x,P,5,0.4);fill(x,0.7);x.beginPath();x.arc(cx,cy,u(3),0,Math.PI*2);x.fill();N(x);
      // Component dots at alternating vertices
      fill(x,0.5);for(let i=0;i<6;i+=2){const a=(i/6)*Math.PI*2-Math.PI/2;
        x.beginPath();x.arc(cx+Math.cos(a)*u(18),cy+Math.sin(a)*u(18),u(2),0,Math.PI*2);x.fill()}
    });

    I('quest',(x,cx,cy)=>{
      // APPROVED
      bold(x,0.45,1.5);x.beginPath();x.arc(cx,cy,u(18),0,Math.PI*2);x.stroke();N(x);
      fill(x,0.75);x.font=`bold ${u(26)}px 'Orbitron',sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('!',cx,cy+u(1));
    });

    I('shop',(x,cx,cy)=>{
      // TRANSACTION TERMINAL — screen/monitor with data
      solid(x,0.15);x.fillRect(cx-u(16),cy-u(14),u(32),u(24));
      bold(x,0.65,1.8);x.strokeRect(cx-u(16),cy-u(14),u(32),u(24));N(x);
      // Screen content lines
      bold(x,0.45,1.2);x.beginPath();x.moveTo(cx-u(12),cy-u(8));x.lineTo(cx+u(6),cy-u(8));x.stroke();
      x.beginPath();x.moveTo(cx-u(12),cy-u(3));x.lineTo(cx+u(12),cy-u(3));x.stroke();
      x.beginPath();x.moveTo(cx-u(12),cy+u(2));x.lineTo(cx+u(8),cy+u(2));x.stroke();N(x);
      // Transaction indicator dot
      G(x,P,4,0.4);fill(x,0.7);x.beginPath();x.arc(cx+u(11),cy-u(8),u(2),0,Math.PI*2);x.fill();N(x);
      // Stand
      bold(x,0.4,1.5);x.beginPath();x.moveTo(cx,cy+u(10));x.lineTo(cx,cy+u(16));x.stroke();
      x.beginPath();x.moveTo(cx-u(8),cy+u(16));x.lineTo(cx+u(8),cy+u(16));x.stroke();N(x);
    });

    I('gift',(x,cx,cy)=>{
      // SUPPLY DROP — crate with parachute lines
      solid(x,0.25);x.fillRect(cx-u(12),cy-u(4),u(24),u(20));
      bold(x,0.7,1.8);x.strokeRect(cx-u(12),cy-u(4),u(24),u(20));N(x);
      // Crate cross strapping
      det(x,0.3,0.8);x.beginPath();x.moveTo(cx,cy-u(4));x.lineTo(cx,cy+u(16));x.stroke();
      x.beginPath();x.moveTo(cx-u(12),cy+u(6));x.lineTo(cx+u(12),cy+u(6));x.stroke();
      // Parachute lines
      bold(x,0.45,1);x.beginPath();x.moveTo(cx-u(12),cy-u(4));x.lineTo(cx,cy-u(18));x.lineTo(cx+u(12),cy-u(4));x.stroke();N(x);
      // Chute arc
      bold(x,0.35,1.2);x.beginPath();x.arc(cx,cy-u(20),u(10),Math.PI*0.15,Math.PI*0.85);x.stroke();N(x);
    });

    I('flag',(x,cx,cy)=>{
      // WAYPOINT — vertical marker with beacon pulse
      bold(x,0.65,2);x.beginPath();x.moveTo(cx,cy-u(6));x.lineTo(cx,cy+u(18));x.stroke();N(x);
      // Waypoint diamond at top
      solid(x,0.5);x.beginPath();x.moveTo(cx,cy-u(18));x.lineTo(cx+u(8),cy-u(8));x.lineTo(cx,cy+u(2));x.lineTo(cx-u(8),cy-u(8));x.closePath();x.fill();
      bold(x,0.8,1.5);x.stroke();N(x);
      // Center dot
      G(x,P,4,0.4);fill(x,0.75);x.beginPath();x.arc(cx,cy-u(8),u(2.5),0,Math.PI*2);x.fill();N(x);
      // Base marker
      bold(x,0.4,1.5);x.beginPath();x.moveTo(cx-u(6),cy+u(18));x.lineTo(cx+u(6),cy+u(18));x.stroke();N(x);
    });

    I('crown',(x,cx,cy)=>{
      // COMMAND RANK — stacked chevrons (military insignia)
      bold(x,0.85,2.5);x.beginPath();x.moveTo(cx-u(16),cy+u(4));x.lineTo(cx,cy-u(8));x.lineTo(cx+u(16),cy+u(4));x.stroke();N(x);
      bold(x,0.65,2);x.beginPath();x.moveTo(cx-u(14),cy+u(12));x.lineTo(cx,cy);x.lineTo(cx+u(14),cy+u(12));x.stroke();N(x);
      bold(x,0.45,1.5);x.beginPath();x.moveTo(cx-u(12),cy+u(18));x.lineTo(cx,cy+u(8));x.lineTo(cx+u(12),cy+u(18));x.stroke();N(x);
      // Accent dot at apex
      G(x,P,5,0.4);fill(x,0.7);x.beginPath();x.arc(cx,cy-u(8),u(2.5),0,Math.PI*2);x.fill();N(x);
    });

    I('diamond',(x,cx,cy)=>{
      // PRIORITY MARKER — diamond with concentric rings
      solid(x,0.25);x.beginPath();x.moveTo(cx,cy-u(20));x.lineTo(cx+u(16),cy);x.lineTo(cx,cy+u(20));x.lineTo(cx-u(16),cy);x.closePath();x.fill();
      bold(x,0.8,2);x.stroke();N(x);
      // Inner diamond
      thin(x,0.4,1);x.beginPath();x.moveTo(cx,cy-u(12));x.lineTo(cx+u(10),cy);x.lineTo(cx,cy+u(12));x.lineTo(cx-u(10),cy);x.closePath();x.stroke();
      // Center dot
      G(x,P,5,0.4);fill(x,0.7);x.beginPath();x.arc(cx,cy,u(3),0,Math.PI*2);x.fill();N(x);
    });

    // ── ARROWS ──
    I('arrow-up',(x,cx,cy)=>{
      // Single solid filled chevron
      solid(x,0.65);x.beginPath();x.moveTo(cx-u(16),cy+u(8));x.lineTo(cx,cy-u(8));x.lineTo(cx+u(16),cy+u(8));
      x.lineTo(cx+u(8),cy+u(8));x.lineTo(cx,cy-u(1));x.lineTo(cx-u(8),cy+u(8));x.closePath();x.fill();
      bold(x,0.8,1.5);x.stroke();N(x);
    });
    I('arrow-down',(x,cx,cy)=>{
      solid(x,0.65);x.beginPath();x.moveTo(cx-u(16),cy-u(8));x.lineTo(cx,cy+u(8));x.lineTo(cx+u(16),cy-u(8));
      x.lineTo(cx+u(8),cy-u(8));x.lineTo(cx,cy+u(1));x.lineTo(cx-u(8),cy-u(8));x.closePath();x.fill();
      bold(x,0.8,1.5);x.stroke();N(x);
    });
    I('arrow-left',(x,cx,cy)=>{
      solid(x,0.65);x.beginPath();x.moveTo(cx+u(8),cy-u(16));x.lineTo(cx-u(8),cy);x.lineTo(cx+u(8),cy+u(16));
      x.lineTo(cx+u(8),cy+u(8));x.lineTo(cx-u(1),cy);x.lineTo(cx+u(8),cy-u(8));x.closePath();x.fill();
      bold(x,0.8,1.5);x.stroke();N(x);
    });
    I('arrow-right',(x,cx,cy)=>{
      solid(x,0.65);x.beginPath();x.moveTo(cx-u(8),cy-u(16));x.lineTo(cx+u(8),cy);x.lineTo(cx-u(8),cy+u(16));
      x.lineTo(cx-u(8),cy+u(8));x.lineTo(cx+u(1),cy);x.lineTo(cx-u(8),cy-u(8));x.closePath();x.fill();
      bold(x,0.8,1.5);x.stroke();N(x);
    });

    // ── ACTIONS ──
    I('plus',(x,cx,cy)=>{
      // APPROVED
      bold(x,0.85,3);x.beginPath();x.moveTo(cx,cy-u(14));x.lineTo(cx,cy+u(14));x.moveTo(cx-u(14),cy);x.lineTo(cx+u(14),cy);x.stroke();N(x);
      thin(x,0.25,1);x.beginPath();x.arc(cx,cy,u(20),0,Math.PI*2);x.stroke();
    });

    I('minus',(x,cx,cy)=>{
      // APPROVED
      bold(x,0.85,3);x.beginPath();x.moveTo(cx-u(14),cy);x.lineTo(cx+u(14),cy);x.stroke();N(x);
      thin(x,0.25,1);x.beginPath();x.arc(cx,cy,u(20),0,Math.PI*2);x.stroke();
    });

    I('refresh',(x,cx,cy)=>{
      // APPROVED
      bold(x,0.75,2.5);x.beginPath();x.arc(cx,cy,u(14),0.4,Math.PI*1.7);x.stroke();
      x.beginPath();x.arc(cx,cy,u(14),Math.PI+0.4,Math.PI*2.7);x.stroke();N(x);
      fill(x,0.65);let a1=0.4;x.beginPath();x.moveTo(cx+Math.cos(a1)*u(9),cy+Math.sin(a1)*u(9));
      x.lineTo(cx+Math.cos(a1)*u(19),cy+Math.sin(a1)*u(19));x.lineTo(cx+Math.cos(a1+0.5)*u(14),cy+Math.sin(a1+0.5)*u(14));x.closePath();x.fill();
      let a2=Math.PI+0.4;x.beginPath();x.moveTo(cx+Math.cos(a2)*u(9),cy+Math.sin(a2)*u(9));
      x.lineTo(cx+Math.cos(a2)*u(19),cy+Math.sin(a2)*u(19));x.lineTo(cx+Math.cos(a2+0.5)*u(14),cy+Math.sin(a2+0.5)*u(14));x.closePath();x.fill();
    });

    I('eye',(x,cx,cy)=>{
      fill(x,0.12);x.beginPath();x.moveTo(cx-u(22),cy);x.bezierCurveTo(cx-u(12),cy-u(14),cx+u(12),cy-u(14),cx+u(22),cy);
      x.bezierCurveTo(cx+u(12),cy+u(14),cx-u(12),cy+u(14),cx-u(22),cy);x.closePath();x.fill();
      bold(x,0.6,1.5);x.stroke();N(x);
      fill(x,0.35);x.beginPath();x.arc(cx,cy,u(6),0,Math.PI*2);x.fill();bold(x,0.5,1);x.stroke();N(x);
      G(x,P,4,0.4);fill(x,0.6);x.beginPath();x.arc(cx,cy,u(2.5),0,Math.PI*2);x.fill();N(x);
    });

    I('download',(x,cx,cy)=>{
      // APPROVED
      bold(x,0.45,1.5);x.beginPath();x.moveTo(cx-u(16),cy+u(8));x.lineTo(cx-u(16),cy+u(16));x.lineTo(cx+u(16),cy+u(16));x.lineTo(cx+u(16),cy+u(8));x.stroke();N(x);
      bold(x,0.85,2.5);x.beginPath();x.moveTo(cx,cy-u(14));x.lineTo(cx,cy+u(6));x.stroke();
      x.beginPath();x.moveTo(cx-u(7),cy+u(1));x.lineTo(cx,cy+u(8));x.lineTo(cx+u(7),cy+u(1));x.stroke();N(x);
    });

    // ══════════════════════════════════════════════════════════════════
    // REVIEW UI
    // ══════════════════════════════════════════════════════════════════

    const approved=new Set(APPROVED);
    const iconNames=Object.keys(ICONS);
    let filter='all';

    function renderGrid(){
      const grid=document.getElementById('grid');grid.innerHTML='';
      const visible=iconNames.filter(n=>{
        if(filter==='approved')return approved.has(n);if(filter==='pending')return!approved.has(n);return true});
      for(const name of visible){
        const card=document.createElement('div');card.className='icon-card'+(approved.has(name)?' approved':'');
        card.onclick=()=>{approved.has(name)?approved.delete(name):approved.add(name);renderGrid();updateStats()};
        const cv=document.createElement('canvas');cv.width=SZ;cv.height=SZ;cv.style.width='100px';cv.style.height='100px';
        const ctx=cv.getContext('2d');
        drawFrame(ctx);
        ICONS[name](ctx,SZ/2,SZ/2);
        card.appendChild(cv);
        const label=document.createElement('div');label.className='name';label.textContent=name;card.appendChild(label);
        grid.appendChild(card);
      }
    }

    function updateStats(){
      document.getElementById('stats').innerHTML=`<span class="approved">${approved.size}</span> / ${iconNames.length} APPROVED — <span class="pending">${iconNames.length-approved.size}</span> PENDING`;
      document.getElementById('exportList').value=approved.size>0?[...approved].join(', '):'';
    }

    function filterIcons(f){filter=f;document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
      document.getElementById(f==='all'?'filterAll':f==='approved'?'filterApproved':'filterPending').classList.add('active');renderGrid()}
    function approveAll(){iconNames.forEach(n=>approved.add(n));renderGrid();updateStats()}
    function clearAll(){approved.clear();renderGrid();updateStats()}

    renderGrid();updateStats();
  </script>
</body>
</html>
