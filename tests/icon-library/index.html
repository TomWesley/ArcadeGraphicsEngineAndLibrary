<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Library — Review & Approve</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#f0ede8;color:#333;font-family:'Rajdhani',sans-serif;padding:20px}
    h1{font-family:'Orbitron',sans-serif;font-size:16px;text-align:center;margin-bottom:4px;color:#cc2222}
    .sub{text-align:center;font-size:11px;color:#888;margin-bottom:12px;font-family:'Share Tech Mono',monospace;letter-spacing:2px}
    .stats{text-align:center;font-size:12px;color:#555;margin-bottom:16px;font-family:'Share Tech Mono',monospace}
    .stats .approved{color:#22aa44} .stats .pending{color:#cc2222}
    .controls{display:flex;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .controls button{background:rgba(200,30,30,0.04);border:1px solid rgba(200,30,30,0.15);color:#994444;
      font-family:'Rajdhani',sans-serif;font-size:13px;padding:6px 16px;cursor:pointer;letter-spacing:1px;transition:all 0.2s}
    .controls button:hover{border-color:rgba(200,30,30,0.4);color:#cc2222;background:rgba(200,30,30,0.08)}
    .controls button.active{border-color:rgba(30,160,60,0.4);color:#22aa44}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-width:1200px;margin:0 auto}
    .icon-card{display:flex;flex-direction:column;align-items:center;padding:10px 6px 8px;
      border:1px solid rgba(0,0,0,0.08);background:rgba(255,255,255,0.5);
      cursor:pointer;transition:all 0.25s;position:relative;border-radius:4px}
    .icon-card:hover{border-color:rgba(200,30,30,0.3);background:rgba(255,255,255,0.8)}
    .icon-card.approved{border-color:rgba(30,160,60,0.35);background:rgba(230,255,235,0.5)}
    .icon-card.approved::after{content:'✓';position:absolute;top:4px;right:6px;color:#22aa44;font-size:14px;font-weight:bold}
    .icon-card canvas{margin-bottom:6px;background:#ffffff;border-radius:4px;border:1px solid rgba(0,0,0,0.06)}
    .icon-card .name{font-family:'Share Tech Mono',monospace;font-size:8px;color:#666;letter-spacing:1px;text-align:center}
    .icon-card.approved .name{color:#22884a}
    .export-area{margin-top:20px;text-align:center}
    .export-area textarea{background:#fff;border:1px solid #ddd;color:#555;font-family:'Share Tech Mono',monospace;
      font-size:9px;width:100%;max-width:800px;height:60px;padding:8px;resize:vertical}
  </style>
</head>
<body>
  <h1>ICON LIBRARY — REVIEW & APPROVE</h1>
  <p class="sub">CLICK TO APPROVE // CLICK AGAIN TO UNAPPROVE</p>
  <div class="stats" id="stats">0 / 50 APPROVED</div>
  <div class="controls">
    <button onclick="filterIcons('all')" class="active" id="filterAll">ALL (50)</button>
    <button onclick="filterIcons('approved')" id="filterApproved">APPROVED</button>
    <button onclick="filterIcons('pending')" id="filterPending">PENDING</button>
    <button onclick="approveAll()">APPROVE ALL</button>
    <button onclick="clearAll()">CLEAR ALL</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="export-area">
    <textarea id="exportList" readonly placeholder="Approved icon names will appear here..."></textarea>
  </div>

  <script>
    // ── DESIGN RULES ──
    // Every icon = bold, clean, instant readability
    // 2-3 elements max. Thick strokes (2-3u). High opacity fills (0.3-0.8).
    // Glow on primary shape. Simple geometry. INSTRUMENT, not sketch.

    const P=[200,25,25], S=[30,30,35];
    const pc=a=>`rgba(${P[0]},${P[1]},${P[2]},${a})`;
    const sc=a=>`rgba(${S[0]},${S[1]},${S[2]},${a})`;
    function G(ctx,c,b,a=0.5){ctx.shadowColor=`rgba(${c[0]},${c[1]},${c[2]},${a})`;ctx.shadowBlur=b}
    function N(ctx){ctx.shadowColor='transparent';ctx.shadowBlur=0}
    const APPROVED = new Set(['fullscreen','info','refresh','quest','search','energy','settings','error','download','plus','minus','upload']);

    const ICONS = {};
    const SZ = 80;
    function u(n){return n*SZ/80}
    function I(name, fn) { ICONS[name] = fn; }

    // Bold stroke + glow helper
    function bold(ctx,a=0.85,w=2.2){G(ctx,P,8,0.4);ctx.strokeStyle=pc(a);ctx.lineWidth=u(w);ctx.lineCap='round';ctx.lineJoin='round'}
    function boldS(ctx,a=0.7,w=2){G(ctx,S,6,0.3);ctx.strokeStyle=sc(a);ctx.lineWidth=u(w);ctx.lineCap='round';ctx.lineJoin='round'}
    function fill(ctx,a=0.5){ctx.fillStyle=pc(a)}
    function fillS(ctx,a=0.4){ctx.fillStyle=sc(a)}
    // Thin accent line
    function thin(ctx,a=0.35,w=0.8){ctx.strokeStyle=pc(a);ctx.lineWidth=u(w);ctx.lineCap='round'}

    // ══════════════════════════════════════════════════════════════════
    // ICONS — Bold, clean, instrument-style
    // ══════════════════════════════════════════════════════════════════

    I('play', (ctx,cx,cy)=>{
      // Solid filled triangle — bold and punchy
      fill(ctx,0.25);ctx.beginPath();ctx.moveTo(cx-u(10),cy-u(14));ctx.lineTo(cx+u(14),cy);ctx.lineTo(cx-u(10),cy+u(14));ctx.closePath();ctx.fill();
      bold(ctx,0.9,2.5);ctx.stroke();N(ctx);
    });

    I('pause', (ctx,cx,cy)=>{
      for(const x of[-u(7),u(3)]){fill(ctx,0.2);ctx.fillRect(cx+x,cy-u(14),u(6),u(28));bold(ctx,0.85,2);ctx.strokeRect(cx+x,cy-u(14),u(6),u(28));N(ctx)}
    });

    I('stop', (ctx,cx,cy)=>{
      fill(ctx,0.2);ctx.fillRect(cx-u(13),cy-u(13),u(26),u(26));bold(ctx,0.85,2);ctx.strokeRect(cx-u(13),cy-u(13),u(26),u(26));N(ctx);
      thin(ctx,0.2);ctx.beginPath();ctx.moveTo(cx-u(8),cy);ctx.lineTo(cx+u(8),cy);ctx.moveTo(cx,cy-u(8));ctx.lineTo(cx,cy+u(8));ctx.stroke();
    });

    I('forward', (ctx,cx,cy)=>{
      bold(ctx,0.85,2.5);ctx.beginPath();ctx.moveTo(cx-u(12),cy-u(12));ctx.lineTo(cx+u(2),cy);ctx.lineTo(cx-u(12),cy+u(12));ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-u(2),cy-u(12));ctx.lineTo(cx+u(12),cy);ctx.lineTo(cx-u(2),cy+u(12));ctx.stroke();N(ctx);
    });

    I('back', (ctx,cx,cy)=>{
      bold(ctx,0.85,2.5);ctx.beginPath();ctx.moveTo(cx+u(12),cy-u(12));ctx.lineTo(cx-u(2),cy);ctx.lineTo(cx+u(12),cy+u(12));ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+u(2),cy-u(12));ctx.lineTo(cx-u(12),cy);ctx.lineTo(cx+u(2),cy+u(12));ctx.stroke();N(ctx);
    });

    I('restart', (ctx,cx,cy)=>{
      bold(ctx,0.8,2.5);ctx.beginPath();ctx.arc(cx,cy,u(16),0.4,Math.PI*1.8);ctx.stroke();N(ctx);
      fill(ctx,0.7);ctx.beginPath();const a=0.4;ctx.moveTo(cx+Math.cos(a)*u(10),cy+Math.sin(a)*u(10));
      ctx.lineTo(cx+Math.cos(a)*u(22),cy+Math.sin(a)*u(22));ctx.lineTo(cx+Math.cos(a+0.5)*u(16),cy+Math.sin(a+0.5)*u(16));ctx.closePath();ctx.fill();
    });

    I('home', (ctx,cx,cy)=>{
      fill(ctx,0.15);ctx.beginPath();ctx.moveTo(cx,cy-u(18));ctx.lineTo(cx+u(18),cy+u(2));ctx.lineTo(cx+u(14),cy+u(2));
      ctx.lineTo(cx+u(14),cy+u(16));ctx.lineTo(cx-u(14),cy+u(16));ctx.lineTo(cx-u(14),cy+u(2));ctx.lineTo(cx-u(18),cy+u(2));ctx.closePath();ctx.fill();
      bold(ctx,0.8,2);ctx.stroke();N(ctx);
      fill(ctx,0.35);ctx.fillRect(cx-u(4),cy+u(2),u(8),u(14));bold(ctx,0.6,1.2);ctx.strokeRect(cx-u(4),cy+u(2),u(8),u(14));N(ctx);
    });

    I('settings', (ctx,cx,cy)=>{
      const t=8,or=u(22),ir=u(16),tw=Math.PI/t*0.45;ctx.beginPath();
      for(let i=0;i<t;i++){const a=(i/t)*Math.PI*2-Math.PI/2;ctx.lineTo(cx+Math.cos(a-tw)*ir,cy+Math.sin(a-tw)*ir);
        ctx.lineTo(cx+Math.cos(a-tw*0.7)*or,cy+Math.sin(a-tw*0.7)*or);ctx.lineTo(cx+Math.cos(a+tw*0.7)*or,cy+Math.sin(a+tw*0.7)*or);
        ctx.lineTo(cx+Math.cos(a+tw)*ir,cy+Math.sin(a+tw)*ir)}ctx.closePath();
      fill(ctx,0.12);ctx.fill();bold(ctx,0.75,1.8);ctx.stroke();N(ctx);
      bold(ctx,0.6,1.5);ctx.beginPath();ctx.arc(cx,cy,u(6),0,Math.PI*2);ctx.stroke();N(ctx);
      fill(ctx,0.4);ctx.beginPath();ctx.arc(cx,cy,u(2.5),0,Math.PI*2);ctx.fill();
    });

    I('menu-hamburger', (ctx,cx,cy)=>{
      bold(ctx,0.8,2.5);for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(cx-u(16),cy+i*u(9));ctx.lineTo(cx+u(16),cy+i*u(9));ctx.stroke()}N(ctx);
    });

    I('close', (ctx,cx,cy)=>{
      bold(ctx,0.85,3);ctx.beginPath();ctx.moveTo(cx-u(12),cy-u(12));ctx.lineTo(cx+u(12),cy+u(12));
      ctx.moveTo(cx+u(12),cy-u(12));ctx.lineTo(cx-u(12),cy+u(12));ctx.stroke();N(ctx);
    });

    I('check', (ctx,cx,cy)=>{
      bold(ctx,0.85,3);ctx.beginPath();ctx.moveTo(cx-u(12),cy);ctx.lineTo(cx-u(3),cy+u(10));ctx.lineTo(cx+u(14),cy-u(10));ctx.stroke();N(ctx);
    });

    I('info', (ctx,cx,cy)=>{
      // APPROVED — keep as-is
      bold(ctx,0.5,1.5);ctx.beginPath();ctx.arc(cx,cy,u(22),0,Math.PI*2);ctx.stroke();N(ctx);
      fill(ctx,0.7);ctx.beginPath();ctx.arc(cx,cy-u(8),u(3),0,Math.PI*2);ctx.fill();
      bold(ctx,0.7,2.5);ctx.beginPath();ctx.moveTo(cx,cy-u(2));ctx.lineTo(cx,cy+u(10));ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-u(5),cy+u(10));ctx.lineTo(cx+u(5),cy+u(10));ctx.stroke();N(ctx);
    });

    I('warning', (ctx,cx,cy)=>{
      fill(ctx,0.12);ctx.beginPath();ctx.moveTo(cx,cy-u(18));ctx.lineTo(cx+u(20),cy+u(14));ctx.lineTo(cx-u(20),cy+u(14));ctx.closePath();ctx.fill();
      bold(ctx,0.8,2);ctx.stroke();N(ctx);
      fill(ctx,0.8);ctx.beginPath();ctx.arc(cx,cy+u(7),u(2.5),0,Math.PI*2);ctx.fill();
      bold(ctx,0.8,2.5);ctx.beginPath();ctx.moveTo(cx,cy-u(7));ctx.lineTo(cx,cy+u(1));ctx.stroke();N(ctx);
    });

    I('error', (ctx,cx,cy)=>{
      fill(ctx,0.1);ctx.beginPath();ctx.arc(cx,cy,u(22),0,Math.PI*2);ctx.fill();
      bold(ctx,0.6,1.5);ctx.stroke();
      bold(ctx,0.85,2.5);ctx.beginPath();ctx.moveTo(cx-u(9),cy-u(9));ctx.lineTo(cx+u(9),cy+u(9));
      ctx.moveTo(cx+u(9),cy-u(9));ctx.lineTo(cx-u(9),cy+u(9));ctx.stroke();N(ctx);
    });

    I('search', (ctx,cx,cy)=>{
      // APPROVED
      bold(ctx,0.7,2);ctx.beginPath();ctx.arc(cx-u(4),cy-u(4),u(13),0,Math.PI*2);ctx.stroke();N(ctx);
      boldS(ctx,0.8,3);ctx.beginPath();ctx.moveTo(cx+u(6),cy+u(6));ctx.lineTo(cx+u(17),cy+u(17));ctx.stroke();N(ctx);
    });

    I('expand', (ctx,cx,cy)=>{
      bold(ctx,0.8,2.5);const s=u(14),g2=u(5);
      [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([dx,dy])=>{
        ctx.beginPath();ctx.moveTo(cx+dx*g2,cy+dy*s);ctx.lineTo(cx+dx*s,cy+dy*s);ctx.lineTo(cx+dx*s,cy+dy*g2);ctx.stroke()});N(ctx);
    });

    I('minimize', (ctx,cx,cy)=>{
      bold(ctx,0.85,3);ctx.beginPath();ctx.moveTo(cx-u(16),cy);ctx.lineTo(cx+u(16),cy);ctx.stroke();N(ctx);
    });

    I('sword', (ctx,cx,cy)=>{
      // Crossed swords symbol — bold, reads instantly
      // Sword 1 (top-left to bottom-right)
      bold(ctx,0.8,2.5);ctx.beginPath();ctx.moveTo(cx-u(14),cy-u(16));ctx.lineTo(cx+u(10),cy+u(12));ctx.stroke();N(ctx);
      // Blade tip
      fill(ctx,0.7);ctx.beginPath();ctx.moveTo(cx-u(14),cy-u(16));ctx.lineTo(cx-u(16),cy-u(12));ctx.lineTo(cx-u(11),cy-u(14));ctx.closePath();ctx.fill();
      // Guard 1
      boldS(ctx,0.7,2.5);ctx.beginPath();ctx.moveTo(cx-u(6),cy-u(2));ctx.lineTo(cx+u(2),cy-u(10));ctx.stroke();N(ctx);
      // Sword 2 (top-right to bottom-left)
      bold(ctx,0.6,2.5);ctx.beginPath();ctx.moveTo(cx+u(14),cy-u(16));ctx.lineTo(cx-u(10),cy+u(12));ctx.stroke();N(ctx);
      fill(ctx,0.5);ctx.beginPath();ctx.moveTo(cx+u(14),cy-u(16));ctx.lineTo(cx+u(16),cy-u(12));ctx.lineTo(cx+u(11),cy-u(14));ctx.closePath();ctx.fill();
      // Guard 2
      boldS(ctx,0.5,2);ctx.beginPath();ctx.moveTo(cx+u(6),cy-u(2));ctx.lineTo(cx-u(2),cy-u(10));ctx.stroke();N(ctx);
      // Pommel dots
      fill(ctx,0.5);ctx.beginPath();ctx.arc(cx+u(10),cy+u(12),u(2.5),0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx-u(10),cy+u(12),u(2.5),0,Math.PI*2);ctx.fill();
    });

    I('shield', (ctx,cx,cy)=>{
      // Bold shield with chevron emblem
      fill(ctx,0.2);ctx.beginPath();ctx.moveTo(cx,cy-u(20));ctx.lineTo(cx+u(18),cy-u(10));ctx.lineTo(cx+u(18),cy+u(2));
      ctx.bezierCurveTo(cx+u(16),cy+u(12),cx+u(8),cy+u(20),cx,cy+u(22));
      ctx.bezierCurveTo(cx-u(8),cy+u(20),cx-u(16),cy+u(12),cx-u(18),cy+u(2));ctx.lineTo(cx-u(18),cy-u(10));ctx.closePath();ctx.fill();
      bold(ctx,0.85,2.5);ctx.stroke();N(ctx);
      // Inner shield border (second line for depth)
      bold(ctx,0.3,1);ctx.beginPath();ctx.moveTo(cx,cy-u(15));ctx.lineTo(cx+u(13),cy-u(7));ctx.lineTo(cx+u(13),cy+u(1));
      ctx.bezierCurveTo(cx+u(11),cy+u(9),cx+u(5),cy+u(15),cx,cy+u(17));
      ctx.bezierCurveTo(cx-u(5),cy+u(15),cx-u(11),cy+u(9),cx-u(13),cy+u(1));ctx.lineTo(cx-u(13),cy-u(7));ctx.closePath();ctx.stroke();N(ctx);
      // Chevron emblem — bold V shape
      bold(ctx,0.7,2.5);ctx.beginPath();ctx.moveTo(cx-u(8),cy-u(6));ctx.lineTo(cx,cy+u(4));ctx.lineTo(cx+u(8),cy-u(6));ctx.stroke();N(ctx);
    });

    I('heart', (ctx,cx,cy)=>{
      // Bold heart with highlight
      fill(ctx,0.3);ctx.beginPath();ctx.moveTo(cx,cy+u(18));ctx.bezierCurveTo(cx-u(28),cy-u(4),cx-u(12),cy-u(22),cx,cy-u(10));
      ctx.bezierCurveTo(cx+u(12),cy-u(22),cx+u(28),cy-u(4),cx,cy+u(18));ctx.closePath();ctx.fill();
      bold(ctx,0.9,2.5);ctx.stroke();N(ctx);
      // Highlight spot
      G(ctx,P,4,0.3);fill(ctx,0.25);ctx.beginPath();ctx.ellipse(cx-u(7),cy-u(8),u(4),u(6),-0.4,0,Math.PI*2);ctx.fill();N(ctx);
    });

    I('star', (ctx,cx,cy)=>{
      function sp(r1,r2){ctx.beginPath();for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2-Math.PI/2,r=i%2===0?r1:r2;
        i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}ctx.closePath()}
      fill(ctx,0.25);sp(u(22),u(9));ctx.fill();bold(ctx,0.85,2.5);ctx.stroke();N(ctx);
    });

    I('coin', (ctx,cx,cy)=>{
      fill(ctx,0.12);ctx.beginPath();ctx.arc(cx,cy,u(20),0,Math.PI*2);ctx.fill();bold(ctx,0.7,2);ctx.stroke();N(ctx);
      thin(ctx,0.4,1);ctx.beginPath();ctx.arc(cx,cy,u(14),0,Math.PI*2);ctx.stroke();
      fill(ctx,0.6);ctx.font=`bold ${u(18)}px 'Orbitron',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',cx,cy+u(1));
    });

    I('trophy', (ctx,cx,cy)=>{
      // Bold cup
      fill(ctx,0.25);ctx.beginPath();ctx.moveTo(cx-u(14),cy-u(16));ctx.lineTo(cx+u(14),cy-u(16));
      ctx.bezierCurveTo(cx+u(14),cy+u(2),cx+u(8),cy+u(8),cx+u(4),cy+u(10));ctx.lineTo(cx-u(4),cy+u(10));
      ctx.bezierCurveTo(cx-u(8),cy+u(8),cx-u(14),cy+u(2),cx-u(14),cy-u(16));ctx.closePath();ctx.fill();
      bold(ctx,0.85,2.5);ctx.stroke();N(ctx);
      // Handles
      bold(ctx,0.6,2);ctx.beginPath();ctx.moveTo(cx-u(14),cy-u(12));ctx.bezierCurveTo(cx-u(20),cy-u(12),cx-u(20),cy,cx-u(14),cy);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+u(14),cy-u(12));ctx.bezierCurveTo(cx+u(20),cy-u(12),cx+u(20),cy,cx+u(14),cy);ctx.stroke();N(ctx);
      // Stem + base
      bold(ctx,0.6,2);ctx.beginPath();ctx.moveTo(cx,cy+u(10));ctx.lineTo(cx,cy+u(15));ctx.stroke();N(ctx);
      fill(ctx,0.3);ctx.fillRect(cx-u(8),cy+u(15),u(16),u(3));bold(ctx,0.55,1.5);ctx.strokeRect(cx-u(8),cy+u(15),u(16),u(3));N(ctx);
    });

    I('potion', (ctx,cx,cy)=>{
      // Bold flask with liquid
      fill(ctx,0.2);ctx.beginPath();ctx.moveTo(cx-u(5),cy-u(4));ctx.bezierCurveTo(cx-u(14),cy+u(2),cx-u(14),cy+u(14),cx-u(11),cy+u(18));
      ctx.bezierCurveTo(cx-u(8),cy+u(22),cx+u(8),cy+u(22),cx+u(11),cy+u(18));
      ctx.bezierCurveTo(cx+u(14),cy+u(14),cx+u(14),cy+u(2),cx+u(5),cy-u(4));ctx.closePath();ctx.fill();
      bold(ctx,0.8,2.2);ctx.stroke();N(ctx);
      // Liquid fill line
      bold(ctx,0.4,1.2);ctx.beginPath();ctx.moveTo(cx-u(10),cy+u(6));ctx.bezierCurveTo(cx-u(4),cy+u(4),cx+u(4),cy+u(8),cx+u(10),cy+u(6));ctx.stroke();N(ctx);
      // Neck
      fillS(ctx,0.25);ctx.fillRect(cx-u(4),cy-u(14),u(8),u(11));boldS(ctx,0.55,1.5);ctx.strokeRect(cx-u(4),cy-u(14),u(8),u(11));N(ctx);
      // Cork
      fill(ctx,0.4);ctx.fillRect(cx-u(5),cy-u(19),u(10),u(6));bold(ctx,0.5,1.2);ctx.strokeRect(cx-u(5),cy-u(19),u(10),u(6));N(ctx);
    });

    I('lightning', (ctx,cx,cy)=>{
      // Bold, chunky lightning bolt
      fill(ctx,0.35);ctx.beginPath();ctx.moveTo(cx+u(8),cy-u(22));ctx.lineTo(cx-u(5),cy-u(4));ctx.lineTo(cx+u(6),cy-u(4));
      ctx.lineTo(cx-u(8),cy+u(22));ctx.lineTo(cx+u(5),cy+u(4));ctx.lineTo(cx-u(6),cy+u(4));ctx.closePath();ctx.fill();
      bold(ctx,0.9,2.5);ctx.stroke();N(ctx);
    });

    I('fire', (ctx,cx,cy)=>{
      // Bold outer flame
      fill(ctx,0.25);ctx.beginPath();ctx.moveTo(cx,cy-u(22));
      ctx.bezierCurveTo(cx+u(6),cy-u(14),cx+u(18),cy-u(6),cx+u(14),cy+u(8));
      ctx.bezierCurveTo(cx+u(12),cy+u(14),cx+u(6),cy+u(20),cx,cy+u(20));
      ctx.bezierCurveTo(cx-u(6),cy+u(20),cx-u(12),cy+u(14),cx-u(14),cy+u(8));
      ctx.bezierCurveTo(cx-u(18),cy-u(6),cx-u(6),cy-u(14),cx,cy-u(22));ctx.closePath();ctx.fill();
      bold(ctx,0.85,2.5);ctx.stroke();N(ctx);
      // Inner flame
      fill(ctx,0.2);ctx.beginPath();ctx.moveTo(cx,cy-u(10));
      ctx.bezierCurveTo(cx+u(4),cy-u(4),cx+u(10),cy+u(2),cx+u(7),cy+u(10));
      ctx.bezierCurveTo(cx+u(5),cy+u(14),cx+u(2),cy+u(16),cx,cy+u(16));
      ctx.bezierCurveTo(cx-u(2),cy+u(16),cx-u(5),cy+u(14),cx-u(7),cy+u(10));
      ctx.bezierCurveTo(cx-u(10),cy+u(2),cx-u(4),cy-u(4),cx,cy-u(10));ctx.closePath();ctx.fill();

      bold(ctx,0.45,1.2);ctx.beginPath();ctx.arc(cx-u(5),cy-u(12),u(5),0.5,Math.PI);ctx.stroke();
      ctx.beginPath();ctx.arc(cx+u(5),cy-u(12),u(5),0,Math.PI-0.5);ctx.stroke();N(ctx);
    });

    I('flag', (ctx,cx,cy)=>{
      bold(ctx,0.6,2);ctx.beginPath();ctx.moveTo(cx-u(12),cy-u(18));ctx.lineTo(cx-u(12),cy+u(18));ctx.stroke();N(ctx);
      fill(ctx,0.25);ctx.beginPath();ctx.moveTo(cx-u(12),cy-u(18));ctx.lineTo(cx+u(16),cy-u(10));ctx.lineTo(cx-u(12),cy-u(2));ctx.closePath();ctx.fill();
      bold(ctx,0.7,1.5);ctx.stroke();N(ctx);
    });

    I('crown', (ctx,cx,cy)=>{
      // Bold crown
      fill(ctx,0.25);ctx.beginPath();ctx.moveTo(cx-u(18),cy+u(10));ctx.lineTo(cx-u(18),cy-u(4));ctx.lineTo(cx-u(9),cy+u(4));ctx.lineTo(cx,cy-u(16));
      ctx.lineTo(cx+u(9),cy+u(4));ctx.lineTo(cx+u(18),cy-u(4));ctx.lineTo(cx+u(18),cy+u(10));ctx.closePath();ctx.fill();
      bold(ctx,0.85,2.5);ctx.stroke();N(ctx);
      // Base band
      fill(ctx,0.3);ctx.fillRect(cx-u(18),cy+u(10),u(36),u(6));bold(ctx,0.7,1.5);ctx.strokeRect(cx-u(18),cy+u(10),u(36),u(6));N(ctx);
      // Tip gems
      G(ctx,P,4,0.4);fill(ctx,0.7);[[-u(9),cy+u(3)],[0,cy-u(15)],[u(9),cy+u(3)]].forEach(([x,y])=>{
        ctx.beginPath();ctx.arc(cx+x,y,u(2.5),0,Math.PI*2);ctx.fill()});N(ctx);
    });

    I('diamond', (ctx,cx,cy)=>{
      // Bold gem diamond with facet
      fill(ctx,0.25);ctx.beginPath();ctx.moveTo(cx,cy-u(20));ctx.lineTo(cx+u(20),cy-u(2));ctx.lineTo(cx,cy+u(20));ctx.lineTo(cx-u(20),cy-u(2));ctx.closePath();ctx.fill();
      bold(ctx,0.85,2.5);ctx.stroke();N(ctx);
      // Horizontal facet line
      bold(ctx,0.5,1.5);ctx.beginPath();ctx.moveTo(cx-u(20),cy-u(2));ctx.lineTo(cx+u(20),cy-u(2));ctx.stroke();N(ctx);
      // Top facets
      bold(ctx,0.35,1);ctx.beginPath();ctx.moveTo(cx-u(10),cy-u(2));ctx.lineTo(cx,cy-u(20));ctx.lineTo(cx+u(10),cy-u(2));ctx.stroke();N(ctx);
    });

    I('arrow-up', (ctx,cx,cy)=>{
      bold(ctx,0.85,3);ctx.beginPath();ctx.moveTo(cx-u(12),cy+u(4));ctx.lineTo(cx,cy-u(10));ctx.lineTo(cx+u(12),cy+u(4));ctx.stroke();N(ctx);
      bold(ctx,0.45,2);ctx.beginPath();ctx.moveTo(cx-u(9),cy+u(12));ctx.lineTo(cx,cy-u(1));ctx.lineTo(cx+u(9),cy+u(12));ctx.stroke();N(ctx);
    });

    I('arrow-down', (ctx,cx,cy)=>{
      bold(ctx,0.85,3);ctx.beginPath();ctx.moveTo(cx-u(12),cy-u(4));ctx.lineTo(cx,cy+u(10));ctx.lineTo(cx+u(12),cy-u(4));ctx.stroke();N(ctx);
      bold(ctx,0.45,2);ctx.beginPath();ctx.moveTo(cx-u(9),cy-u(12));ctx.lineTo(cx,cy+u(1));ctx.lineTo(cx+u(9),cy-u(12));ctx.stroke();N(ctx);
    });

    I('arrow-left', (ctx,cx,cy)=>{
      bold(ctx,0.85,3);ctx.beginPath();ctx.moveTo(cx+u(4),cy-u(12));ctx.lineTo(cx-u(10),cy);ctx.lineTo(cx+u(4),cy+u(12));ctx.stroke();N(ctx);
      bold(ctx,0.45,2);ctx.beginPath();ctx.moveTo(cx+u(12),cy-u(9));ctx.lineTo(cx-u(1),cy);ctx.lineTo(cx+u(12),cy+u(9));ctx.stroke();N(ctx);
    });

    I('arrow-right', (ctx,cx,cy)=>{
      bold(ctx,0.85,3);ctx.beginPath();ctx.moveTo(cx-u(4),cy-u(12));ctx.lineTo(cx+u(10),cy);ctx.lineTo(cx-u(4),cy+u(12));ctx.stroke();N(ctx);
      bold(ctx,0.45,2);ctx.beginPath();ctx.moveTo(cx-u(12),cy-u(9));ctx.lineTo(cx+u(1),cy);ctx.lineTo(cx-u(12),cy+u(9));ctx.stroke();N(ctx);
    });

    I('plus', (ctx,cx,cy)=>{
      bold(ctx,0.85,3);ctx.beginPath();ctx.moveTo(cx,cy-u(14));ctx.lineTo(cx,cy+u(14));ctx.moveTo(cx-u(14),cy);ctx.lineTo(cx+u(14),cy);ctx.stroke();N(ctx);
      thin(ctx,0.3,1);ctx.beginPath();ctx.arc(cx,cy,u(22),0,Math.PI*2);ctx.stroke();
    });

    I('minus', (ctx,cx,cy)=>{
      bold(ctx,0.85,3);ctx.beginPath();ctx.moveTo(cx-u(14),cy);ctx.lineTo(cx+u(14),cy);ctx.stroke();N(ctx);
      thin(ctx,0.3,1);ctx.beginPath();ctx.arc(cx,cy,u(22),0,Math.PI*2);ctx.stroke();
    });

    I('refresh', (ctx,cx,cy)=>{
      // APPROVED
      bold(ctx,0.7,2.5);ctx.beginPath();ctx.arc(cx,cy,u(16),0.4,Math.PI*1.7);ctx.stroke();
      ctx.beginPath();ctx.arc(cx,cy,u(16),Math.PI+0.4,Math.PI*2.7);ctx.stroke();N(ctx);
      fill(ctx,0.65);let a1=0.4;ctx.beginPath();ctx.moveTo(cx+Math.cos(a1)*u(10),cy+Math.sin(a1)*u(10));
      ctx.lineTo(cx+Math.cos(a1)*u(22),cy+Math.sin(a1)*u(22));ctx.lineTo(cx+Math.cos(a1+0.5)*u(16),cy+Math.sin(a1+0.5)*u(16));ctx.closePath();ctx.fill();
      let a2=Math.PI+0.4;ctx.beginPath();ctx.moveTo(cx+Math.cos(a2)*u(10),cy+Math.sin(a2)*u(10));
      ctx.lineTo(cx+Math.cos(a2)*u(22),cy+Math.sin(a2)*u(22));ctx.lineTo(cx+Math.cos(a2+0.5)*u(16),cy+Math.sin(a2+0.5)*u(16));ctx.closePath();ctx.fill();
    });

    I('eye', (ctx,cx,cy)=>{
      fill(ctx,0.12);ctx.beginPath();ctx.moveTo(cx-u(22),cy);ctx.bezierCurveTo(cx-u(12),cy-u(14),cx+u(12),cy-u(14),cx+u(22),cy);
      ctx.bezierCurveTo(cx+u(12),cy+u(14),cx-u(12),cy+u(14),cx-u(22),cy);ctx.closePath();ctx.fill();
      bold(ctx,0.6,1.5);ctx.stroke();N(ctx);
      fillS(ctx,0.4);ctx.beginPath();ctx.arc(cx,cy,u(7),0,Math.PI*2);ctx.fill();boldS(ctx,0.6,1);ctx.stroke();N(ctx);
      fillS(ctx,0.65);ctx.beginPath();ctx.arc(cx,cy,u(3),0,Math.PI*2);ctx.fill();
    });

    I('download', (ctx,cx,cy)=>{
      boldS(ctx,0.5,1.5);ctx.beginPath();ctx.moveTo(cx-u(16),cy+u(8));ctx.lineTo(cx-u(16),cy+u(16));ctx.lineTo(cx+u(16),cy+u(16));ctx.lineTo(cx+u(16),cy+u(8));ctx.stroke();N(ctx);
      bold(ctx,0.85,2.5);ctx.beginPath();ctx.moveTo(cx,cy-u(14));ctx.lineTo(cx,cy+u(6));ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-u(7),cy+u(1));ctx.lineTo(cx,cy+u(8));ctx.lineTo(cx+u(7),cy+u(1));ctx.stroke();N(ctx);
    });

    // ══════════════════════════════════════════════════════════════════
    // REVIEW UI
    // ══════════════════════════════════════════════════════════════════

    const approved = new Set(APPROVED);
    const iconNames = Object.keys(ICONS);
    let filter = 'all';

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const visible = iconNames.filter(n => {
        if (filter === 'approved') return approved.has(n);
        if (filter === 'pending') return !approved.has(n);
        return true;
      });
      for (const name of visible) {
        const card = document.createElement('div');
        card.className = 'icon-card' + (approved.has(name) ? ' approved' : '');
        card.onclick = () => { approved.has(name) ? approved.delete(name) : approved.add(name); renderGrid(); updateStats(); };
        const cv = document.createElement('canvas');
        cv.width = SZ; cv.height = SZ;
        cv.style.width = '56px'; cv.style.height = '56px';
        ICONS[name](cv.getContext('2d'), SZ/2, SZ/2);
        card.appendChild(cv);
        const label = document.createElement('div');
        label.className = 'name';
        label.textContent = name;
        card.appendChild(label);
        grid.appendChild(card);
      }
    }

    function updateStats() {
      document.getElementById('stats').innerHTML = `<span class="approved">${approved.size}</span> / ${iconNames.length} APPROVED — <span class="pending">${iconNames.length - approved.size}</span> PENDING`;
      document.getElementById('exportList').value = approved.size > 0 ? [...approved].join(', ') : '';
    }

    function filterIcons(f) {
      filter = f;
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      document.getElementById(f === 'all' ? 'filterAll' : f === 'approved' ? 'filterApproved' : 'filterPending').classList.add('active');
      renderGrid();
    }

    function approveAll() { iconNames.forEach(n => approved.add(n)); renderGrid(); updateStats(); }
    function clearAll() { approved.clear(); renderGrid(); updateStats(); }

    renderGrid();
    updateStats();
  </script>
</body>
</html>
