<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOID SECTOR — Main Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* ── THEME: Lavender Purple + Mint Green ── */
      --primary-h: 270;
      --primary: rgba(170, 140, 220, 1);
      --primary-bright: rgba(200, 175, 245, 1);
      --primary-dim: rgba(120, 95, 170, 1);
      --primary-ghost: rgba(170, 140, 220, 0.08);
      --secondary-h: 160;
      --secondary: rgba(100, 210, 180, 1);
      --secondary-bright: rgba(140, 235, 210, 1);
      --secondary-dim: rgba(60, 150, 120, 1);
      --secondary-ghost: rgba(100, 210, 180, 0.08);
      --bg-deep: #06050c;
      --bg-mid: #0a0912;
      --text: rgba(210, 200, 230, 0.85);
      --text-dim: rgba(170, 155, 200, 0.45);
    }

    body {
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas#bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

    .menu-container {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 540px; padding: 0 24px;
    }

    .logo-mark { width: 60px; height: 60px; margin-bottom: 14px; }
    .logo-mark canvas { width: 100%; height: 100%; }

    .game-title {
      font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 42px;
      letter-spacing: 12px; text-align: center; margin-bottom: 2px;
      background: linear-gradient(135deg, var(--primary-bright), var(--secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(170, 140, 220, 0.12)) drop-shadow(0 0 60px rgba(100, 210, 180, 0.05));
    }

    .game-subtitle {
      font-family: 'Share Tech Mono', monospace; font-size: 11px;
      letter-spacing: 8px; color: var(--text-dim); text-align: center; margin-bottom: 50px;
    }

    .menu-items { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 50px; }

    .menu-btn {
      position: relative; display: flex; align-items: center; width: 100%;
      gap: 18px; padding: 15px 24px;
      background: transparent;
      border: 1px solid rgba(170, 140, 220, 0.07);
      color: var(--text-dim);
      font-family: 'Rajdhani', sans-serif; font-weight: 500; font-size: 15px;
      letter-spacing: 3px; cursor: pointer; transition: all 0.35s ease;
      text-transform: uppercase; overflow: hidden;
    }
    .menu-btn::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
      background: linear-gradient(90deg, rgba(170, 140, 220, 0.06), rgba(100, 210, 180, 0.02), transparent);
      transition: width 0.4s ease;
    }
    .menu-btn:hover {
      border-color: rgba(170, 140, 220, 0.2);
      color: var(--text);
      background: rgba(170, 140, 220, 0.02);
    }
    .menu-btn:hover::before { width: 100%; }
    .menu-btn:hover .btn-icon canvas { filter: brightness(1.6) drop-shadow(0 0 4px rgba(100, 210, 180, 0.25)); }
    .menu-btn:hover .btn-arrow { opacity: 0.45; transform: translateX(3px); }
    .menu-btn.primary { border-color: rgba(170, 140, 220, 0.15); color: rgba(210, 200, 235, 0.7); }
    .menu-btn.primary:hover {
      border-color: rgba(170, 140, 220, 0.3); color: #e8e0f5;
      box-shadow: 0 0 25px rgba(170, 140, 220, 0.05), 0 0 50px rgba(100, 210, 180, 0.02);
    }

    .btn-icon { width: 36px; height: 36px; flex-shrink: 0; }
    .btn-icon canvas { width: 100%; height: 100%; transition: filter 0.3s; }
    .btn-label { flex: 1; }
    .btn-arrow { font-size: 14px; opacity: 0; transition: all 0.3s; color: var(--secondary-dim); }

    .footer { display: flex; justify-content: center; gap: 40px; width: 100%; }
    .footer-text { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: rgba(140, 120, 170, 0.25); letter-spacing: 2px; }

    .corner { position: fixed; z-index: 1; }
    .corner svg { width: 40px; height: 40px; }
    .corner-tl { top: 20px; left: 20px; }
    .corner-tr { top: 20px; right: 20px; transform: scaleX(-1); }
    .corner-bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
    .corner-br { bottom: 20px; right: 20px; transform: scale(-1, -1); }

    .scanlines {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 4px);
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="scanlines"></div>

  <div class="corner corner-tl"><svg viewBox="0 0 40 40"><path d="M1 28 L1 1 L28 1" stroke="rgba(100,210,180,0.12)" stroke-width="1" fill="none"/><path d="M5 1 L5 5 L1 5" stroke="rgba(170,140,220,0.08)" stroke-width="0.5" fill="none"/><circle cx="1" cy="1" r="1.5" fill="rgba(100,210,180,0.18)"/></svg></div>
  <div class="corner corner-tr"><svg viewBox="0 0 40 40"><path d="M1 28 L1 1 L28 1" stroke="rgba(100,210,180,0.12)" stroke-width="1" fill="none"/><path d="M5 1 L5 5 L1 5" stroke="rgba(170,140,220,0.08)" stroke-width="0.5" fill="none"/><circle cx="1" cy="1" r="1.5" fill="rgba(100,210,180,0.18)"/></svg></div>
  <div class="corner corner-bl"><svg viewBox="0 0 40 40"><path d="M1 28 L1 1 L28 1" stroke="rgba(100,210,180,0.12)" stroke-width="1" fill="none"/><path d="M5 1 L5 5 L1 5" stroke="rgba(170,140,220,0.08)" stroke-width="0.5" fill="none"/><circle cx="1" cy="1" r="1.5" fill="rgba(100,210,180,0.18)"/></svg></div>
  <div class="corner corner-br"><svg viewBox="0 0 40 40"><path d="M1 28 L1 1 L28 1" stroke="rgba(100,210,180,0.12)" stroke-width="1" fill="none"/><path d="M5 1 L5 5 L1 5" stroke="rgba(170,140,220,0.08)" stroke-width="0.5" fill="none"/><circle cx="1" cy="1" r="1.5" fill="rgba(100,210,180,0.18)"/></svg></div>

  <div class="menu-container">
    <div class="logo-mark"><canvas id="logoCanvas" width="100" height="100"></canvas></div>
    <div class="game-title">VOID SECTOR</div>
    <div class="game-subtitle">BEYOND THE RIM</div>

    <div class="menu-items">
      <button class="menu-btn primary" data-icon="play"><span class="btn-icon"><canvas width="60" height="60"></canvas></span><span class="btn-label">New Campaign</span><span class="btn-arrow">›</span></button>
      <button class="menu-btn" data-icon="continue"><span class="btn-icon"><canvas width="60" height="60"></canvas></span><span class="btn-label">Continue</span><span class="btn-arrow">›</span></button>
      <button class="menu-btn" data-icon="fleet"><span class="btn-icon"><canvas width="60" height="60"></canvas></span><span class="btn-label">Fleet Manager</span><span class="btn-arrow">›</span></button>
      <button class="menu-btn" data-icon="leaderboard"><span class="btn-icon"><canvas width="60" height="60"></canvas></span><span class="btn-label">Leaderboard</span><span class="btn-arrow">›</span></button>
      <button class="menu-btn" data-icon="settings"><span class="btn-icon"><canvas width="60" height="60"></canvas></span><span class="btn-label">Settings</span><span class="btn-arrow">›</span></button>
      <button class="menu-btn" data-icon="quit"><span class="btn-icon"><canvas width="60" height="60"></canvas></span><span class="btn-label">Quit to Desktop</span><span class="btn-arrow">›</span></button>
    </div>

    <div class="footer">
      <span class="footer-text">v0.4.1 // BUILD 2847</span>
      <span class="footer-text">© 2026 VOID INTERACTIVE</span>
    </div>
  </div>

  <script>
    // ── Theme colors ──
    const PRI = [170, 140, 220];
    const SEC = [100, 210, 180];

    // ══════════════════════════════════════════════════════════════════
    // BACKGROUND
    // ══════════════════════════════════════════════════════════════════
    const bg = document.getElementById('bg');
    const bCtx = bg.getContext('2d');
    let W, H;
    function resizeBg() { W = bg.width = window.innerWidth; H = bg.height = window.innerHeight; }
    window.addEventListener('resize', resizeBg); resizeBg();

    const stars = [];
    for (let i = 0; i < 200; i++) stars.push({ x:Math.random(), y:Math.random(), s:0.3+Math.random()*1.2, b:0.12+Math.random()*0.35, ts:0.5+Math.random()*2, tp:Math.random()*Math.PI*2 });

    let time = 0;
    function renderBg() {
      time += 1/60;
      const g = bCtx.createRadialGradient(W*0.5,H*0.38,0, W*0.5,H*0.38,W*0.7);
      g.addColorStop(0,'#0d0a16'); g.addColorStop(0.5,'#080710'); g.addColorStop(1,'#050409');
      bCtx.fillStyle = g; bCtx.fillRect(0,0,W,H);

      // Nebula: lavender + mint
      const n1x = W*0.35+Math.sin(time*0.07)*60, n1y = H*0.3+Math.cos(time*0.05)*40;
      const n1 = bCtx.createRadialGradient(n1x,n1y,0, n1x,n1y,W*0.3);
      n1.addColorStop(0,`rgba(${PRI[0]},${PRI[1]},${PRI[2]},0.02)`); n1.addColorStop(1,'rgba(0,0,0,0)');
      bCtx.fillStyle = n1; bCtx.fillRect(0,0,W,H);

      const n2x = W*0.65+Math.sin(time*0.06)*50, n2y = H*0.55+Math.cos(time*0.09)*35;
      const n2 = bCtx.createRadialGradient(n2x,n2y,0, n2x,n2y,W*0.25);
      n2.addColorStop(0,`rgba(${SEC[0]},${SEC[1]},${SEC[2]},0.015)`); n2.addColorStop(1,'rgba(0,0,0,0)');
      bCtx.fillStyle = n2; bCtx.fillRect(0,0,W,H);

      for (const st of stars) {
        const tw = 0.6+Math.sin(time*st.ts+st.tp)*0.4, a = st.b*tw;
        const x=st.x*W, y=st.y*H;
        // Alternate star colors between lavender and mint
        const col = st.tp > Math.PI ? PRI : (st.s > 0.9 ? SEC : [200,195,215]);
        bCtx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${a})`;
        bCtx.fillRect(Math.round(x),Math.round(y), st.s>1?1.5:1, st.s>1?1.5:1);
        if(st.s>1&&a>0.28){bCtx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${a*0.18})`;bCtx.fillRect(Math.round(x)-1,Math.round(y),3,1);bCtx.fillRect(Math.round(x),Math.round(y)-1,1,3)}
      }

      // Dust
      for(let i=0;i<12;i++){
        const px=((i*137.5+time*2.5)%W), py=((i*89.3+time*1.2+Math.sin(time*0.25+i)*25)%H);
        const dc = i%3===0 ? SEC : PRI;
        bCtx.fillStyle=`rgba(${dc[0]},${dc[1]},${dc[2]},0.04)`;
        bCtx.beginPath();bCtx.arc(px,py,0.7,0,Math.PI*2);bCtx.fill();
      }
      requestAnimationFrame(renderBg);
    }
    renderBg();

    // ══════════════════════════════════════════════════════════════════
    // ICONS — richer, multi-layer, dual-color, with fills and depth
    // ══════════════════════════════════════════════════════════════════

    function drawIcon(canvas, type) {
      const ctx = canvas.getContext('2d');
      const s = canvas.width;
      const u = s / 60; // finer unit for more detail
      ctx.clearRect(0, 0, s, s);
      const cx = s/2, cy = s/2;

      // Shared: primary and secondary strokes
      const priStr = `rgba(${PRI[0]},${PRI[1]},${PRI[2]},`;
      const secStr = `rgba(${SEC[0]},${SEC[1]},${SEC[2]},`;

      function priStroke(a=0.55, w=u*1.2) { ctx.strokeStyle=priStr+a+')'; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round'; }
      function secStroke(a=0.45, w=u*1) { ctx.strokeStyle=secStr+a+')'; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round'; }
      function priFill(a=0.08) { ctx.fillStyle=priStr+a+')'; }
      function secFill(a=0.06) { ctx.fillStyle=secStr+a+')'; }
      function glow(col, blur=6, a=0.3) { ctx.shadowColor=`rgba(${col[0]},${col[1]},${col[2]},${a})`; ctx.shadowBlur=blur; }
      function noGlow() { ctx.shadowColor='transparent'; ctx.shadowBlur=0; }

      switch(type) {
        case 'play': {
          // Outer circle (secondary, thin)
          secStroke(0.15, u*0.8);
          ctx.beginPath(); ctx.arc(cx, cy, u*12, 0, Math.PI*2); ctx.stroke();
          // Inner circle (primary)
          priStroke(0.12, u*0.6);
          ctx.beginPath(); ctx.arc(cx, cy, u*9, 0, Math.PI*2); ctx.stroke();
          // Triangle fill
          priFill(0.1);
          ctx.beginPath(); ctx.moveTo(cx-u*3.5, cy-u*5.5); ctx.lineTo(cx+u*6, cy); ctx.lineTo(cx-u*3.5, cy+u*5.5); ctx.closePath();
          ctx.fill();
          // Triangle stroke with glow
          glow(SEC, 8, 0.2);
          secStroke(0.5, u*1.2);
          ctx.stroke();
          noGlow();
          // Center accent dot
          glow(PRI, 6, 0.3);
          ctx.fillStyle = priStr+'0.35)';
          ctx.beginPath(); ctx.arc(cx+u*1, cy, u*1.2, 0, Math.PI*2); ctx.fill();
          noGlow();
          // Decorative tick marks on outer circle
          for (let i = 0; i < 12; i++) {
            const a = (i/12)*Math.PI*2;
            const inner = u*11, outer = u*12.5;
            ctx.strokeStyle = priStr+(i%3===0?'0.2':'0.06')+')';
            ctx.lineWidth = i%3===0 ? u*0.8 : u*0.4;
            ctx.beginPath();
            ctx.moveTo(cx+Math.cos(a)*inner, cy+Math.sin(a)*inner);
            ctx.lineTo(cx+Math.cos(a)*outer, cy+Math.sin(a)*outer);
            ctx.stroke();
          }
          break;
        }
        case 'continue': {
          // Circular progress track
          secStroke(0.08, u*1.5);
          ctx.beginPath(); ctx.arc(cx, cy, u*11, 0, Math.PI*2); ctx.stroke();
          // Progress arc (~65%)
          glow(SEC, 6, 0.2);
          secStroke(0.4, u*1.5);
          ctx.beginPath(); ctx.arc(cx, cy, u*11, -Math.PI/2, -Math.PI/2 + Math.PI*1.3); ctx.stroke();
          noGlow();
          // End dot on progress
          const endA = -Math.PI/2 + Math.PI*1.3;
          glow(SEC, 5, 0.35);
          ctx.fillStyle = secStr+'0.5)';
          ctx.beginPath(); ctx.arc(cx+Math.cos(endA)*u*11, cy+Math.sin(endA)*u*11, u*1.5, 0, Math.PI*2); ctx.fill();
          noGlow();
          // Arrow in center
          priStroke(0.45, u*1.2);
          ctx.beginPath();
          ctx.moveTo(cx-u*3, cy-u*4); ctx.lineTo(cx+u*4, cy); ctx.lineTo(cx-u*3, cy+u*4);
          ctx.stroke();
          // Inner line
          secStroke(0.15, u*0.6);
          ctx.beginPath(); ctx.moveTo(cx-u*1, cy-u*2.5); ctx.lineTo(cx+u*2.5, cy); ctx.lineTo(cx-u*1, cy+u*2.5); ctx.stroke();
          // Percentage text
          ctx.font = `${u*4}px 'Share Tech Mono', monospace`;
          ctx.fillStyle = priStr+'0.3)';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('65%', cx, cy+u*5.5);
          break;
        }
        case 'fleet': {
          // Ship body
          glow(PRI, 4, 0.15);
          priFill(0.08);
          ctx.beginPath();
          ctx.moveTo(cx, cy-u*10); ctx.lineTo(cx+u*3, cy-u*4); ctx.lineTo(cx+u*6, cy+u*2);
          ctx.lineTo(cx+u*3, cy+u*1); ctx.lineTo(cx+u*3, cy+u*6);
          ctx.lineTo(cx-u*3, cy+u*6); ctx.lineTo(cx-u*3, cy+u*1); ctx.lineTo(cx-u*6, cy+u*2);
          ctx.lineTo(cx-u*3, cy-u*4);
          ctx.closePath(); ctx.fill();
          priStroke(0.4, u*1); ctx.stroke();
          noGlow();
          // Cockpit
          secFill(0.15);
          ctx.beginPath(); ctx.ellipse(cx, cy-u*4, u*1.5, u*2.5, 0, 0, Math.PI*2); ctx.fill();
          secStroke(0.3, u*0.6); ctx.stroke();
          // Engine glow
          glow(SEC, 8, 0.3);
          secFill(0.2);
          ctx.beginPath(); ctx.ellipse(cx-u*1.5, cy+u*7, u*1, u*2, 0, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(cx+u*1.5, cy+u*7, u*1, u*2, 0, 0, Math.PI*2); ctx.fill();
          noGlow();
          // Wing detail lines
          priStroke(0.15, u*0.4);
          ctx.beginPath(); ctx.moveTo(cx-u*1.5, cy-u*3); ctx.lineTo(cx-u*5, cy+u*1.5); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx+u*1.5, cy-u*3); ctx.lineTo(cx+u*5, cy+u*1.5); ctx.stroke();
          // Radar dish detail
          secStroke(0.12, u*0.4);
          ctx.beginPath(); ctx.arc(cx, cy-u*7, u*1.5, Math.PI*0.8, Math.PI*0.2); ctx.stroke();
          break;
        }
        case 'leaderboard': {
          const barW = u*5, gap = u*1.5;
          const bx = [cx-barW-gap, cx-barW/2, cx+gap];
          const bh = [u*10, u*16, u*7];
          const base = cy+u*9;
          // Bar fills with gradient
          for (let i = 0; i < 3; i++) {
            const grad = ctx.createLinearGradient(bx[i], base-bh[i], bx[i], base);
            const col = i===1 ? SEC : PRI;
            grad.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},0.18)`);
            grad.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0.04)`);
            ctx.fillStyle = grad;
            ctx.fillRect(bx[i], base-bh[i], barW, bh[i]);
            // Border
            const bCol = i===1 ? secStr : priStr;
            ctx.strokeStyle = bCol+(i===1?'0.35':'0.2')+')';
            ctx.lineWidth = u*0.7;
            ctx.strokeRect(bx[i], base-bh[i], barW, bh[i]);
            // Top bright edge
            ctx.strokeStyle = bCol+'0.35)';
            ctx.lineWidth = u*0.5;
            ctx.beginPath(); ctx.moveTo(bx[i], base-bh[i]); ctx.lineTo(bx[i]+barW, base-bh[i]); ctx.stroke();
          }
          // Rank numbers
          ctx.font = `${u*3.5}px 'Orbitron', sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = priStr+'0.3)'; ctx.fillText('3', bx[0]+barW/2, base-bh[0]+u*4);
          ctx.fillStyle = secStr+'0.5)'; ctx.fillText('1', bx[1]+barW/2, base-bh[1]+u*4);
          ctx.fillStyle = priStr+'0.3)'; ctx.fillText('2', bx[2]+barW/2, base-bh[2]+u*4);
          // Crown on #1
          glow(SEC, 5, 0.2);
          secStroke(0.4, u*0.8);
          const crY = base-bh[1]-u*2;
          ctx.beginPath();
          ctx.moveTo(cx-u*3, crY); ctx.lineTo(cx-u*3, crY-u*3); ctx.lineTo(cx-u*1, crY-u*1.5);
          ctx.lineTo(cx, crY-u*4); ctx.lineTo(cx+u*1, crY-u*1.5);
          ctx.lineTo(cx+u*3, crY-u*3); ctx.lineTo(cx+u*3, crY);
          ctx.stroke();
          noGlow();
          // Base line
          priStroke(0.15, u*0.5);
          ctx.beginPath(); ctx.moveTo(cx-u*11, base); ctx.lineTo(cx+u*11, base); ctx.stroke();
          break;
        }
        case 'settings': {
          // Outer ring
          secStroke(0.1, u*0.6);
          ctx.beginPath(); ctx.arc(cx, cy, u*13, 0, Math.PI*2); ctx.stroke();
          // Gear teeth
          const teeth = 8, or = u*10, ir = u*7.5, tw = Math.PI/teeth*0.45;
          ctx.beginPath();
          for (let i = 0; i < teeth; i++) {
            const a = (i/teeth)*Math.PI*2-Math.PI/2;
            ctx.lineTo(cx+Math.cos(a-tw)*ir, cy+Math.sin(a-tw)*ir);
            ctx.lineTo(cx+Math.cos(a-tw*0.8)*or, cy+Math.sin(a-tw*0.8)*or);
            ctx.lineTo(cx+Math.cos(a+tw*0.8)*or, cy+Math.sin(a+tw*0.8)*or);
            ctx.lineTo(cx+Math.cos(a+tw)*ir, cy+Math.sin(a+tw)*ir);
          }
          ctx.closePath();
          priFill(0.06); ctx.fill();
          priStroke(0.3, u*0.8); ctx.stroke();
          // Inner circles
          priStroke(0.15, u*0.5);
          ctx.beginPath(); ctx.arc(cx, cy, u*5, 0, Math.PI*2); ctx.stroke();
          // Center filled circle
          glow(SEC, 5, 0.2);
          secFill(0.12);
          ctx.beginPath(); ctx.arc(cx, cy, u*3, 0, Math.PI*2); ctx.fill();
          secStroke(0.3, u*0.6); ctx.stroke();
          noGlow();
          // Center dot
          ctx.fillStyle = secStr+'0.3)';
          ctx.beginPath(); ctx.arc(cx, cy, u*1, 0, Math.PI*2); ctx.fill();
          // Dial marks inside
          for (let i = 0; i < 4; i++) {
            const a = (i/4)*Math.PI*2 + Math.PI/4;
            priStroke(0.1, u*0.3);
            ctx.beginPath();
            ctx.moveTo(cx+Math.cos(a)*u*5.5, cy+Math.sin(a)*u*5.5);
            ctx.lineTo(cx+Math.cos(a)*u*7, cy+Math.sin(a)*u*7);
            ctx.stroke();
          }
          break;
        }
        case 'quit': {
          // Door frame
          priFill(0.04);
          ctx.fillRect(cx-u*7, cy-u*9, u*10, u*18);
          priStroke(0.25, u*0.8);
          ctx.strokeRect(cx-u*7, cy-u*9, u*10, u*18);
          // Door panel detail
          priStroke(0.08, u*0.4);
          ctx.strokeRect(cx-u*5.5, cy-u*7, u*7, u*6);
          ctx.strokeRect(cx-u*5.5, cy+u*1, u*7, u*6);
          // Handle
          secFill(0.2);
          ctx.beginPath(); ctx.arc(cx+u*1.5, cy, u*0.8, 0, Math.PI*2); ctx.fill();
          // Exit arrow
          glow(SEC, 6, 0.25);
          secStroke(0.5, u*1.2);
          ctx.beginPath(); ctx.moveTo(cx+u*4, cy); ctx.lineTo(cx+u*11, cy); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx+u*8.5, cy-u*3); ctx.lineTo(cx+u*11.5, cy); ctx.lineTo(cx+u*8.5, cy+u*3);
          ctx.stroke();
          noGlow();
          // Arrow motion lines
          secStroke(0.1, u*0.3);
          ctx.beginPath(); ctx.moveTo(cx+u*5, cy-u*1.5); ctx.lineTo(cx+u*7, cy-u*1.5); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx+u*5.5, cy+u*1.5); ctx.lineTo(cx+u*7.5, cy+u*1.5); ctx.stroke();
          break;
        }
      }
    }

    // Draw all icons
    document.querySelectorAll('.menu-btn').forEach(btn => {
      const c = btn.querySelector('canvas');
      if (c) drawIcon(c, btn.dataset.icon);
    });

    // ══════════════════════════════════════════════════════════════════
    // LOGO
    // ══════════════════════════════════════════════════════════════════
    const lC = document.getElementById('logoCanvas');
    const lx = lC.getContext('2d');
    const ls = lC.width, lu = ls/100;

    // Hex frame
    lx.strokeStyle = secStr+'0.2)'; lx.lineWidth = lu*1;
    lx.beginPath();
    for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/2,r=lu*38;i===0?lx.moveTo(ls/2+Math.cos(a)*r,ls/2+Math.sin(a)*r):lx.lineTo(ls/2+Math.cos(a)*r,ls/2+Math.sin(a)*r);}
    lx.closePath(); lx.stroke();
    // Inner hex
    lx.strokeStyle = priStr+'0.1)'; lx.lineWidth = lu*0.5;
    lx.beginPath();
    for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2,r=lu*28;i===0?lx.moveTo(ls/2+Math.cos(a)*r,ls/2+Math.sin(a)*r):lx.lineTo(ls/2+Math.cos(a)*r,ls/2+Math.sin(a)*r);}
    lx.closePath(); lx.stroke();
    // V mark
    lx.shadowColor=`rgba(${SEC[0]},${SEC[1]},${SEC[2]},0.2)`; lx.shadowBlur=8;
    lx.strokeStyle = secStr+'0.4)'; lx.lineWidth = lu*1.8; lx.lineCap='round';
    lx.beginPath(); lx.moveTo(ls/2-lu*12,ls/2-lu*10); lx.lineTo(ls/2,ls/2+lu*8); lx.lineTo(ls/2+lu*12,ls/2-lu*10); lx.stroke();
    lx.shadowBlur=0;
    // Dot
    lx.fillStyle = secStr+'0.3)';
    lx.beginPath(); lx.arc(ls/2,ls/2+lu*10, lu*2.5, 0, Math.PI*2); lx.fill();
    // Decorative ring
    lx.strokeStyle = priStr+'0.06)'; lx.lineWidth = lu*0.4;
    lx.beginPath(); lx.arc(ls/2,ls/2, lu*45, 0, Math.PI*2); lx.stroke();
  </script>
</body>
</html>
