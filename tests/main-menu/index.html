<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOID SECTOR — Main Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{background:#04030a;font-family:'Rajdhani',sans-serif;height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center}
    canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

    .menu{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:600px;padding:0 20px}

    .logo-mark{width:70px;height:70px;margin-bottom:16px}
    .logo-mark canvas{width:100%;height:100%}

    .game-title{
      font-family:'Orbitron',sans-serif;font-weight:800;font-size:46px;
      letter-spacing:14px;text-align:center;margin-bottom:2px;
      background:linear-gradient(135deg,#c8a0ff,#70e8c8);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      filter:drop-shadow(0 0 25px rgba(160,120,240,0.25)) drop-shadow(0 0 50px rgba(100,220,180,0.1));
    }
    .game-subtitle{
      font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:9px;
      color:rgba(140,200,180,0.35);text-align:center;margin-bottom:44px;
    }

    .menu-items{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:44px}

    .menu-btn{
      position:relative;display:flex;align-items:center;width:100%;
      gap:20px;padding:12px 20px;background:rgba(140,110,200,0.02);
      border:1px solid rgba(160,130,220,0.1);color:rgba(190,175,225,0.5);
      font-family:'Rajdhani',sans-serif;font-weight:500;font-size:16px;
      letter-spacing:3px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;overflow:hidden;
    }
    .menu-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;
      background:linear-gradient(90deg,rgba(140,110,220,0.08),rgba(90,210,170,0.03),transparent);
      transition:width 0.4s}
    .menu-btn:hover{
      border-color:rgba(160,130,220,0.3);color:rgba(230,220,250,0.9);
      background:rgba(140,110,200,0.04);
      box-shadow:0 0 20px rgba(140,110,220,0.06),inset 0 0 30px rgba(140,110,220,0.03);
    }
    .menu-btn:hover::before{width:100%}
    .menu-btn:hover .btn-icon canvas{filter:brightness(1.5) drop-shadow(0 0 6px rgba(100,220,180,0.4))}
    .menu-btn:hover .btn-arrow{opacity:0.6;transform:translateX(4px)}
    .menu-btn.primary{border-color:rgba(160,130,220,0.2);color:rgba(220,210,245,0.7);
      box-shadow:0 0 15px rgba(140,110,220,0.03)}
    .menu-btn.primary:hover{border-color:rgba(170,140,230,0.4);color:#ece5f8;
      box-shadow:0 0 30px rgba(140,110,220,0.08),0 0 60px rgba(100,220,180,0.03)}

    .btn-icon{width:48px;height:48px;flex-shrink:0}
    .btn-icon canvas{width:100%;height:100%;transition:filter 0.3s}
    .btn-label{flex:1}
    .btn-arrow{font-size:16px;opacity:0;transition:all 0.3s;color:rgba(100,210,180,0.5)}

    .footer{display:flex;justify-content:center;gap:40px}
    .footer-text{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(130,115,165,0.22);letter-spacing:2px}

    .corner{position:fixed;z-index:1}.corner svg{width:45px;height:45px}
    .corner-tl{top:16px;left:16px}.corner-tr{top:16px;right:16px;transform:scaleX(-1)}
    .corner-bl{bottom:16px;left:16px;transform:scaleY(-1)}.corner-br{bottom:16px;right:16px;transform:scale(-1,-1)}

    .scanlines{position:fixed;inset:0;z-index:2;pointer-events:none;
      background:repeating-linear-gradient(0deg,rgba(0,0,0,0.015) 0px,rgba(0,0,0,0.015) 1px,transparent 1px,transparent 4px)}
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="scanlines"></div>
  <div class="corner corner-tl"><svg viewBox="0 0 45 45"><path d="M1 35 L1 1 L35 1" stroke="rgba(100,220,180,0.15)" stroke-width="1" fill="none"/><path d="M6 1 L6 6 L1 6" stroke="rgba(160,130,220,0.1)" stroke-width="0.5" fill="none"/><circle cx="1" cy="1" r="2" fill="rgba(100,220,180,0.2)"/></svg></div>
  <div class="corner corner-tr"><svg viewBox="0 0 45 45"><path d="M1 35 L1 1 L35 1" stroke="rgba(100,220,180,0.15)" stroke-width="1" fill="none"/><path d="M6 1 L6 6 L1 6" stroke="rgba(160,130,220,0.1)" stroke-width="0.5" fill="none"/><circle cx="1" cy="1" r="2" fill="rgba(100,220,180,0.2)"/></svg></div>
  <div class="corner corner-bl"><svg viewBox="0 0 45 45"><path d="M1 35 L1 1 L35 1" stroke="rgba(100,220,180,0.15)" stroke-width="1" fill="none"/><path d="M6 1 L6 6 L1 6" stroke="rgba(160,130,220,0.1)" stroke-width="0.5" fill="none"/><circle cx="1" cy="1" r="2" fill="rgba(100,220,180,0.2)"/></svg></div>
  <div class="corner corner-br"><svg viewBox="0 0 45 45"><path d="M1 35 L1 1 L35 1" stroke="rgba(100,220,180,0.15)" stroke-width="1" fill="none"/><path d="M6 1 L6 6 L1 6" stroke="rgba(160,130,220,0.1)" stroke-width="0.5" fill="none"/><circle cx="1" cy="1" r="2" fill="rgba(100,220,180,0.2)"/></svg></div>

  <div class="menu">
    <div class="logo-mark"><canvas id="logoCanvas" width="120" height="120"></canvas></div>
    <div class="game-title">VOID SECTOR</div>
    <div class="game-subtitle">BEYOND THE RIM</div>
    <div class="menu-items">
      <button class="menu-btn primary" data-icon="play"><span class="btn-icon"><canvas width="80" height="80"></canvas></span><span class="btn-label">New Campaign</span><span class="btn-arrow">›</span></button>
      <button class="menu-btn" data-icon="continue"><span class="btn-icon"><canvas width="80" height="80"></canvas></span><span class="btn-label">Continue</span><span class="btn-arrow">›</span></button>
      <button class="menu-btn" data-icon="fleet"><span class="btn-icon"><canvas width="80" height="80"></canvas></span><span class="btn-label">Fleet Manager</span><span class="btn-arrow">›</span></button>
      <button class="menu-btn" data-icon="leaderboard"><span class="btn-icon"><canvas width="80" height="80"></canvas></span><span class="btn-label">Leaderboard</span><span class="btn-arrow">›</span></button>
      <button class="menu-btn" data-icon="settings"><span class="btn-icon"><canvas width="80" height="80"></canvas></span><span class="btn-label">Settings</span><span class="btn-arrow">›</span></button>
      <button class="menu-btn" data-icon="quit"><span class="btn-icon"><canvas width="80" height="80"></canvas></span><span class="btn-label">Quit to Desktop</span><span class="btn-arrow">›</span></button>
    </div>
    <div class="footer">
      <span class="footer-text">v0.4.1 // BUILD 2847</span>
      <span class="footer-text">© 2026 VOID INTERACTIVE</span>
    </div>
  </div>

  <script>
    const P = [160,130,220], S = [100,220,180];
    const pc = (a) => `rgba(${P[0]},${P[1]},${P[2]},${a})`;
    const sc = (a) => `rgba(${S[0]},${S[1]},${S[2]},${a})`;

    // ── Background ──
    const bg=document.getElementById('bg'),bx=bg.getContext('2d');let W,H;
    function rsz(){W=bg.width=innerWidth;H=bg.height=innerHeight}addEventListener('resize',rsz);rsz();
    const stars=[];for(let i=0;i<180;i++)stars.push({x:Math.random(),y:Math.random(),s:0.3+Math.random()*1.3,b:0.1+Math.random()*0.35,ts:0.4+Math.random()*2,tp:Math.random()*Math.PI*2});
    let t=0;
    function renderBg(){
      t+=1/60;
      const g=bx.createRadialGradient(W*0.5,H*0.36,0,W*0.5,H*0.36,W*0.72);
      g.addColorStop(0,'#0c0918');g.addColorStop(0.5,'#070610');g.addColorStop(1,'#040308');
      bx.fillStyle=g;bx.fillRect(0,0,W,H);
      // Nebulae
      [[W*0.35+Math.sin(t*0.07)*60,H*0.28+Math.cos(t*0.05)*40,P,0.03,W*0.3],
       [W*0.6+Math.sin(t*0.06)*50,H*0.5+Math.cos(t*0.08)*35,S,0.02,W*0.25]].forEach(([nx,ny,c,a,r])=>{
        const n=bx.createRadialGradient(nx,ny,0,nx,ny,r);
        n.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${a})`);n.addColorStop(1,'rgba(0,0,0,0)');
        bx.fillStyle=n;bx.fillRect(0,0,W,H);
      });
      for(const s of stars){const tw=0.6+Math.sin(t*s.ts+s.tp)*0.4,a=s.b*tw,x=s.x*W,y=s.y*H;
        const c=s.tp>Math.PI?P:s.s>0.9?S:[195,190,215];
        bx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${a})`;bx.fillRect(Math.round(x),Math.round(y),s.s>1?1.5:1,s.s>1?1.5:1);
        if(s.s>1.1&&a>0.25){bx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${a*0.15})`;bx.fillRect(Math.round(x)-1,Math.round(y),3,1);bx.fillRect(Math.round(x),Math.round(y)-1,1,3)}}
      requestAnimationFrame(renderBg);
    }
    renderBg();

    // ── Icons: HUD-instrument style — bright, glowing, detailed ──
    function drawIcon(cv, type) {
      const ctx = cv.getContext('2d');
      const s = cv.width, u = s/80;
      ctx.clearRect(0,0,s,s);
      const cx=s/2, cy=s/2;

      function glow(c,blur,a=0.5){ctx.shadowColor=`rgba(${c[0]},${c[1]},${c[2]},${a})`;ctx.shadowBlur=blur}
      function noGlow(){ctx.shadowColor='transparent';ctx.shadowBlur=0}

      switch(type){
        case 'play':{
          // Outer rotating ring with tick marks
          glow(S,10,0.2);
          ctx.strokeStyle=sc(0.2);ctx.lineWidth=u*0.8;
          ctx.beginPath();ctx.arc(cx,cy,u*30,0,Math.PI*2);ctx.stroke();
          noGlow();
          // Tick marks (every 30°)
          for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2,major=i%3===0;
            ctx.strokeStyle=major?sc(0.4):pc(0.1);ctx.lineWidth=major?u*1:u*0.5;
            ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*u*27,cy+Math.sin(a)*u*27);
            ctx.lineTo(cx+Math.cos(a)*u*(major?32:30),cy+Math.sin(a)*u*(major?32:30));ctx.stroke()}
          // Inner circle
          ctx.strokeStyle=pc(0.15);ctx.lineWidth=u*0.6;
          ctx.beginPath();ctx.arc(cx,cy,u*22,0,Math.PI*2);ctx.stroke();
          // Triangle — FILLED with gradient, GLOWING
          const triGrad=ctx.createLinearGradient(cx-u*8,cy-u*12,cx+u*14,cy+u*8);
          triGrad.addColorStop(0,pc(0.2));triGrad.addColorStop(1,sc(0.15));
          ctx.fillStyle=triGrad;
          ctx.beginPath();ctx.moveTo(cx-u*8,cy-u*12);ctx.lineTo(cx+u*14,cy);ctx.lineTo(cx-u*8,cy+u*12);ctx.closePath();
          ctx.fill();
          glow(S,12,0.4);
          ctx.strokeStyle=sc(0.7);ctx.lineWidth=u*1.2;ctx.stroke();
          noGlow();
          // Inner triangle echo
          ctx.strokeStyle=pc(0.2);ctx.lineWidth=u*0.5;
          ctx.beginPath();ctx.moveTo(cx-u*4,cy-u*7);ctx.lineTo(cx+u*8,cy);ctx.lineTo(cx-u*4,cy+u*7);ctx.closePath();ctx.stroke();
          // Center bright dot
          glow(S,8,0.5);ctx.fillStyle=sc(0.6);ctx.beginPath();ctx.arc(cx+u*2,cy,u*1.8,0,Math.PI*2);ctx.fill();noGlow();
          break}

        case 'continue':{
          // Progress ring (thick, partial)
          ctx.strokeStyle=pc(0.08);ctx.lineWidth=u*3;ctx.lineCap='round';
          ctx.beginPath();ctx.arc(cx,cy,u*26,-Math.PI/2,Math.PI*1.5);ctx.stroke();
          glow(S,10,0.35);
          ctx.strokeStyle=sc(0.5);ctx.lineWidth=u*3;
          ctx.beginPath();ctx.arc(cx,cy,u*26,-Math.PI/2,-Math.PI/2+Math.PI*1.3);ctx.stroke();
          noGlow();
          // End cap glow
          const ea=-Math.PI/2+Math.PI*1.3;
          glow(S,10,0.5);ctx.fillStyle=sc(0.7);
          ctx.beginPath();ctx.arc(cx+Math.cos(ea)*u*26,cy+Math.sin(ea)*u*26,u*2.5,0,Math.PI*2);ctx.fill();noGlow();
          // Start cap
          ctx.fillStyle=pc(0.3);ctx.beginPath();ctx.arc(cx,cy-u*26,u*1.5,0,Math.PI*2);ctx.fill();
          // Center arrow
          glow(P,6,0.25);
          ctx.strokeStyle=pc(0.6);ctx.lineWidth=u*1.5;ctx.lineCap='round';
          ctx.beginPath();ctx.moveTo(cx-u*6,cy-u*8);ctx.lineTo(cx+u*8,cy);ctx.lineTo(cx-u*6,cy+u*8);ctx.stroke();
          noGlow();
          // Inner echo
          ctx.strokeStyle=sc(0.15);ctx.lineWidth=u*0.6;
          ctx.beginPath();ctx.moveTo(cx-u*2,cy-u*4);ctx.lineTo(cx+u*5,cy);ctx.lineTo(cx-u*2,cy+u*4);ctx.stroke();
          // Percentage
          ctx.font=`${u*6}px 'Share Tech Mono',monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillStyle=pc(0.25);ctx.fillText('65%',cx,cy+u*12);
          break}

        case 'fleet':{
          // Radar sweep circle behind
          ctx.strokeStyle=pc(0.06);ctx.lineWidth=u*0.5;
          ctx.beginPath();ctx.arc(cx,cy,u*28,0,Math.PI*2);ctx.stroke();
          ctx.beginPath();ctx.arc(cx,cy,u*20,0,Math.PI*2);ctx.stroke();
          // Grid crosshair
          ctx.strokeStyle=pc(0.05);ctx.lineWidth=u*0.4;
          ctx.beginPath();ctx.moveTo(cx-u*30,cy);ctx.lineTo(cx+u*30,cy);ctx.moveTo(cx,cy-u*30);ctx.lineTo(cx,cy+u*30);ctx.stroke();
          // Ship body
          glow(P,8,0.3);
          const shipGrad=ctx.createLinearGradient(cx,cy-u*16,cx,cy+u*10);
          shipGrad.addColorStop(0,pc(0.25));shipGrad.addColorStop(1,pc(0.08));
          ctx.fillStyle=shipGrad;
          ctx.beginPath();ctx.moveTo(cx,cy-u*16);ctx.lineTo(cx+u*5,cy-u*6);ctx.lineTo(cx+u*10,cy+u*4);
          ctx.lineTo(cx+u*4,cy+u*3);ctx.lineTo(cx+u*4,cy+u*10);ctx.lineTo(cx-u*4,cy+u*10);
          ctx.lineTo(cx-u*4,cy+u*3);ctx.lineTo(cx-u*10,cy+u*4);ctx.lineTo(cx-u*5,cy-u*6);ctx.closePath();
          ctx.fill();ctx.strokeStyle=pc(0.5);ctx.lineWidth=u*1;ctx.stroke();
          noGlow();
          // Cockpit
          glow(S,6,0.3);ctx.fillStyle=sc(0.25);
          ctx.beginPath();ctx.ellipse(cx,cy-u*6,u*2.5,u*4,0,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle=sc(0.5);ctx.lineWidth=u*0.6;ctx.stroke();noGlow();
          // Engines
          glow(S,10,0.5);ctx.fillStyle=sc(0.5);
          ctx.beginPath();ctx.ellipse(cx-u*2.5,cy+u*12,u*1.5,u*3,0,0,Math.PI*2);ctx.fill();
          ctx.beginPath();ctx.ellipse(cx+u*2.5,cy+u*12,u*1.5,u*3,0,0,Math.PI*2);ctx.fill();
          noGlow();
          // Wing detail
          ctx.strokeStyle=pc(0.15);ctx.lineWidth=u*0.4;
          ctx.beginPath();ctx.moveTo(cx-u*2,cy-u*5);ctx.lineTo(cx-u*8,cy+u*3);ctx.stroke();
          ctx.beginPath();ctx.moveTo(cx+u*2,cy-u*5);ctx.lineTo(cx+u*8,cy+u*3);ctx.stroke();
          break}

        case 'leaderboard':{
          const bW=u*10, gap=u*3;
          const bx=[cx-bW-gap/2, cx-bW/2, cx+gap/2];
          const bh=[u*18, u*28, u*13];
          const base=cy+u*16;
          for(let i=0;i<3;i++){
            const top=base-bh[i], isFirst=i===1;
            const col=isFirst?S:P;
            const grad=ctx.createLinearGradient(bx[i],top,bx[i],base);
            grad.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},${isFirst?0.3:0.15})`);
            grad.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0.03)`);
            ctx.fillStyle=grad;ctx.fillRect(bx[i],top,bW,bh[i]);
            glow(col,isFirst?8:4,isFirst?0.3:0.15);
            ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${isFirst?0.5:0.25})`;
            ctx.lineWidth=u*0.8;ctx.strokeRect(bx[i],top,bW,bh[i]);
            noGlow();
            // Top bright line
            ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${isFirst?0.6:0.3})`;
            ctx.lineWidth=u*0.6;ctx.beginPath();ctx.moveTo(bx[i],top);ctx.lineTo(bx[i]+bW,top);ctx.stroke();
            // Horizontal segment lines
            ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},0.06)`;ctx.lineWidth=u*0.3;
            for(let sy=top+u*4;sy<base;sy+=u*4){ctx.beginPath();ctx.moveTo(bx[i]+u*1,sy);ctx.lineTo(bx[i]+bW-u*1,sy);ctx.stroke()}
            // Rank
            ctx.font=`${u*5}px 'Orbitron',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${isFirst?0.6:0.3})`;
            ctx.fillText(['3','1','2'][i],bx[i]+bW/2,top+u*5);
          }
          // Crown
          glow(S,8,0.35);ctx.strokeStyle=sc(0.6);ctx.lineWidth=u*1;ctx.lineCap='round';
          const crY=base-bh[1]-u*4;
          ctx.beginPath();ctx.moveTo(cx-u*4,crY);ctx.lineTo(cx-u*4,crY-u*5);ctx.lineTo(cx-u*1.5,crY-u*2.5);
          ctx.lineTo(cx,crY-u*6);ctx.lineTo(cx+u*1.5,crY-u*2.5);ctx.lineTo(cx+u*4,crY-u*5);ctx.lineTo(cx+u*4,crY);ctx.stroke();
          // Crown gem
          ctx.fillStyle=sc(0.5);ctx.beginPath();ctx.arc(cx,crY-u*5.5,u*1,0,Math.PI*2);ctx.fill();
          noGlow();
          // Base line
          ctx.strokeStyle=pc(0.15);ctx.lineWidth=u*0.5;ctx.beginPath();ctx.moveTo(cx-u*22,base);ctx.lineTo(cx+u*22,base);ctx.stroke();
          break}

        case 'settings':{
          // Outer dashed ring
          ctx.setLineDash([u*3,u*4]);ctx.strokeStyle=pc(0.1);ctx.lineWidth=u*0.5;
          ctx.beginPath();ctx.arc(cx,cy,u*32,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
          // Gear
          const teeth=8,or=u*22,ir=u*16,tw=Math.PI/teeth*0.4;
          ctx.beginPath();
          for(let i=0;i<teeth;i++){const a=(i/teeth)*Math.PI*2-Math.PI/2;
            ctx.lineTo(cx+Math.cos(a-tw)*ir,cy+Math.sin(a-tw)*ir);ctx.lineTo(cx+Math.cos(a-tw*0.7)*or,cy+Math.sin(a-tw*0.7)*or);
            ctx.lineTo(cx+Math.cos(a+tw*0.7)*or,cy+Math.sin(a+tw*0.7)*or);ctx.lineTo(cx+Math.cos(a+tw)*ir,cy+Math.sin(a+tw)*ir)}
          ctx.closePath();
          const gearGrad=ctx.createRadialGradient(cx-u*5,cy-u*5,0,cx,cy,or);
          gearGrad.addColorStop(0,pc(0.12));gearGrad.addColorStop(1,pc(0.03));
          ctx.fillStyle=gearGrad;ctx.fill();
          glow(P,8,0.25);ctx.strokeStyle=pc(0.45);ctx.lineWidth=u*0.8;ctx.stroke();noGlow();
          // Inner ring
          ctx.strokeStyle=pc(0.2);ctx.lineWidth=u*0.5;ctx.beginPath();ctx.arc(cx,cy,u*10,0,Math.PI*2);ctx.stroke();
          // Center
          glow(S,8,0.3);ctx.fillStyle=sc(0.2);ctx.beginPath();ctx.arc(cx,cy,u*6,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle=sc(0.45);ctx.lineWidth=u*0.7;ctx.stroke();noGlow();
          // Center dot
          glow(S,5,0.4);ctx.fillStyle=sc(0.5);ctx.beginPath();ctx.arc(cx,cy,u*2,0,Math.PI*2);ctx.fill();noGlow();
          // Spokes
          for(let i=0;i<4;i++){const a=(i/4)*Math.PI*2+Math.PI/8;ctx.strokeStyle=pc(0.1);ctx.lineWidth=u*0.4;
            ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*u*10.5,cy+Math.sin(a)*u*10.5);ctx.lineTo(cx+Math.cos(a)*u*15,cy+Math.sin(a)*u*15);ctx.stroke()}
          break}

        case 'quit':{
          // Door frame with depth
          const doorGrad=ctx.createLinearGradient(cx-u*12,cy,cx+u*4,cy);
          doorGrad.addColorStop(0,pc(0.08));doorGrad.addColorStop(1,pc(0.02));
          ctx.fillStyle=doorGrad;ctx.fillRect(cx-u*12,cy-u*16,u*16,u*32);
          glow(P,4,0.15);ctx.strokeStyle=pc(0.35);ctx.lineWidth=u*0.8;ctx.strokeRect(cx-u*12,cy-u*16,u*16,u*32);noGlow();
          // Door panels
          ctx.strokeStyle=pc(0.1);ctx.lineWidth=u*0.4;
          ctx.strokeRect(cx-u*10,cy-u*13,u*12,u*11);ctx.strokeRect(cx-u*10,cy+u*1,u*12,u*11);
          // Handle
          glow(S,5,0.3);ctx.fillStyle=sc(0.4);ctx.beginPath();ctx.arc(cx+u*2,cy,u*1.5,0,Math.PI*2);ctx.fill();noGlow();
          // EXIT arrow — big, glowing, punchy
          glow(S,14,0.5);
          ctx.strokeStyle=sc(0.7);ctx.lineWidth=u*1.8;ctx.lineCap='round';
          ctx.beginPath();ctx.moveTo(cx+u*6,cy);ctx.lineTo(cx+u*20,cy);ctx.stroke();
          ctx.beginPath();ctx.moveTo(cx+u*16,cy-u*5);ctx.lineTo(cx+u*21,cy);ctx.lineTo(cx+u*16,cy+u*5);ctx.stroke();
          noGlow();
          // Motion trails
          ctx.strokeStyle=sc(0.15);ctx.lineWidth=u*0.5;
          ctx.beginPath();ctx.moveTo(cx+u*8,cy-u*3);ctx.lineTo(cx+u*13,cy-u*3);ctx.stroke();
          ctx.beginPath();ctx.moveTo(cx+u*9,cy+u*3);ctx.lineTo(cx+u*14,cy+u*3);ctx.stroke();
          ctx.beginPath();ctx.moveTo(cx+u*7,cy-u*6);ctx.lineTo(cx+u*11,cy-u*6);ctx.stroke();
          break}
      }
    }

    document.querySelectorAll('.menu-btn').forEach(b=>{
      const c=b.querySelector('canvas');if(c)drawIcon(c,b.dataset.icon);
      b.addEventListener('mouseenter',()=>{if(!c)return;drawIcon(c,b.dataset.icon)});
      b.addEventListener('mouseleave',()=>{if(!c)return;drawIcon(c,b.dataset.icon)});
    });

    // ── Logo ──
    const lC=document.getElementById('logoCanvas'),lx=lC.getContext('2d'),ls=lC.width,lu=ls/120;
    lx.strokeStyle=sc(0.2);lx.lineWidth=lu*1;
    lx.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/2,r=lu*45;i===0?lx.moveTo(ls/2+Math.cos(a)*r,ls/2+Math.sin(a)*r):lx.lineTo(ls/2+Math.cos(a)*r,ls/2+Math.sin(a)*r)}lx.closePath();lx.stroke();
    lx.strokeStyle=pc(0.1);lx.lineWidth=lu*0.5;
    lx.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2,r=lu*33;i===0?lx.moveTo(ls/2+Math.cos(a)*r,ls/2+Math.sin(a)*r):lx.lineTo(ls/2+Math.cos(a)*r,ls/2+Math.sin(a)*r)}lx.closePath();lx.stroke();
    lx.shadowColor=sc(0.3);lx.shadowBlur=10;lx.strokeStyle=sc(0.5);lx.lineWidth=lu*2;lx.lineCap='round';
    lx.beginPath();lx.moveTo(ls/2-lu*14,ls/2-lu*12);lx.lineTo(ls/2,ls/2+lu*10);lx.lineTo(ls/2+lu*14,ls/2-lu*12);lx.stroke();
    lx.shadowBlur=0;
    lx.shadowColor=sc(0.3);lx.shadowBlur=6;lx.fillStyle=sc(0.4);lx.beginPath();lx.arc(ls/2,ls/2+lu*12,lu*3,0,Math.PI*2);lx.fill();lx.shadowBlur=0;
  </script>
</body>
