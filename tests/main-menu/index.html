<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOID SECTOR — Main Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #06050a;
      color: #c8c0d0;
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas#bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

    .menu-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      padding: 0 24px;
    }

    /* ── Logo / Title ── */
    .logo-mark {
      width: 50px;
      height: 50px;
      margin-bottom: 12px;
      position: relative;
    }
    .logo-mark canvas { width: 100%; height: 100%; }

    .game-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 12px;
      color: #e8e2f0;
      text-align: center;
      margin-bottom: 2px;
      text-shadow: 0 0 40px rgba(180, 160, 220, 0.15), 0 0 80px rgba(140, 120, 200, 0.06);
    }

    .game-subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 8px;
      color: rgba(160, 140, 190, 0.4);
      text-align: center;
      margin-bottom: 48px;
    }

    /* ── Menu Buttons ── */
    .menu-items { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-bottom: 48px; }

    .menu-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: transparent;
      border: 1px solid rgba(160, 140, 200, 0.08);
      color: rgba(200, 190, 220, 0.55);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      overflow: hidden;
    }

    .menu-btn::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0px;
      background: linear-gradient(90deg, rgba(160, 140, 220, 0.08), transparent);
      transition: width 0.3s ease;
    }

    .menu-btn:hover {
      border-color: rgba(160, 140, 200, 0.25);
      color: rgba(220, 210, 240, 0.9);
      background: rgba(160, 140, 200, 0.03);
    }

    .menu-btn:hover::before { width: 100%; }

    .menu-btn:hover .btn-icon { opacity: 0.8; }
    .menu-btn:hover .btn-arrow { opacity: 0.5; transform: translateX(3px); }

    .menu-btn.primary {
      border-color: rgba(160, 140, 200, 0.18);
      color: rgba(220, 210, 240, 0.75);
    }
    .menu-btn.primary:hover {
      border-color: rgba(180, 160, 230, 0.35);
      color: #e8e0f5;
      box-shadow: 0 0 20px rgba(160, 140, 220, 0.06), inset 0 0 20px rgba(160, 140, 220, 0.03);
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      opacity: 0.35;
      transition: opacity 0.3s;
      flex-shrink: 0;
    }
    .btn-icon canvas { width: 100%; height: 100%; }

    .btn-label { flex: 1; }

    .btn-arrow {
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      color: rgba(160, 140, 200, 0.4);
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
    }
    .footer-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: rgba(120, 110, 140, 0.3);
      letter-spacing: 2px;
    }

    /* ── Corner frame ── */
    .corner { position: fixed; z-index: 1; }
    .corner svg { width: 40px; height: 40px; }
    .corner-tl { top: 20px; left: 20px; }
    .corner-tr { top: 20px; right: 20px; transform: scaleX(-1); }
    .corner-bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
    .corner-br { bottom: 20px; right: 20px; transform: scale(-1, -1); }

    /* ── Subtle scan line overlay ── */
    .scanlines {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.03) 0px,
        rgba(0,0,0,0.03) 1px,
        transparent 1px,
        transparent 3px
      );
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="scanlines"></div>

  <!-- Corner brackets -->
  <div class="corner corner-tl"><svg viewBox="0 0 40 40"><path d="M1 30 L1 1 L30 1" stroke="rgba(150,135,190,0.12)" stroke-width="1" fill="none"/><circle cx="1" cy="1" r="1.5" fill="rgba(150,135,190,0.15)"/></svg></div>
  <div class="corner corner-tr"><svg viewBox="0 0 40 40"><path d="M1 30 L1 1 L30 1" stroke="rgba(150,135,190,0.12)" stroke-width="1" fill="none"/><circle cx="1" cy="1" r="1.5" fill="rgba(150,135,190,0.15)"/></svg></div>
  <div class="corner corner-bl"><svg viewBox="0 0 40 40"><path d="M1 30 L1 1 L30 1" stroke="rgba(150,135,190,0.12)" stroke-width="1" fill="none"/><circle cx="1" cy="1" r="1.5" fill="rgba(150,135,190,0.15)"/></svg></div>
  <div class="corner corner-br"><svg viewBox="0 0 40 40"><path d="M1 30 L1 1 L30 1" stroke="rgba(150,135,190,0.12)" stroke-width="1" fill="none"/><circle cx="1" cy="1" r="1.5" fill="rgba(150,135,190,0.15)"/></svg></div>

  <div class="menu-container">
    <div class="logo-mark"><canvas id="logoCanvas" width="80" height="80"></canvas></div>
    <div class="game-title">VOID SECTOR</div>
    <div class="game-subtitle">BEYOND THE RIM</div>

    <div class="menu-items">
      <button class="menu-btn primary" data-icon="play">
        <span class="btn-icon"><canvas width="40" height="40"></canvas></span>
        <span class="btn-label">New Campaign</span>
        <span class="btn-arrow">›</span>
      </button>
      <button class="menu-btn" data-icon="continue">
        <span class="btn-icon"><canvas width="40" height="40"></canvas></span>
        <span class="btn-label">Continue</span>
        <span class="btn-arrow">›</span>
      </button>
      <button class="menu-btn" data-icon="fleet">
        <span class="btn-icon"><canvas width="40" height="40"></canvas></span>
        <span class="btn-label">Fleet Manager</span>
        <span class="btn-arrow">›</span>
      </button>
      <button class="menu-btn" data-icon="leaderboard">
        <span class="btn-icon"><canvas width="40" height="40"></canvas></span>
        <span class="btn-label">Leaderboard</span>
        <span class="btn-arrow">›</span>
      </button>
      <button class="menu-btn" data-icon="settings">
        <span class="btn-icon"><canvas width="40" height="40"></canvas></span>
        <span class="btn-label">Settings</span>
        <span class="btn-arrow">›</span>
      </button>
      <button class="menu-btn" data-icon="quit">
        <span class="btn-icon"><canvas width="40" height="40"></canvas></span>
        <span class="btn-label">Quit to Desktop</span>
        <span class="btn-arrow">›</span>
      </button>
    </div>

    <div class="footer">
      <span class="footer-text">v0.4.1 // BUILD 2847</span>
      <span class="footer-text">© 2026 VOID INTERACTIVE</span>
    </div>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════
    // ANIMATED BACKGROUND — atmospheric depth
    // ══════════════════════════════════════════════════════════════════

    const bg = document.getElementById('bg');
    const bCtx = bg.getContext('2d');
    let W, H;

    function resizeBg() {
      W = bg.width = window.innerWidth;
      H = bg.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    // Stars (static, drawn once per resize)
    const stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random(), y: Math.random(),
        size: 0.3 + Math.random() * 1.2,
        brightness: 0.15 + Math.random() * 0.4,
        twinkleSpeed: 0.5 + Math.random() * 2,
        twinklePhase: Math.random() * Math.PI * 2,
      });
    }

    let time = 0;
    function renderBg() {
      time += 1/60;

      // Deep space gradient
      const grad = bCtx.createRadialGradient(W*0.5, H*0.4, 0, W*0.5, H*0.4, W*0.7);
      grad.addColorStop(0, '#0d0b14');
      grad.addColorStop(0.5, '#08070c');
      grad.addColorStop(1, '#050408');
      bCtx.fillStyle = grad;
      bCtx.fillRect(0, 0, W, H);

      // Subtle nebula glow (very faint, shifts slowly)
      const nebX = W * 0.4 + Math.sin(time * 0.1) * 50;
      const nebY = H * 0.35 + Math.cos(time * 0.08) * 30;
      const neb = bCtx.createRadialGradient(nebX, nebY, 0, nebX, nebY, W * 0.35);
      neb.addColorStop(0, 'rgba(80, 50, 120, 0.025)');
      neb.addColorStop(0.5, 'rgba(50, 30, 90, 0.012)');
      neb.addColorStop(1, 'rgba(0,0,0,0)');
      bCtx.fillStyle = neb;
      bCtx.fillRect(0, 0, W, H);

      // Stars with twinkle
      for (const star of stars) {
        const twinkle = 0.6 + Math.sin(time * star.twinkleSpeed + star.twinklePhase) * 0.4;
        const alpha = star.brightness * twinkle;
        const x = star.x * W, y = star.y * H;

        bCtx.fillStyle = `rgba(200, 195, 220, ${alpha})`;
        bCtx.fillRect(Math.round(x), Math.round(y), star.size > 1 ? 1.5 : 1, star.size > 1 ? 1.5 : 1);

        // Larger stars get a subtle cross
        if (star.size > 1 && alpha > 0.3) {
          bCtx.fillStyle = `rgba(200, 195, 220, ${alpha * 0.2})`;
          bCtx.fillRect(Math.round(x) - 1, Math.round(y), 3, 1);
          bCtx.fillRect(Math.round(x), Math.round(y) - 1, 1, 3);
        }
      }

      // Slow-moving dust particles
      bCtx.fillStyle = 'rgba(180, 160, 210, 0.06)';
      for (let i = 0; i < 15; i++) {
        const px = ((i * 137.5 + time * 3) % W);
        const py = ((i * 89.3 + time * 1.5 + Math.sin(time * 0.3 + i) * 20) % H);
        bCtx.beginPath();
        bCtx.arc(px, py, 0.8, 0, Math.PI * 2);
        bCtx.fill();
      }

      requestAnimationFrame(renderBg);
    }
    renderBg();

    // ══════════════════════════════════════════════════════════════════
    // ICONS — generated on canvas, sleek thin-line style
    // ══════════════════════════════════════════════════════════════════

    function drawIcon(canvas, type) {
      const ctx = canvas.getContext('2d');
      const s = canvas.width;
      const u = s / 40;
      ctx.clearRect(0, 0, s, s);

      ctx.strokeStyle = 'rgba(180, 165, 220, 0.65)';
      ctx.fillStyle = 'rgba(180, 165, 220, 0.65)';
      ctx.lineWidth = u * 1.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = s/2, cy = s/2;

      switch(type) {
        case 'play':
          // Play triangle
          ctx.beginPath();
          ctx.moveTo(cx - u*4, cy - u*6);
          ctx.lineTo(cx + u*6, cy);
          ctx.lineTo(cx - u*4, cy + u*6);
          ctx.closePath();
          ctx.fillStyle = 'rgba(180, 165, 220, 0.12)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(180, 165, 220, 0.5)';
          ctx.stroke();
          break;

        case 'continue':
          // Two stacked arrows
          ctx.beginPath();
          ctx.moveTo(cx - u*3, cy - u*2);
          ctx.lineTo(cx + u*3, cy - u*2);
          ctx.moveTo(cx + u*1, cy - u*5);
          ctx.lineTo(cx + u*4, cy - u*2);
          ctx.lineTo(cx + u*1, cy + u*1);
          ctx.stroke();
          // Progress bar beneath
          ctx.fillStyle = 'rgba(180, 165, 220, 0.12)';
          ctx.fillRect(cx - u*5, cy + u*4, u*10, u*1.5);
          ctx.fillStyle = 'rgba(180, 165, 220, 0.35)';
          ctx.fillRect(cx - u*5, cy + u*4, u*6, u*1.5);
          break;

        case 'fleet':
          // Small ship silhouette
          ctx.beginPath();
          ctx.moveTo(cx, cy - u*5);
          ctx.lineTo(cx + u*5, cy + u*3);
          ctx.lineTo(cx + u*2, cy + u*2);
          ctx.lineTo(cx + u*2, cy + u*5);
          ctx.lineTo(cx - u*2, cy + u*5);
          ctx.lineTo(cx - u*2, cy + u*2);
          ctx.lineTo(cx - u*5, cy + u*3);
          ctx.closePath();
          ctx.fillStyle = 'rgba(180, 165, 220, 0.08)';
          ctx.fill();
          ctx.stroke();
          break;

        case 'leaderboard':
          // Three bars
          const bars = [[-u*4, u*7], [0, u*10], [u*4, u*5]];
          for (const [bx, bh] of bars) {
            ctx.fillStyle = 'rgba(180, 165, 220, 0.08)';
            ctx.fillRect(cx + bx - u*1.5, cy + u*5 - bh, u*3, bh);
            ctx.strokeRect(cx + bx - u*1.5, cy + u*5 - bh, u*3, bh);
          }
          // Crown on tallest
          ctx.fillStyle = 'rgba(180, 165, 220, 0.3)';
          ctx.beginPath();
          ctx.moveTo(cx - u*1.5, cy - u*5.5);
          ctx.lineTo(cx - u*1.5, cy - u*7);
          ctx.lineTo(cx - u*0.5, cy - u*6);
          ctx.lineTo(cx, cy - u*8);
          ctx.lineTo(cx + u*0.5, cy - u*6);
          ctx.lineTo(cx + u*1.5, cy - u*7);
          ctx.lineTo(cx + u*1.5, cy - u*5.5);
          ctx.closePath();
          ctx.fill();
          break;

        case 'settings':
          // Gear
          const teeth = 6, or = u*6, ir = u*4;
          ctx.beginPath();
          for (let i = 0; i < teeth; i++) {
            const a = (i/teeth) * Math.PI * 2 - Math.PI/2;
            const tw = Math.PI / teeth * 0.5;
            ctx.lineTo(cx + Math.cos(a-tw)*ir, cy + Math.sin(a-tw)*ir);
            ctx.lineTo(cx + Math.cos(a-tw)*or, cy + Math.sin(a-tw)*or);
            ctx.lineTo(cx + Math.cos(a+tw)*or, cy + Math.sin(a+tw)*or);
            ctx.lineTo(cx + Math.cos(a+tw)*ir, cy + Math.sin(a+tw)*ir);
          }
          ctx.closePath();
          ctx.fillStyle = 'rgba(180, 165, 220, 0.06)';
          ctx.fill();
          ctx.stroke();
          // Center
          ctx.beginPath();
          ctx.arc(cx, cy, u*2, 0, Math.PI*2);
          ctx.stroke();
          break;

        case 'quit':
          // Door with arrow
          ctx.strokeRect(cx - u*4, cy - u*5, u*6, u*10);
          ctx.beginPath();
          ctx.moveTo(cx + u*1, cy);
          ctx.lineTo(cx + u*6, cy);
          ctx.moveTo(cx + u*4, cy - u*2.5);
          ctx.lineTo(cx + u*6, cy);
          ctx.lineTo(cx + u*4, cy + u*2.5);
          ctx.stroke();
          break;
      }
    }

    // Draw all button icons
    document.querySelectorAll('.menu-btn').forEach(btn => {
      const canvas = btn.querySelector('canvas');
      if (canvas) drawIcon(canvas, btn.dataset.icon);
    });

    // ══════════════════════════════════════════════════════════════════
    // LOGO MARK — geometric emblem
    // ══════════════════════════════════════════════════════════════════

    const logoC = document.getElementById('logoCanvas');
    const lCtx = logoC.getContext('2d');
    const ls = logoC.width;
    const lu = ls / 80;

    // Hexagonal frame
    lCtx.strokeStyle = 'rgba(170, 150, 210, 0.25)';
    lCtx.lineWidth = lu * 1;
    lCtx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
      const r = lu * 32;
      const x = ls/2 + Math.cos(a) * r, y = ls/2 + Math.sin(a) * r;
      i === 0 ? lCtx.moveTo(x, y) : lCtx.lineTo(x, y);
    }
    lCtx.closePath();
    lCtx.stroke();

    // Inner diamond
    lCtx.strokeStyle = 'rgba(170, 150, 210, 0.18)';
    lCtx.lineWidth = lu * 0.8;
    const id = lu * 18;
    lCtx.beginPath();
    lCtx.moveTo(ls/2, ls/2 - id); lCtx.lineTo(ls/2 + id, ls/2);
    lCtx.lineTo(ls/2, ls/2 + id); lCtx.lineTo(ls/2 - id, ls/2);
    lCtx.closePath();
    lCtx.stroke();

    // V shape (for "Void")
    lCtx.strokeStyle = 'rgba(190, 170, 230, 0.45)';
    lCtx.lineWidth = lu * 1.5;
    lCtx.lineCap = 'round';
    lCtx.beginPath();
    lCtx.moveTo(ls/2 - lu*10, ls/2 - lu*8);
    lCtx.lineTo(ls/2, ls/2 + lu*8);
    lCtx.lineTo(ls/2 + lu*10, ls/2 - lu*8);
    lCtx.stroke();

    // Center dot
    lCtx.fillStyle = 'rgba(190, 170, 230, 0.3)';
    lCtx.beginPath();
    lCtx.arc(ls/2, ls/2 + lu*8, lu*2, 0, Math.PI*2);
    lCtx.fill();

    // ══════════════════════════════════════════════════════════════════
    // BUTTON HOVER SOUND SIMULATION (visual feedback)
    // ══════════════════════════════════════════════════════════════════

    document.querySelectorAll('.menu-btn').forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        // Redraw icon brighter on hover
        const canvas = btn.querySelector('canvas');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const origStroke = 'rgba(180, 165, 220, 0.65)';
          drawIcon(canvas, btn.dataset.icon);
          // Add glow layer
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.filter = 'blur(3px)';
          ctx.globalAlpha = 0.15;
          ctx.drawImage(canvas, 0, 0);
          ctx.restore();
        }
      });
      btn.addEventListener('mouseleave', () => {
        const canvas = btn.querySelector('canvas');
        if (canvas) drawIcon(canvas, btn.dataset.icon);
      });
    });
  </script>
</body>
</html>
