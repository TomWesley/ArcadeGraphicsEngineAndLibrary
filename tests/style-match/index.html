<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Engine - Style Analysis (v2 Rich Pixel Art)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#1a1530;color:#fff;font-family:'Press Start 2P',monospace;padding:16px;display:flex;flex-direction:column;align-items:center}
    h1{font-size:11px;color:#e8a0ff;text-shadow:0 0 8px rgba(232,160,255,0.4);margin-bottom:4px}
    .sub{font-size:7px;color:#777;margin-bottom:16px;text-align:center;max-width:800px;line-height:1.8}
    .compare{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;align-items:start}
    .panel{background:rgba(255,255,255,0.02);border:1px solid #2a2540;padding:12px;text-align:center}
    .panel h3{font-size:8px;color:#999;margin-bottom:8px}
    .panel canvas{border:1px solid #1a1530;image-rendering:pixelated;display:block;margin:0 auto 6px}
    .panel .info{font-size:5px;color:#666;line-height:1.6}
    .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;align-items:center}
    .ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
    .ctrl label{font-size:5px;color:#555}
    .ctrl span{font-size:5px;color:#777}
    input[type=range]{width:80px;accent-color:#e8a0ff}
    .recolor-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
    .recolor-card{text-align:center}
    .recolor-card canvas{border:1px solid #2a2540;image-rendering:pixelated;display:block;margin-bottom:3px}
    .recolor-card .label{font-size:5px;color:#777}
    #status{font-size:7px;color:#88dd88;text-shadow:0 0 4px rgba(136,221,136,0.3);margin:8px 0}
    .tab-row{display:flex;gap:4px;margin-bottom:12px}
    .tab{background:transparent;border:1px solid #333;color:#888;font-family:'Press Start 2P',monospace;font-size:6px;padding:5px 10px;cursor:pointer}
    .tab:hover,.tab.active{border-color:#e8a0ff;color:#e8a0ff;text-shadow:0 0 6px rgba(232,160,255,0.4)}
    .analysis{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin:10px 0}
    .stat{background:rgba(255,255,255,0.02);border:1px solid #222;padding:6px;text-align:center}
    .stat .val{font-size:10px;color:#e8a0ff;margin-bottom:2px}
    .stat .lbl{font-size:5px;color:#666}
  </style>
</head>
<body>
  <h1>STYLE ANALYSIS v2: RICH PIXEL ART</h1>
  <p class="sub">
    Analyzing reference art for color density, shading depth, and material richness.
    The engine recolors while preserving all detail — warm highlights, cool shadows, per-pixel precision.
  </p>

  <div class="tab-row">
    <button class="tab active" data-src="pixel">PIXEL ART CHARACTERS</button>
    <button class="tab" data-src="alien">NEON ALIEN (GLOW)</button>
  </div>

  <div class="controls">
    <div class="ctrl"><label>HUE SHIFT</label><input type="range" id="hueShift" min="-180" max="180" value="0"><span id="hueShiftV">0</span></div>
    <div class="ctrl"><label>SATURATION</label><input type="range" id="satMod" min="50" max="150" value="100"><span id="satModV">100%</span></div>
    <div class="ctrl"><label>WARM HIGHLIGHTS</label><input type="range" id="warmHL" min="0" max="40" value="15"><span id="warmHLV">15</span></div>
    <div class="ctrl"><label>COOL SHADOWS</label><input type="range" id="coolSH" min="0" max="50" value="25"><span id="coolSHV">25</span></div>
    <div class="ctrl"><label>GLOW (tactical)</label><input type="range" id="glowAmt" min="0" max="100" value="0"><span id="glowAmtV">0%</span></div>
  </div>

  <div class="compare" id="mainView"></div>

  <h3 style="font-size:8px;color:#888;margin:12px 0 8px">HUE SHIFT VARIANTS</h3>
  <div class="recolor-row" id="variants"></div>

  <h3 style="font-size:8px;color:#888;margin:12px 0 8px">COLOR ANALYSIS</h3>
  <div class="analysis" id="analysis"></div>

  <p id="status">Loading references...</p>

  <script>
    // ── Core ──
    function css(c){return`rgba(${c[0]},${c[1]},${c[2]},${c[3]??1})`}
    function hsl2rgb(h,s,l){s/=100;l/=100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
    function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=((g-b)/d+(g<b?6:0))*60;else if(mx===g)h=((b-r)/d+2)*60;else h=((r-g)/d+4)*60}return[h,s*100,l*100]}

    // Gaussian blur (for tactical glow)
    function gk(r){const s=r*2+1,k=new Float64Array(s),sig=Math.max(r/3,0.5),s2=2*sig*sig;let sum=0;for(let i=0;i<s;i++){const x=i-r;k[i]=Math.exp(-(x*x)/s2);sum+=k[i]}for(let i=0;i<s;i++)k[i]/=sum;return k}
    function gblur(d,w,h,radius){if(radius<1)return new Uint8ClampedArray(d);const r=Math.round(radius),k=gk(r);const t=new Float64Array(w*h*4),o=new Float64Array(w*h*4);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let rr=0,gg=0,bb=0,aa=0;for(let j=-r;j<=r;j++){const sx=Math.max(0,Math.min(w-1,x+j)),si=(y*w+sx)*4,wt=k[j+r];rr+=d[si]*wt;gg+=d[si+1]*wt;bb+=d[si+2]*wt;aa+=d[si+3]*wt}const di=(y*w+x)*4;t[di]=rr;t[di+1]=gg;t[di+2]=bb;t[di+3]=aa}for(let x=0;x<w;x++)for(let y=0;y<h;y++){let rr=0,gg=0,bb=0,aa=0;for(let j=-r;j<=r;j++){const sy=Math.max(0,Math.min(h-1,y+j)),si=(sy*w+x)*4,wt=k[j+r];rr+=t[si]*wt;gg+=t[si+1]*wt;bb+=t[si+2]*wt;aa+=t[si+3]*wt}const di=(y*w+x)*4;o[di]=rr;o[di+1]=gg;o[di+2]=bb;o[di+3]=aa}const dst=new Uint8ClampedArray(d.length);for(let i=0;i<dst.length;i++)dst[i]=Math.max(0,Math.min(255,Math.round(o[i])));return dst}

    // ── Rich recolor: hue shift with warm highlights + cool shadows ──
    function richRecolor(srcData, w, h, opts) {
      const { hueShift=0, satMod=1, warmHL=15, coolSH=25, bgThresh=15 } = opts;
      const dst = new Uint8ClampedArray(srcData.length);

      for (let i = 0; i < srcData.length; i += 4) {
        const r = srcData[i], g = srcData[i+1], b = srcData[i+2], a = srcData[i+3];
        if (a < bgThresh) { dst[i+3] = a; continue; }

        let [h, s, l] = rgb2hsl(r, g, b);

        // Hue shift
        h = (h + hueShift + 360) % 360;

        // Saturation mod
        s = Math.max(0, Math.min(100, s * satMod / 100));

        // Warm highlights: shift bright pixels toward yellow
        const lNorm = l / 100;
        if (lNorm > 0.5) {
          const warmT = (lNorm - 0.5) * 2; // 0-1 for upper half
          h = (h + warmHL * warmT + 360) % 360;
          s = Math.max(0, s - warmT * 15); // desaturate highlights slightly
        }

        // Cool shadows: shift dark pixels toward blue/purple
        if (lNorm < 0.4) {
          const coolT = (0.4 - lNorm) / 0.4;
          h = (h - coolSH * coolT + 360) % 360;
          s = Math.min(100, s + coolT * 8);
        }

        const [nr, ng, nb] = hsl2rgb(h, s, l);
        dst[i] = nr; dst[i+1] = ng; dst[i+2] = nb; dst[i+3] = a;
      }
      return dst;
    }

    // ── Tactical glow overlay (for energy effects) ──
    function addTacticalGlow(data, w, h, intensity) {
      if (intensity < 0.01) return data;
      const result = new Uint8ClampedArray(data);

      // Extract bright pixels
      const bright = new Uint8ClampedArray(data.length);
      for (let i = 0; i < data.length; i += 4) {
        const lum = data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
        if (lum > 180) { bright[i]=data[i]; bright[i+1]=data[i+1]; bright[i+2]=data[i+2]; bright[i+3]=data[i+3]; }
      }

      // Blur and composite
      const g1 = gblur(bright, w, h, 3);
      const g2 = gblur(bright, w, h, 10);
      for (let i = 0; i < result.length; i += 4) {
        result[i] = Math.min(255, result[i] + Math.round(g1[i] * intensity * 0.5));
        result[i+1] = Math.min(255, result[i+1] + Math.round(g1[i+1] * intensity * 0.5));
        result[i+2] = Math.min(255, result[i+2] + Math.round(g1[i+2] * intensity * 0.5));
        for (let c = 0; c < 3; c++) {
          const d = result[i+c]/255, sv = (g2[i+c]/255) * intensity * 0.2;
          result[i+c] = Math.round(Math.min(1, 1-(1-d)*(1-sv)) * 255);
        }
      }
      return result;
    }

    // ── Color analysis ──
    function analyzeColors(data) {
      const uniqueColors = new Set();
      const hueBuckets = new Float64Array(12);
      const lumBuckets = new Float64Array(10);
      let totalPx = 0, satSum = 0;

      for (let i = 0; i < data.length; i += 4) {
        if (data[i+3] < 15) continue;
        totalPx++;
        const r=data[i],g=data[i+1],b=data[i+2];
        uniqueColors.add(`${r>>3},${g>>3},${b>>3}`); // quantize to ~32 levels per channel
        const [h,s,l] = rgb2hsl(r,g,b);
        satSum += s;
        if (s > 10) hueBuckets[Math.floor(h / 30) % 12]++;
        lumBuckets[Math.min(9, Math.floor(l / 10))]++;
      }

      const hueCount = hueBuckets.filter(v => v > totalPx * 0.01).length;
      return {
        totalPixels: totalPx,
        uniqueColors: uniqueColors.size,
        hueRanges: hueCount,
        avgSaturation: totalPx > 0 ? (satSum / totalPx).toFixed(0) : '0',
        hueDist: hueBuckets,
        lumDist: lumBuckets,
      };
    }

    // ── Loading ──
    let sources = {};
    let curSrc = 'pixel';
    const imgs = {
      pixel: { src: './SamplePixelArt.png', label: 'Rich Pixel Art Characters' },
      alien: { src: './GraphicsSample.png', label: 'Neon Alien (Glow Demo)' },
    };

    let loadedCount = 0;
    for (const [key, info] of Object.entries(imgs)) {
      const img = new Image();
      img.src = info.src;
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        sources[key] = ctx.getImageData(0, 0, c.width, c.height);
        loadedCount++;
        if (loadedCount === Object.keys(imgs).length) render();
      };
    }

    function getOpts() {
      const o = {
        hueShift: parseInt(document.getElementById('hueShift').value),
        satMod: parseInt(document.getElementById('satMod').value),
        warmHL: parseInt(document.getElementById('warmHL').value),
        coolSH: parseInt(document.getElementById('coolSH').value),
        glowAmt: parseInt(document.getElementById('glowAmt').value) / 100,
      };
      document.getElementById('hueShiftV').textContent = o.hueShift;
      document.getElementById('satModV').textContent = o.satMod + '%';
      document.getElementById('warmHLV').textContent = o.warmHL;
      document.getElementById('coolSHV').textContent = o.coolSH;
      document.getElementById('glowAmtV').textContent = Math.round(o.glowAmt * 100) + '%';
      return o;
    }

    function render() {
      const src = sources[curSrc];
      if (!src) return;
      const opts = getOpts();
      const w = src.width, h = src.height;

      // Main view
      const mainView = document.getElementById('mainView');
      mainView.innerHTML = '';

      // Original
      const origPanel = document.createElement('div');
      origPanel.className = 'panel';
      origPanel.innerHTML = `<h3>ORIGINAL</h3>`;
      const origCanvas = document.createElement('canvas');
      origCanvas.width = w; origCanvas.height = h;
      origCanvas.style.width = Math.min(500, w) + 'px';
      origCanvas.style.height = Math.min(300, h * (Math.min(500, w) / w)) + 'px';
      origCanvas.getContext('2d').putImageData(src, 0, 0);
      origPanel.appendChild(origCanvas);
      const origAnalysis = analyzeColors(src.data);
      origPanel.innerHTML += `<div class="info">${w}x${h} | ${origAnalysis.uniqueColors} unique colors | ${origAnalysis.hueRanges} hue ranges | avg sat ${origAnalysis.avgSaturation}%</div>`;
      mainView.appendChild(origPanel);

      // Processed
      const procPanel = document.createElement('div');
      procPanel.className = 'panel';
      procPanel.innerHTML = `<h3>ENGINE OUTPUT (hue ${opts.hueShift >= 0 ? '+' : ''}${opts.hueShift})</h3>`;
      let processed = richRecolor(src.data, w, h, opts);
      if (opts.glowAmt > 0.01) processed = addTacticalGlow(processed, w, h, opts.glowAmt);
      const procCanvas = document.createElement('canvas');
      procCanvas.width = w; procCanvas.height = h;
      procCanvas.style.width = Math.min(500, w) + 'px';
      procCanvas.style.height = Math.min(300, h * (Math.min(500, w) / w)) + 'px';
      procCanvas.getContext('2d').putImageData(new ImageData(processed, w, h), 0, 0);
      procPanel.appendChild(procCanvas);
      const procAnalysis = analyzeColors(processed);
      procPanel.innerHTML += `<div class="info">${w}x${h} | ${procAnalysis.uniqueColors} unique colors | ${procAnalysis.hueRanges} hue ranges | avg sat ${procAnalysis.avgSaturation}%</div>`;
      mainView.appendChild(procPanel);

      // Hue shift variants
      const varContainer = document.getElementById('variants');
      varContainer.innerHTML = '';
      const shifts = [-120, -90, -60, -30, 0, 30, 60, 90, 120, 150];
      for (const shift of shifts) {
        const vData = richRecolor(src.data, w, h, { ...opts, hueShift: shift });
        const card = document.createElement('div');
        card.className = 'recolor-card';
        const vc = document.createElement('canvas');
        vc.width = w; vc.height = h;
        vc.style.width = Math.min(110, w * 0.3) + 'px';
        vc.style.height = Math.min(70, h * (Math.min(110, w * 0.3) / w)) + 'px';
        vc.getContext('2d').putImageData(new ImageData(vData, w, h), 0, 0);
        card.appendChild(vc);
        const lbl = document.createElement('div');
        lbl.className = 'label';
        lbl.textContent = `${shift >= 0 ? '+' : ''}${shift}°`;
        card.appendChild(lbl);
        varContainer.appendChild(card);
      }

      // Color analysis grid
      const analysisDiv = document.getElementById('analysis');
      analysisDiv.innerHTML = '';
      const stats = [
        { val: origAnalysis.uniqueColors, lbl: 'UNIQUE COLORS (ORIG)' },
        { val: procAnalysis.uniqueColors, lbl: 'UNIQUE COLORS (OUT)' },
        { val: origAnalysis.hueRanges + '/12', lbl: 'HUE RANGES (ORIG)' },
        { val: procAnalysis.hueRanges + '/12', lbl: 'HUE RANGES (OUT)' },
        { val: origAnalysis.avgSaturation + '%', lbl: 'AVG SAT (ORIG)' },
        { val: procAnalysis.avgSaturation + '%', lbl: 'AVG SAT (OUT)' },
      ];
      for (const s of stats) {
        const d = document.createElement('div');
        d.className = 'stat';
        d.innerHTML = `<div class="val">${s.val}</div><div class="lbl">${s.lbl}</div>`;
        analysisDiv.appendChild(d);
      }

      document.getElementById('status').textContent =
        `${imgs[curSrc].label} | ${w}x${h} | Hue ${opts.hueShift >= 0 ? '+' : ''}${opts.hueShift} | Glow ${Math.round(opts.glowAmt*100)}%`;
    }

    // Event listeners
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        curSrc = t.dataset.src;
        render();
      });
    });
    document.querySelectorAll('input[type=range]').forEach(i => i.addEventListener('input', render));
  </script>
</body>
</html>
