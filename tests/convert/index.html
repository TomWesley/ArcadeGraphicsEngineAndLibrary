<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Engine - Style Universe Conversion</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#08070a;color:#ccc;font-family:'Share Tech Mono',monospace;padding:24px;display:flex;flex-direction:column;align-items:center}
    h1{font-size:13px;font-family:'Orbitron',sans-serif;color:#aaa;letter-spacing:5px;margin-bottom:6px}
    .sub{font-size:9px;color:#555;margin-bottom:20px;letter-spacing:2px;text-align:center;line-height:1.8;max-width:700px}
    .subject{margin-bottom:36px}
    .subject h2{font-size:10px;font-family:'Orbitron',sans-serif;color:#888;letter-spacing:3px;margin-bottom:10px;text-align:center}
    .panels{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:start}
    .panel{text-align:center}
    .panel h3{font-size:8px;color:#555;letter-spacing:2px;margin-bottom:6px;font-family:'Orbitron',sans-serif}
    .panel canvas{display:block;margin:0 auto;border:1px solid #1a1a1a}
    .panel .info{font-size:7px;color:#444;margin-top:4px}
    #status{font-size:9px;color:#888;margin:12px 0}
    .controls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;align-items:center;background:rgba(255,255,255,0.015);padding:12px 20px;border:1px solid #1a1a1a}
    .ctrl{display:flex;flex-direction:column;align-items:center;gap:3px}
    .ctrl label{font-size:6px;color:#555;letter-spacing:1px}
    .ctrl span{font-size:7px;color:#777}
    input[type=range]{width:90px;accent-color:#888}
  </style>
</head>
<body>
  <h1>STYLE UNIVERSE</h1>
  <p class="sub">Same transformation pipeline on every asset. Not about color — about lighting, atmosphere, depth, and finish. Everything should look like it lives in the same game.</p>

  <div class="controls">
    <div class="ctrl"><label>CONTRAST</label><input type="range" id="contrast" min="80" max="160" value="125"><span id="contrastV">1.25</span></div>
    <div class="ctrl"><label>ATMOSPHERE</label><input type="range" id="atmosphere" min="0" max="100" value="40"><span id="atmosphereV">40%</span></div>
    <div class="ctrl"><label>BLOOM</label><input type="range" id="bloom" min="0" max="100" value="35"><span id="bloomV">35%</span></div>
    <div class="ctrl"><label>RIM LIGHT</label><input type="range" id="rim" min="0" max="100" value="50"><span id="rimV">50%</span></div>
    <div class="ctrl"><label>DEPTH</label><input type="range" id="depth" min="0" max="100" value="45"><span id="depthV">45%</span></div>
    <div class="ctrl"><label>WARMTH</label><input type="range" id="warmth" min="-50" max="50" value="8"><span id="warmthV">+8</span></div>
  </div>

  <div id="output"></div>
  <p id="status">Loading assets...</p>

  <script>
    // ── Style Validator (inlined from src/style/validator.ts) ──
    function runValidator(imageData) {
      const w = imageData.width, h = imageData.height, d = imageData.data;
      const total = w * h;
      let pureBlack=0, pureWhite=0, transparent=0, darkPx=0, midPx=0, brightPx=0;
      let satSum=0, satCount=0, lumSum=0, lumSqSum=0, vis=0;
      const hueBuckets = new Float64Array(12);
      for (let i=0;i<d.length;i+=4) {
        const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];
        if(a<10){transparent++;continue}
        vis++;
        const lum=r*0.299+g*0.587+b*0.114;
        lumSum+=lum; lumSqSum+=lum*lum;
        if(r<10&&g<10&&b<10)pureBlack++;
        if(r>245&&g>245&&b>245)pureWhite++;
        if(lum<60)darkPx++;else if(lum<170)midPx++;else brightPx++;
        const rn=r/255,gn=g/255,bn=b/255,mx=Math.max(rn,gn,bn),mn=Math.min(rn,gn,bn),l=(mx+mn)/2;
        if(mx!==mn){const delta=mx-mn,s=l>0.5?delta/(2-mx-mn):delta/(mx+mn);
          satSum+=s*100;satCount++;
          let hue=0;if(mx===rn)hue=((gn-bn)/delta+(gn<bn?6:0))*60;else if(mx===gn)hue=((bn-rn)/delta+2)*60;else hue=((rn-gn)/delta+4)*60;
          if(s>0.08)hueBuckets[Math.floor(hue/30)%12]++}
      }
      if(vis<10)return{passed:false,score:0,checks:[{name:'Visibility',passed:false,score:0,detail:'Nearly empty'}],suggestions:['Image has almost no visible pixels']};
      const checks=[], suggestions=[];
      // Contrast
      const avgL=lumSum/vis,stdL=Math.sqrt(lumSqSum/vis-avgL*avgL),cr=stdL/128;
      const crOk=cr>=0.3&&cr<=0.85;
      checks.push({name:'Contrast',passed:crOk,score:crOk?100:Math.round(Math.max(0,100-Math.abs(cr-0.5)*200)),detail:`Ratio: ${cr.toFixed(3)} (0.30-0.85)`});
      if(!crOk)suggestions.push(cr<0.3?'Increase contrast':'Reduce contrast');
      // Black/white
      const bkP=(pureBlack/vis)*100,wtP=(pureWhite/vis)*100;
      checks.push({name:'Black levels',passed:bkP<=5,score:bkP<=5?100:Math.max(0,Math.round(100-(bkP-5)*10)),detail:`Pure black: ${bkP.toFixed(1)}% (max 5%)`});
      checks.push({name:'White levels',passed:wtP<=3,score:wtP<=3?100:Math.max(0,Math.round(100-(wtP-3)*10)),detail:`Pure white: ${wtP.toFixed(1)}% (max 3%)`});
      if(bkP>5)suggestions.push('Too much pure black');
      if(wtP>3)suggestions.push('Too much pure white');
      // Hue variety
      const activeH=hueBuckets.filter(v=>v>vis*0.005).length;
      checks.push({name:'Color variety',passed:activeH>=2,score:activeH>=2?Math.min(100,activeH*15):Math.round(activeH/2*100),detail:`${activeH} hue ranges (min 2)`});
      if(activeH<2)suggestions.push('Too monochromatic');
      // Brightness distribution
      const dkP=(darkPx/vis)*100,mdP=(midPx/vis)*100,brP=(brightPx/vis)*100;
      const distOk=Math.abs(dkP-45)<=20&&Math.abs(mdP-35)<=20&&Math.abs(brP-20)<=20;
      const distScore=Math.max(0,Math.round(100-(Math.max(0,Math.abs(dkP-45)-10)+Math.max(0,Math.abs(mdP-35)-10)+Math.max(0,Math.abs(brP-20)-10))*2));
      checks.push({name:'Brightness dist',passed:distOk,score:distScore,detail:`D${dkP.toFixed(0)}% M${mdP.toFixed(0)}% B${brP.toFixed(0)}% (45/35/20 ±20)`});
      if(!distOk)suggestions.push('Brightness distribution off target');
      // Saturation
      const avgS=satCount>0?satSum/satCount:0;
      const satOk=avgS>=15&&avgS<=75;
      checks.push({name:'Saturation',passed:satOk,score:satOk?100:Math.max(0,Math.round(100-Math.abs(avgS-45)*2)),detail:`Avg: ${avgS.toFixed(1)}% (15-75%)`});
      if(avgS<15)suggestions.push('Too desaturated');if(avgS>75)suggestions.push('Oversaturated');
      // Background
      const bgP=(transparent/total)*100;
      checks.push({name:'Background ratio',passed:bgP<=70,score:bgP<=70?100:Math.max(0,Math.round(100-(bgP-70)*2)),detail:`BG: ${bgP.toFixed(0)}% (max 70%)`});
      const totalScore=Math.round(checks.reduce((s,c)=>s+c.score,0)/checks.length);
      return{passed:checks.every(c=>c.passed),score:totalScore,checks,suggestions};
    }

    // ══════════════════════════════════════════════════════════════════
    // STYLE UNIVERSE ENGINE
    //
    // The transformation is NOT about forcing a color. It's about:
    // 1. Consistent cinematic lighting (directional, rim, ambient)
    // 2. Atmospheric depth (dark falloff, subtle environmental haze)
    // 3. Clean edge enhancement (not outlines — sharpening + rim light)
    // 4. Selective bloom on bright/emissive areas
    // 5. Color harmony enhancement (boost what's there, don't replace)
    // 6. Professional finish (smooth, polished, no artifacts)
    //
    // Two completely different images should look like they exist
    // in the same game world after this pipeline.
    // ══════════════════════════════════════════════════════════════════

    const IMAGES = [
      { src: './spaceship.png', name: 'SPACESHIP' },
      { src: './PotionBottle.png', name: 'POTION BOTTLE' },
    ];
    const loaded = {};
    let loadCount = 0;

    for (const info of IMAGES) {
      const img = new Image();
      img.src = info.src;
      img.onload = () => {
        loaded[info.name] = img;
        loadCount++;
        if (loadCount === IMAGES.length) setTimeout(render, 50);
      };
    }

    function getOpts() {
      const o = {
        contrast: parseInt(document.getElementById('contrast').value) / 100,
        atmosphere: parseInt(document.getElementById('atmosphere').value) / 100,
        bloom: parseInt(document.getElementById('bloom').value) / 100,
        rim: parseInt(document.getElementById('rim').value) / 100,
        depth: parseInt(document.getElementById('depth').value) / 100,
        warmth: parseInt(document.getElementById('warmth').value),
      };
      document.getElementById('contrastV').textContent = o.contrast.toFixed(2);
      document.getElementById('atmosphereV').textContent = Math.round(o.atmosphere*100)+'%';
      document.getElementById('bloomV').textContent = Math.round(o.bloom*100)+'%';
      document.getElementById('rimV').textContent = Math.round(o.rim*100)+'%';
      document.getElementById('depthV').textContent = Math.round(o.depth*100)+'%';
      document.getElementById('warmthV').textContent = (o.warmth>=0?'+':'')+o.warmth;
      return o;
    }

    // ── Pipeline step: background isolation ──
    function detectBackground(ctx, w, h) {
      const d = ctx.getImageData(0, 0, w, h).data;
      // Sample edges to find background color
      const samples = [];
      for (let x = 0; x < w; x += Math.max(1, w/20|0)) {
        samples.push([d[x*4], d[x*4+1], d[x*4+2]]);
        const bi = ((h-1)*w+x)*4;
        samples.push([d[bi], d[bi+1], d[bi+2]]);
      }
      for (let y = 0; y < h; y += Math.max(1, h/20|0)) {
        const li = (y*w)*4, ri = (y*w+w-1)*4;
        samples.push([d[li], d[li+1], d[li+2]]);
        samples.push([d[ri], d[ri+1], d[ri+2]]);
      }
      // Median color
      samples.sort((a,b) => (a[0]+a[1]+a[2]) - (b[0]+b[1]+b[2]));
      const mid = samples[samples.length/2|0];
      return mid;
    }

    // ── Pipeline: full conversion ──
    function convertAsset(img, opts) {
      // Work at high resolution (cap at 500px on longest side for performance)
      const maxSize = 500;
      const aspect = img.naturalWidth / img.naturalHeight;
      const w = aspect >= 1 ? Math.min(maxSize, img.naturalWidth) : Math.round(Math.min(maxSize, img.naturalHeight) * aspect);
      const h = aspect >= 1 ? Math.round(w / aspect) : Math.min(maxSize, img.naturalHeight);

      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      // Detect background
      const bgColor = detectBackground(ctx, w, h);
      const bgLum = bgColor[0]*0.299 + bgColor[1]*0.587 + bgColor[2]*0.114;

      // ── STEP 1: Background → deep dark with subtle atmosphere ──
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      const bgThreshold = 45;

      // Build foreground mask (distance from bg color)
      const fgMask = new Float64Array(w * h);
      for (let i = 0; i < d.length; i += 4) {
        const dist = Math.sqrt(
          (d[i]-bgColor[0])**2 + (d[i+1]-bgColor[1])**2 + (d[i+2]-bgColor[2])**2
        );
        fgMask[i/4] = Math.max(0, Math.min(1, (dist - bgThreshold/2) / bgThreshold));
      }

      // ── STEP 2: Per-pixel processing ──
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const fg = fgMask[i/4];

          if (fg < 0.05) {
            // Background → dark atmospheric
            const atm = opts.atmosphere;
            d[i]   = Math.round(8 + d[i] * 0.03 * atm);
            d[i+1] = Math.round(7 + d[i+1] * 0.02 * atm);
            d[i+2] = Math.round(10 + d[i+2] * 0.04 * atm);
            continue;
          }

          let r = d[i], g = d[i+1], b = d[i+2];

          // ── Contrast enhancement ──
          const mid = 128;
          r = Math.max(0, Math.min(255, mid + (r - mid) * opts.contrast));
          g = Math.max(0, Math.min(255, mid + (g - mid) * opts.contrast));
          b = Math.max(0, Math.min(255, mid + (b - mid) * opts.contrast));

          // ── Warmth adjustment (subtle, not color replacement) ──
          if (opts.warmth !== 0) {
            const lum = r*0.299 + g*0.587 + b*0.114;
            const lumNorm = lum / 255;
            // Warmth affects highlights more than shadows
            const warmEffect = opts.warmth * lumNorm * 0.015;
            r = Math.max(0, Math.min(255, r + warmEffect * 40));
            g = Math.max(0, Math.min(255, g + warmEffect * 10));
            b = Math.max(0, Math.min(255, b - warmEffect * 15));
          }

          // ── Atmospheric darkening at edges of foreground ──
          if (fg < 0.8) {
            const edgeFade = fg;
            const atm = opts.atmosphere * 0.5;
            r = r * edgeFade + 8 * (1 - edgeFade) * atm + r * (1 - atm) * (1 - edgeFade);
            g = g * edgeFade + 7 * (1 - edgeFade) * atm + g * (1 - atm) * (1 - edgeFade);
            b = b * edgeFade + 10 * (1 - edgeFade) * atm + b * (1 - atm) * (1 - edgeFade);
          }

          d[i] = Math.round(Math.max(0, Math.min(255, r)));
          d[i+1] = Math.round(Math.max(0, Math.min(255, g)));
          d[i+2] = Math.round(Math.max(0, Math.min(255, b)));
        }
      }
      ctx.putImageData(imgData, 0, 0);

      // ── STEP 3: Edge-aware rim lighting ──
      if (opts.rim > 0.05) {
        const rimData = ctx.getImageData(0, 0, w, h);
        const rd = rimData.data;
        for (let y = 1; y < h-1; y++) {
          for (let x = 1; x < w-1; x++) {
            const idx = y * w + x;
            const fg0 = fgMask[idx];
            if (fg0 < 0.1) continue;

            // Check foreground gradient (edge of object)
            let maxFgDiff = 0;
            let edgeDir = 0; // which side is the edge
            for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
              const nIdx = (y+dy)*w+(x+dx);
              const nFg = fgMask[nIdx] || 0;
              const diff = fg0 - nFg;
              if (diff > maxFgDiff) { maxFgDiff = diff; edgeDir = dx + dy; }
            }

            // Rim light on edges facing away from center
            if (maxFgDiff > 0.15) {
              const i = idx * 4;
              const rimStr = Math.min(1, (maxFgDiff - 0.15) / 0.5) * opts.rim;
              // Use the pixel's own color but brightened for the rim
              const lum = rd[i]*0.299 + rd[i+1]*0.587 + rd[i+2]*0.114;
              const boost = rimStr * (60 + lum * 0.3);
              rd[i]   = Math.min(255, rd[i]   + Math.round(boost * 1.0));
              rd[i+1] = Math.min(255, rd[i+1] + Math.round(boost * 0.9));
              rd[i+2] = Math.min(255, rd[i+2] + Math.round(boost * 1.05));
            }
          }
        }
        ctx.putImageData(rimData, 0, 0);
      }

      // ── STEP 4: Depth vignette ──
      if (opts.depth > 0.05) {
        const vg = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.2, w/2, h/2, Math.max(w,h)*0.65);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, `rgba(0,0,0,${opts.depth * 0.6})`);
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, w, h);
      }

      // ── STEP 5: Selective bloom (only bright areas) ──
      if (opts.bloom > 0.05) {
        // Extract bright regions
        const brightC = document.createElement('canvas');
        brightC.width = w; brightC.height = h;
        const bCtx = brightC.getContext('2d');
        const bData = ctx.getImageData(0, 0, w, h);
        const bd = bData.data;
        const threshold = 160;
        for (let i = 0; i < bd.length; i += 4) {
          const lum = bd[i]*0.299 + bd[i+1]*0.587 + bd[i+2]*0.114;
          if (lum < threshold) {
            bd[i] = 0; bd[i+1] = 0; bd[i+2] = 0; bd[i+3] = 0;
          }
        }
        bCtx.putImageData(bData, 0, 0);

        // Bloom passes
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        ctx.filter = `blur(${4}px)`;
        ctx.globalAlpha = opts.bloom * 0.35;
        ctx.drawImage(brightC, 0, 0);

        ctx.filter = `blur(${12}px)`;
        ctx.globalAlpha = opts.bloom * 0.2;
        ctx.drawImage(brightC, 0, 0);

        ctx.filter = `blur(${30}px)`;
        ctx.globalAlpha = opts.bloom * 0.08;
        ctx.drawImage(brightC, 0, 0);

        ctx.restore();
      }

      // ── STEP 6: Subtle unsharp mask (sharpening for clean detail) ──
      ctx.save();
      const sharpC = document.createElement('canvas');
      sharpC.width = w; sharpC.height = h;
      const sCtx = sharpC.getContext('2d');
      sCtx.filter = 'blur(1px)';
      sCtx.drawImage(c, 0, 0);
      // Subtract blurred from original for high-pass, add back
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.12;
      ctx.drawImage(c, 0, 0); // slight self-brightening as substitute for unsharp
      ctx.restore();

      return c;
    }

    // ── Render ──
    function render() {
      const opts = getOpts();
      const output = document.getElementById('output');
      output.innerHTML = '';

      for (const info of IMAGES) {
        const img = loaded[info.name];
        if (!img) continue;

        const section = document.createElement('div');
        section.className = 'subject';
        const heading = document.createElement('h2');
        heading.textContent = info.name;
        section.appendChild(heading);

        const panels = document.createElement('div');
        panels.className = 'panels';

        // Source
        const srcPanel = document.createElement('div');
        srcPanel.className = 'panel';
        srcPanel.innerHTML = '<h3>ORIGINAL</h3>';
        const srcC = document.createElement('canvas');
        const dispSize = 380;
        const aspect = img.naturalWidth / img.naturalHeight;
        const dispW = aspect >= 1 ? dispSize : dispSize * aspect;
        const dispH = aspect >= 1 ? dispSize / aspect : dispSize;
        srcC.width = img.naturalWidth; srcC.height = img.naturalHeight;
        srcC.style.width = dispW + 'px'; srcC.style.height = dispH + 'px';
        srcC.getContext('2d').drawImage(img, 0, 0);
        srcPanel.appendChild(srcC);
        const srcInfo = document.createElement('div');
        srcInfo.className = 'info';
        srcInfo.textContent = `${img.naturalWidth}×${img.naturalHeight}`;
        srcPanel.appendChild(srcInfo);
        panels.appendChild(srcPanel);

        // Converted
        const converted = convertAsset(img, opts);
        const convPanel = document.createElement('div');
        convPanel.className = 'panel';
        convPanel.innerHTML = '<h3>STYLED</h3>';
        const convC = document.createElement('canvas');
        convC.width = converted.width; convC.height = converted.height;
        convC.style.width = dispW + 'px'; convC.style.height = dispH + 'px';
        convC.getContext('2d').drawImage(converted, 0, 0);
        convPanel.appendChild(convC);
        const convInfo = document.createElement('div');
        convInfo.className = 'info';
        convInfo.textContent = `${converted.width}×${converted.height} // cinematic`;
        convPanel.appendChild(convInfo);
        panels.appendChild(convPanel);

        // Context: on dark background with subtle environment
        const ctxPanel = document.createElement('div');
        ctxPanel.className = 'panel';
        ctxPanel.innerHTML = '<h3>IN CONTEXT</h3>';
        const pad = 40;
        const ctxW = converted.width + pad*2;
        const ctxH = converted.height + pad*2;
        const ctxC = document.createElement('canvas');
        ctxC.width = ctxW; ctxC.height = ctxH;
        ctxC.style.width = (dispW + pad*2 * dispW/converted.width) + 'px';
        ctxC.style.height = (dispH + pad*2 * dispH/converted.height) + 'px';
        const cCtx = ctxC.getContext('2d');

        // Dark environment
        cCtx.fillStyle = '#08070a';
        cCtx.fillRect(0, 0, ctxW, ctxH);

        // Subtle ambient glow behind asset (from its own colors)
        cCtx.save();
        cCtx.filter = 'blur(40px)';
        cCtx.globalAlpha = 0.06;
        cCtx.drawImage(converted, pad-10, pad-10, converted.width+20, converted.height+20);
        cCtx.restore();

        // The asset
        cCtx.drawImage(converted, pad, pad);

        // Subtle reflection below (if there's space)
        cCtx.save();
        cCtx.globalAlpha = 0.04;
        cCtx.translate(0, ctxH);
        cCtx.scale(1, -0.3);
        cCtx.filter = 'blur(2px)';
        cCtx.drawImage(converted, pad, -(converted.height + pad));
        cCtx.restore();

        ctxPanel.appendChild(ctxC);
        const ctxInfo = document.createElement('div');
        ctxInfo.className = 'info';
        ctxInfo.textContent = 'ambient glow + reflection';
        ctxPanel.appendChild(ctxInfo);
        panels.appendChild(ctxPanel);

        // ── STYLE VALIDATOR ──
        const valPanel = document.createElement('div');
        valPanel.className = 'panel';
        valPanel.innerHTML = '<h3>VALIDATION</h3>';
        const valData = cCtx.getImageData(0, 0, ctxW, ctxH);
        const valResult = runValidator(valData);
        const valDiv = document.createElement('div');
        valDiv.style.cssText = 'text-align:left;padding:4px;min-width:180px';

        const scoreColor = valResult.score >= 70 ? '#4a4' : valResult.score >= 45 ? '#aa4' : '#a44';
        valDiv.innerHTML = `<div style="font-size:16px;color:${scoreColor};font-family:Orbitron,sans-serif;text-align:center;margin-bottom:6px">${valResult.score}<span style="font-size:8px;color:#555">/100</span></div>`;
        valDiv.innerHTML += `<div style="font-size:8px;color:${valResult.passed?'#4a4':'#a44'};text-align:center;margin-bottom:8px">${valResult.passed?'✓ PASSED':'✗ FAILED'}</div>`;

        for (const check of valResult.checks) {
          const cColor = check.passed ? '#4a4' : check.score > 50 ? '#aa4' : '#a44';
          valDiv.innerHTML += `<div style="font-size:6px;color:${cColor};margin-bottom:3px;line-height:1.4">${check.passed?'✓':'✗'} ${check.name}: ${check.score}<br><span style="color:#444">${check.detail}</span></div>`;
        }

        if (valResult.suggestions.length > 0) {
          valDiv.innerHTML += '<div style="font-size:6px;color:#aa4;margin-top:6px;border-top:1px solid #222;padding-top:4px">SUGGESTIONS:</div>';
          for (const s of valResult.suggestions) {
            valDiv.innerHTML += `<div style="font-size:5px;color:#886;margin-top:2px">→ ${s}</div>`;
          }
        }

        valPanel.appendChild(valDiv);
        panels.appendChild(valPanel);

        section.appendChild(panels);
        output.appendChild(section);
      }

      document.getElementById('status').textContent = 'PIPELINE COMPLETE — VALIDATION CHECKED';
    }

    let debounce;
    document.querySelectorAll('input[type=range]').forEach(el => {
      el.addEventListener('input', () => {
        getOpts();
        clearTimeout(debounce);
        debounce = setTimeout(render, 150);
      });
    });
  </script>
</body>
</html>
