<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Engine - Sleek Futuristic Conversion</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#080608;color:#fff;font-family:'Share Tech Mono',monospace;padding:20px;display:flex;flex-direction:column;align-items:center}
    h1{font-size:14px;font-family:'Orbitron',sans-serif;color:#cc3333;letter-spacing:4px;text-shadow:0 0 12px rgba(200,50,50,0.4);margin-bottom:4px}
    .sub{font-size:10px;color:#553333;margin-bottom:20px;letter-spacing:2px}
    .subject{margin-bottom:32px;width:100%}
    .subject h2{font-size:11px;font-family:'Orbitron',sans-serif;color:#993333;letter-spacing:3px;margin-bottom:12px;text-align:center}
    .panels{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
    .panel{text-align:center}
    .panel h3{font-size:9px;color:#664444;letter-spacing:2px;margin-bottom:6px;font-family:'Orbitron',sans-serif}
    .panel canvas{display:block;margin:0 auto}
    .panel .info{font-size:8px;color:#553333;margin-top:4px}
    #status{font-size:9px;color:#cc4444;text-shadow:0 0 6px rgba(200,50,50,0.3);margin:12px 0}
    .ref-panel{border:1px solid #331515;padding:12px;background:rgba(200,30,30,0.02);margin-bottom:24px;text-align:center}
    .ref-panel img{max-width:700px;width:100%;border:1px solid #221010}
    .ref-panel .label{font-size:8px;color:#663333;margin-top:6px;letter-spacing:2px}
  </style>
</head>
<body>
  <h1>STYLE CONVERSION v3</h1>
  <p class="sub">ULTRA-SLEEK  //  FUTURISTIC  //  HOLOGRAPHIC</p>

  <div class="ref-panel">
    <img src="./FINALSAMPLE.jpg" alt="Style Reference">
    <div class="label">STYLE REFERENCE — COCKPIT HUD AESTHETIC</div>
  </div>

  <div id="output"></div>
  <p id="status">INITIALIZING SYSTEMS...</p>

  <script>
    // ══════════════════════════════════════════════════════════════════
    // STYLE v3: Ultra-sleek futuristic / near-photorealistic
    //
    // Key principles from reference:
    // - Dark backgrounds with warm subtle tint
    // - Thin red/crimson wireframe UI overlays (1-2px)
    // - Cyan/teal secondary accents (sparse)
    // - Holographic translucent panels
    // - Selective glow/bloom on bright elements
    // - Clean, smooth — no pixellation, no noise
    // - Depth via vignette, subtle gradients
    // - Scan-line / holographic interference effects
    // ══════════════════════════════════════════════════════════════════

    function hsl2rgb(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return[(r+m)*255+0.5|0,(g+m)*255+0.5|0,(b+m)*255+0.5|0]}
    function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=((g-b)/d+(g<b?6:0))*60;else if(mx===g)h=((b-r)/d+2)*60;else h=((r-g)/d+4)*60}return[h,s*100,l*100]}

    const IMAGES = [
      { src: './spaceship.png', name: 'SPACESHIP', size: 350 },
      { src: './PotionBottle.png', name: 'POTION BOTTLE', size: 350 },
    ];

    const loaded = {};
    let loadCount = 0;

    for (const info of IMAGES) {
      const img = new Image();
      img.src = info.src;
      img.onload = () => {
        loaded[info.name] = img;
        loadCount++;
        if (loadCount === IMAGES.length) setTimeout(render, 50);
      };
    }

    // ── CONVERSION PIPELINE ──

    function convertSleek(img, targetSize) {
      // Determine output dimensions
      const aspect = img.naturalWidth / img.naturalHeight;
      const outW = aspect >= 1 ? targetSize : Math.round(targetSize * aspect);
      const outH = aspect >= 1 ? Math.round(targetSize / aspect) : targetSize;

      const canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outH;
      const ctx = canvas.getContext('2d');

      // ── Step 1: Draw source, downscaled ──
      ctx.drawImage(img, 0, 0, outW, outH);

      // ── Step 2: Color grade — shift toward dark cinematic red palette ──
      const imgData = ctx.getImageData(0, 0, outW, outH);
      const d = imgData.data;

      // Detect background (corner sampling)
      const corners = [[0,0],[outW-1,0],[0,outH-1],[outW-1,outH-1]];
      let bgR=0,bgG=0,bgB=0;
      for (const [cx,cy] of corners) {
        const ci = (cy*outW+cx)*4;
        bgR += d[ci]; bgG += d[ci+1]; bgB += d[ci+2];
      }
      bgR/=4; bgG/=4; bgB/=4;

      for (let i = 0; i < d.length; i += 4) {
        let r = d[i], g = d[i+1], b = d[i+2], a = d[i+3];

        // Background detection — make truly dark
        const bgDist = Math.sqrt((r-bgR)**2 + (g-bgG)**2 + (b-bgB)**2);
        if (bgDist < 40) {
          // Deep space dark with warm tint
          d[i] = 8 + Math.round(r * 0.03);
          d[i+1] = 5 + Math.round(g * 0.02);
          d[i+2] = 6 + Math.round(b * 0.02);
          continue;
        }

        let [h, s, l] = rgb2hsl(r, g, b);

        // Increase contrast
        l = l < 50 ? l * 0.7 : 50 + (l - 50) * 1.2;
        l = Math.max(0, Math.min(100, l));

        // Boost saturation slightly
        s = Math.min(100, s * 1.15);

        // Warm shift: pull highlights toward amber/gold
        if (l > 60) {
          h = (h + (l - 60) * 0.3) % 360; // slight warm shift
          s = Math.min(100, s + (l - 60) * 0.2);
        }

        // Cool darks: subtle blue-red tint in shadows
        if (l < 30) {
          h = (h * 0.7 + 350 * 0.3 + 360) % 360; // pull toward deep red
          s = Math.min(100, s * 0.8 + 8);
        }

        const [nr, ng, nb] = hsl2rgb(h, s, l);
        d[i] = nr; d[i+1] = ng; d[i+2] = nb;
      }

      ctx.putImageData(imgData, 0, 0);

      // ── Step 3: Vignette (dark edges) ──
      const vg = ctx.createRadialGradient(outW/2, outH/2, Math.min(outW,outH)*0.25, outW/2, outH/2, Math.max(outW,outH)*0.65);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, outW, outH);

      // ── Step 4: Subtle scan lines (holographic interference) ──
      ctx.save();
      for (let y = 0; y < outH; y += 3) {
        ctx.fillStyle = `rgba(0,0,0,${0.04 + Math.sin(y * 0.5) * 0.01})`;
        ctx.fillRect(0, y, outW, 1);
      }
      ctx.restore();

      // ── Step 5: Bloom on bright areas ──
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.filter = 'blur(8px) brightness(0.6)';
      ctx.globalAlpha = 0.2;
      ctx.drawImage(canvas, 0, 0);
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.filter = 'blur(20px) brightness(0.3)';
      ctx.globalAlpha = 0.1;
      ctx.drawImage(canvas, 0, 0);
      ctx.restore();

      // ── Step 6: Thin red wireframe overlay (HUD targeting frame) ──
      ctx.save();
      ctx.strokeStyle = 'rgba(200, 40, 40, 0.35)';
      ctx.lineWidth = 1;
      ctx.shadowColor = 'rgba(200, 40, 40, 0.3)';
      ctx.shadowBlur = 6;

      // Corner brackets
      const mg = 8, cs = 18;
      // Top-left
      ctx.beginPath(); ctx.moveTo(mg, mg+cs); ctx.lineTo(mg, mg); ctx.lineTo(mg+cs, mg); ctx.stroke();
      // Top-right
      ctx.beginPath(); ctx.moveTo(outW-mg-cs, mg); ctx.lineTo(outW-mg, mg); ctx.lineTo(outW-mg, mg+cs); ctx.stroke();
      // Bottom-left
      ctx.beginPath(); ctx.moveTo(mg, outH-mg-cs); ctx.lineTo(mg, outH-mg); ctx.lineTo(mg+cs, outH-mg); ctx.stroke();
      // Bottom-right
      ctx.beginPath(); ctx.moveTo(outW-mg-cs, outH-mg); ctx.lineTo(outW-mg, outH-mg); ctx.lineTo(outW-mg, outH-mg-cs); ctx.stroke();

      // Center crosshair (subtle)
      ctx.strokeStyle = 'rgba(200, 40, 40, 0.15)';
      ctx.lineWidth = 0.5;
      const chSize = 10;
      ctx.beginPath();
      ctx.moveTo(outW/2 - chSize, outH/2); ctx.lineTo(outW/2 - 3, outH/2);
      ctx.moveTo(outW/2 + 3, outH/2); ctx.lineTo(outW/2 + chSize, outH/2);
      ctx.moveTo(outW/2, outH/2 - chSize); ctx.lineTo(outW/2, outH/2 - 3);
      ctx.moveTo(outW/2, outH/2 + 3); ctx.lineTo(outW/2, outH/2 + chSize);
      ctx.stroke();

      // Targeting circle
      ctx.strokeStyle = 'rgba(200, 40, 40, 0.12)';
      ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.arc(outW/2, outH/2, Math.min(outW, outH) * 0.35, 0, Math.PI * 2); ctx.stroke();

      ctx.restore();

      // ── Step 7: Data readouts ──
      ctx.save();
      ctx.font = '7px "Share Tech Mono", monospace';
      ctx.fillStyle = 'rgba(200, 50, 50, 0.5)';
      ctx.shadowColor = 'rgba(200, 40, 40, 0.3)';
      ctx.shadowBlur = 4;
      ctx.textAlign = 'left';
      ctx.fillText('SCAN ACTIVE', mg + 2, outH - mg - 4);
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(60, 180, 180, 0.4)';
      ctx.fillText('LOCKED', outW - mg - 2, outH - mg - 4);

      // Top label
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(200, 50, 50, 0.4)';
      ctx.font = '6px "Share Tech Mono", monospace';
      ctx.fillText('◆  ASSET RENDER  ◆', outW/2, mg + 8);
      ctx.restore();

      // ── Step 8: Edge highlight glow (subtle rim light on the object) ──
      // Re-read the image data and find bright edges to add a colored rim
      const finalData = ctx.getImageData(0, 0, outW, outH);
      const fd = finalData.data;
      for (let y = 1; y < outH - 1; y++) {
        for (let x = 1; x < outW - 1; x++) {
          const i = (y * outW + x) * 4;
          const lum = fd[i]*0.299 + fd[i+1]*0.587 + fd[i+2]*0.114;

          // Find edges (brightness difference with neighbors)
          let maxDiff = 0;
          for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
            const ni = ((y+dy)*outW+(x+dx))*4;
            const nLum = fd[ni]*0.299 + fd[ni+1]*0.587 + fd[ni+2]*0.114;
            maxDiff = Math.max(maxDiff, Math.abs(lum - nLum));
          }

          // On strong edges of bright objects, add a subtle colored rim
          if (maxDiff > 30 && lum > 40) {
            const rimStrength = Math.min(1, (maxDiff - 30) / 80) * 0.15;
            // Warm rim on bright side
            if (lum > 100) {
              fd[i] = Math.min(255, fd[i] + Math.round(40 * rimStrength));
              fd[i+1] = Math.min(255, fd[i+1] + Math.round(15 * rimStrength));
            }
          }
        }
      }
      ctx.putImageData(finalData, 0, 0);

      return canvas;
    }

    // ── Render both subjects ──
    function render() {
      const output = document.getElementById('output');
      output.innerHTML = '';

      for (const info of IMAGES) {
        const img = loaded[info.name];
        if (!img) continue;

        const section = document.createElement('div');
        section.className = 'subject';
        const heading = document.createElement('h2');
        heading.textContent = info.name;
        section.appendChild(heading);

        const panels = document.createElement('div');
        panels.className = 'panels';

        // Source
        const srcPanel = document.createElement('div');
        srcPanel.className = 'panel';
        srcPanel.innerHTML = '<h3>SOURCE</h3>';
        const srcC = document.createElement('canvas');
        const srcSize = 250;
        const srcAspect = img.naturalWidth / img.naturalHeight;
        srcC.width = img.naturalWidth; srcC.height = img.naturalHeight;
        srcC.style.width = (srcAspect >= 1 ? srcSize : srcSize * srcAspect) + 'px';
        srcC.style.height = (srcAspect >= 1 ? srcSize / srcAspect : srcSize) + 'px';
        srcC.getContext('2d').drawImage(img, 0, 0);
        srcPanel.appendChild(srcC);
        const srcInfo = document.createElement('div');
        srcInfo.className = 'info';
        srcInfo.textContent = `${img.naturalWidth}×${img.naturalHeight}`;
        srcPanel.appendChild(srcInfo);
        panels.appendChild(srcPanel);

        // Converted
        const converted = convertSleek(img, info.size);

        const convPanel = document.createElement('div');
        convPanel.className = 'panel';
        convPanel.innerHTML = '<h3>STYLED</h3>';
        const convC = document.createElement('canvas');
        convC.width = converted.width; convC.height = converted.height;
        convC.style.width = (converted.width * 1.5) + 'px';
        convC.style.height = (converted.height * 1.5) + 'px';
        convC.getContext('2d').drawImage(converted, 0, 0);
        convPanel.appendChild(convC);
        const convInfo = document.createElement('div');
        convInfo.className = 'info';
        convInfo.textContent = `${converted.width}×${converted.height} styled`;
        convPanel.appendChild(convInfo);
        panels.appendChild(convPanel);

        // On HUD panel (game context)
        const hudPanel = document.createElement('div');
        hudPanel.className = 'panel';
        hudPanel.innerHTML = '<h3>HUD CONTEXT</h3>';
        const hudW = converted.width + 40;
        const hudH = converted.height + 60;
        const hudC = document.createElement('canvas');
        hudC.width = hudW; hudC.height = hudH;
        hudC.style.width = (hudW * 1.5) + 'px';
        hudC.style.height = (hudH * 1.5) + 'px';
        const hCtx = hudC.getContext('2d');

        // Dark background
        hCtx.fillStyle = '#080608';
        hCtx.fillRect(0, 0, hudW, hudH);

        // Grid underlay
        hCtx.strokeStyle = 'rgba(200, 40, 40, 0.04)';
        hCtx.lineWidth = 0.5;
        for (let gx = 0; gx < hudW; gx += 20) { hCtx.beginPath(); hCtx.moveTo(gx, 0); hCtx.lineTo(gx, hudH); hCtx.stroke(); }
        for (let gy = 0; gy < hudH; gy += 20) { hCtx.beginPath(); hCtx.moveTo(0, gy); hCtx.lineTo(hudW, gy); hCtx.stroke(); }

        // Outer frame
        hCtx.strokeStyle = 'rgba(200, 40, 40, 0.3)';
        hCtx.lineWidth = 1;
        hCtx.shadowColor = 'rgba(200, 40, 40, 0.2)';
        hCtx.shadowBlur = 8;
        hCtx.strokeRect(4, 4, hudW - 8, hudH - 8);

        // Inner frame
        hCtx.strokeStyle = 'rgba(200, 40, 40, 0.1)';
        hCtx.lineWidth = 0.5;
        hCtx.shadowBlur = 0;
        hCtx.strokeRect(8, 8, hudW - 16, hudH - 16);

        // Draw converted image
        hCtx.drawImage(converted, 20, 30);

        // Title bar
        hCtx.fillStyle = 'rgba(200, 40, 40, 0.06)';
        hCtx.fillRect(4, 4, hudW - 8, 20);
        hCtx.font = '8px "Orbitron", sans-serif';
        hCtx.fillStyle = 'rgba(200, 50, 50, 0.6)';
        hCtx.textAlign = 'center';
        hCtx.shadowColor = 'rgba(200, 40, 40, 0.3)';
        hCtx.shadowBlur = 4;
        hCtx.fillText(info.name + '  //  ASSET DATABASE', hudW/2, 17);

        // Bottom bar
        hCtx.fillStyle = 'rgba(200, 40, 40, 0.04)';
        hCtx.fillRect(4, hudH - 24, hudW - 8, 20);
        hCtx.font = '7px "Share Tech Mono", monospace';
        hCtx.fillStyle = 'rgba(60, 180, 180, 0.45)';
        hCtx.textAlign = 'left';
        hCtx.fillText('STATUS: NOMINAL', 12, hudH - 10);
        hCtx.textAlign = 'right';
        hCtx.fillStyle = 'rgba(200, 50, 50, 0.45)';
        hCtx.fillText('SYS ONLINE', hudW - 12, hudH - 10);

        // Status dots
        hCtx.shadowBlur = 6;
        hCtx.fillStyle = 'rgba(60, 200, 60, 0.6)';
        hCtx.beginPath(); hCtx.arc(hudW - 80, hudH - 13, 2, 0, Math.PI * 2); hCtx.fill();
        hCtx.fillStyle = 'rgba(200, 50, 50, 0.6)';
        hCtx.beginPath(); hCtx.arc(12, 13, 2, 0, Math.PI * 2); hCtx.fill();

        // Bloom on HUD
        hCtx.save();
        hCtx.globalCompositeOperation = 'lighter';
        hCtx.filter = 'blur(10px)';
        hCtx.globalAlpha = 0.04;
        hCtx.drawImage(hudC, 0, 0);
        hCtx.restore();

        hudPanel.appendChild(hudC);
        const hudInfo = document.createElement('div');
        hudInfo.className = 'info';
        hudInfo.textContent = 'HOLOGRAPHIC DISPLAY';
        hudPanel.appendChild(hudInfo);
        panels.appendChild(hudPanel);

        section.appendChild(panels);
        output.appendChild(section);
      }

      document.getElementById('status').textContent = 'SYSTEMS NOMINAL  //  CONVERSION COMPLETE';
    }
  </script>
</body>
</html>
